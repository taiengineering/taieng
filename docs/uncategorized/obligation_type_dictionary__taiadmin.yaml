## 8종 Type (현재 추출기 사용)

### ACTION (catch-all)
일반 행위 의무. 더 구체적 type 없을 때.

```yaml
verb_stems:
  - 시행하|시행해|시행하여야
  - 운영하|운영해
  - 수행하|수행해
  - 이행하|이행해
  - 유지하|유지해
  - 관리하|관리해
  - 조치하|조치해
nouns_phrases:
  - "조치를 해야"
  - "조치를 하여야"
  - "의결을 거쳐야"
```

**Notes**: SET-001에서 51.3% 편향. 8종 한계 신호. "고시"·"공시"·"규정 정함" 등이 PUBLISH/REGULATE에 더 가까우나 현재 8종에 없어 ACTION에 모임.

### REPORT
외부에 정보 제공.

```yaml
verb_stems:
  - 보고하|보고해|보고해야
  - 통지하|통지해
  - 통보하|통보해
  - 제출하|제출해
  - 공개하|공개해
  - 게시하|게시해
excluded_overlap:
  - 고시: PUBLISH 후보 (현재 ACTION으로 모임)
```

### INSPECT
확인·검사 행위.

```yaml
verb_stems:
  - 확인하|확인해
  - 검사하|검사해
  - 평가하|평가해
  - 점검하|점검해
  - 조사하|조사해
  - 진단하|진단해
  - 심사하|심사해
```

### RECORD
기록·보존·작성.

```yaml
verb_stems:
  - 기록하|기록해
  - 보존하|보존해
  - 작성하|작성해
  - 보관하|보관해
  - 기명날인하
```

### INSTALL
설치·시공.

```yaml
verb_stems:
  - 설치하|설치해
  - 시공하|시공해
  - 구축하|구축해
overlap_with:
  POSSESS: '"갖추어 두는"은 INSTALL과 POSSESS 사이 모호'
```

### POSSESS
비치·소지·갖춤.

```yaml
verb_stems:
  - 비치하|비치해
  - 소지하|소지해
nouns_phrases:
  - "갖추어 두어야"
  - "갖추어 두는"
overlap_with:
  INSTALL: 위 동일
```

### EDUCATION
교육·훈련.

```yaml
verb_stems:
  - 교육하|교육해|교육시켜
  - 훈련하|훈련해|훈련시켜
```

### APPOINT
선임·임명·지정 (인사·인사적 행위).

```yaml
verb_stems:
  - 선임하|선임해
  - 임명하|임명해
  - 지정하|지정해
excluded:
  - 고시: 공시·발표 행위, 인사 아님 (검증 v1 false positive 원인)
  - 위탁: 업무 위탁, 인사 아님 (검증 v1 false positive 원인)
  - 의무 위탁: 행위 위임, 사람 임명 아님
```

**Revisions**:
- v0.1 (2026-05-05): "고시"·"위탁" 제거 — SET-001 ACTION 편향 진단에서 false positive 원인으로 발견. 38조의8 "기준 고시"·7조의2 "대행 위탁"이 잘못 APPOINT로 매칭됨.

