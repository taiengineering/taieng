## 사용 가이드

### 검증기에서 사용 (정적 매칭, 자기 충족 회피)

```sql
-- ACTION drafts 중 다른 type 매칭 검출
WITH action_drafts AS (...)
SELECT
  obligation_summary,
  CASE
    WHEN obligation_summary ~ '(보고|통지|통보|제출|공개|게시)(하|해|함)' THEN 'REPORT 누락'
    WHEN obligation_summary ~ '(확인|검사|평가|점검|조사|진단|심사)(하|해|함)' THEN 'INSPECT 누락'
    -- ...
    -- candidate types도 매칭 (PUBLISH·REGULATE·DELEGATE)
    WHEN obligation_summary ~ '(고시|공시|발표|공포)(하|해|함)' THEN 'PUBLISH 후보 (ACTION 합당, 8종 한계)'
    WHEN obligation_summary ~ '(통제|제한|규제)(하|해|함)' THEN 'REGULATE 후보 (ACTION 합당, 8종 한계)'
    WHEN obligation_summary ~ '(위탁|위임|이관|대행)(하|해|함|하도록)' THEN 'DELEGATE 후보 (ACTION 합당, 8종 한계)'
    ELSE 'ACTION 정당'
  END AS judgment
FROM action_drafts;
```

candidate type 매칭 시 "ACTION 합당"으로 판단 (8종 한계 신호이지 추출기 약점 아님).

### 추출기에는 미적용

PROMPT에 이 사전을 보여주지 않음. LLM이 8종 중 자유 판단. 추출기 변경하려면 type 셋 확장(8→9~11) 자체를 PROMPT 설계에 반영 — 이는 별도 의사결정.

