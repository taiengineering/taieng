## Candidate Types (8종 한계 — 확장 검토)

### PUBLISH (제안)
공시·고시·발표·공포.

```yaml
verb_stems:
  - 고시하|고시해|고시해야
  - 공시하|공시해
  - 발표하|발표해
  - 공포하|공포해
rationale: |
  현재 ACTION에 모임. 예: 38조의8 ③항 "감독 기준을 정하여 고시하여야 한다".
  REPORT(특정 대상에 보고)와 다름 — 일반 공중 대상.
estimated_impact: ACTION drafts 중 ~10%가 이쪽 (38·39 drafts 등)
```

### REGULATE (제안)
규제·통제·제한.

```yaml
verb_stems:
  - 통제하|통제해
  - 제한하|제한해
  - 규제하|규제해
nouns_phrases:
  - "~을 제한해야"
  - "~을 통제해야"
rationale: |
  "운영 통제·제한" 행위. 현재 ACTION에 모임.
```

### DELEGATE (제안)
위탁·위임·이관 (업무 위탁, 인사 임명 아님).

```yaml
verb_stems:
  - 위탁하|위탁해
  - 위임하|위임해
  - 이관하|이관해
nouns_phrases:
  - "대행하도록 해야"
  - "위탁하도록 해야"
overlap_with:
  APPOINT: 위탁은 업무 위탁, 인사 위임 아님 (혼동 주의)
rationale: |
  예: 7조의2 ②항 "기관에 청약접수 및 선정 업무를 대행하도록 해야 한다".
  현재 ACTION에 모임.
estimated_impact: ACTION drafts 중 ~5%
```

