# Obligation Type 사전 (외부 ground truth)

> **목적**: type별 동사 사전을 외부 명세로 보존.
> 검증기는 정적 매칭으로 사용. 추출기는 LLM 자유 판단 유지.
> 다른 메커니즘 + 같은 ground truth → 자기 충족 회피하면서 cross-check 가능.

---

## 설계 원칙

1. **External Ground Truth** — 사전은 사람(법령 도메인 지식)이 명세
2. **Dual Mechanism** — LLM 추론 vs 정적 사전 매칭
3. **Cumulative** — 검증 결과 분석 → 사전 보강 → 다음 검증 정확
4. **No Self-Reinforcement** — 추출기 PROMPT에 사전 미적용 (자기 충족 회피)

