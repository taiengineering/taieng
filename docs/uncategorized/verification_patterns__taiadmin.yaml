---

## 카테고리

### A. 의무 본문 동사 검증
draft 본문에 **의무 동사(shall/must 류)** 1개 이상 존재 여부.
- reference: `scripts/judge_orphan_rules.py` v2 — 의무 동사 사전 16종 ("할 것", "하여야 한다" 등)
- rules: _(sample 1 + group 1 + group 2 모두 PASS — 누적 시 룰 등록)_

### B. 본문 정합성
draft 본문이 원본 `article_text` 내 substring으로 실제 존재하는가. **환각·요약 변형·필드 누락 검출**.

> **B 카테고리 정리 메모 (v0.3 기준)**: B-1~B-4 모두 normalize 영역. 룰 셋 안정화 단계에서 단일 `B-norm` 파이프라인으로 통합 권장. 현재는 발견 흔적 보존 위해 분리 유지.

#### B-1. 가운뎃점 normalize 후 substring 검사
- **discovered**: sample 1 5/5 + group 1 6/6 + group 2 5/5 = **16/16 drafts (100% 재현)**
- **현상**: article_text는 `ㆍ`(U+318D, 한글 가운뎃점), draft `obligation_summary`는 `·`(U+00B7, 라틴 가운뎃점). 추출 단계에서 자동 변형됨
- **영향**: 단순 substring 검사 시 모든 draft가 false fail
- **검증 SQL** (예시):
  ```sql
  WHERE replace(replace(obligation_summary, '·', '@@'), 'ㆍ', '@@')
        NOT LIKE '%' || replace(replace(article_text, '·', '@@'), 'ㆍ', '@@') || '%'
  ```
- **추출 룰 보강 후보**: `rule_patterns.yaml`에 "가운뎃점 원본 보존" 룰 추가 검토

#### B-2. 각 호(各號) 압축 통합 (v0.2 신규)
- **discovered**: group 1 — 산안법 시규 167조 draft no.9
- **현상**: article_text ①항 본문 "다음 각 호의 어느 하나에 해당하는 장소 또는 전산장비에 항상 물질안전보건자료를 게시하거나 갖추어 두어야 한다" + 각 호 1·2·3 = "작업공정 장소 / 잘 보이는 장소 / 전산장비". draft no.9 본문은 이 각 호의 내용을 본 의무문에 통합 압축
- **영향**: 단순 substring 검사 fail. 그러나 정보 보존된 합리적 처리
- **검증 룰**: article_text에 "다음 각 호의 어느 하나" 패턴이 있고 그 article의 draft 본문이 substring fail이면, 각 호 텍스트를 추출해서 normalize 비교
- **추출 룰 보강 후보**: 처리 자체는 합당. 룰화 시 "각 호 통합 vs 별 draft 분해" 일관성 명문화 검토

#### B-3. 어순 변경 + 문맥 보강 ⭐ (v0.3 신규)
- **discovered**: group 2 — 정통공사업법 7조 draft no.25
- **현상**:
  - article: "발주자는 용역업자에게 **공사의** 설계를 발주하여야 한다"
  - draft: "발주자는 **정보통신공사의** 설계를 용역업자에게 발주하여야 한다"
  - "공사" → "정보통신공사" 문맥 보강 (해당 article은 정보통신공사업법) + 어순 변경
- **회고 적용 (sample 1)**: 산안법 24조 ①항 draft no.1에서도 동일 패턴 — article은 "사업장에 근로자위원과 사용자위원이…", draft는 "사업장의 안전 및 보건에 관한 중요 사항을 심의·의결하기 위하여 근로자위원과 사용자위원이…" — 목적절 추가 + 어순 변경. 그룹 2에서야 인식
- **영향**: 단순 substring fail. 의미는 보존되거나 강화됨
- **검증 룰**: substring fail 시 키워드(주어·목적어·동사) 단위 분해 후 article_text에 모두 존재하는지 검사
- **추출 룰 보강 후보**: 어순·보강은 합당하나 **얼마나 자유로운가** 기준 필요. 명시 보강(법명 약어→풀이름)은 OK, 의미 추가(목적절)는 검토 필요

#### B-4. 의무 어미 normalize ⭐ (v0.3 신규)
- **discovered**: group 2 — 재난법 시령 26조 drafts no.30, no.31
- **현상**:
  - article: "조치를 **해야 한다**", "공개**해야 한다**"
  - draft: "조치를 **하여야 한다**", "공개**하여야 한다**"
  - "해야 한다" ↔ "하여야 한다" 변형. 두 drafts 모두 적용
- **영향**: 의미 동일, substring fail. judge_orphan_rules.py 의무 동사 사전(16종)이 이미 다루는 영역
- **검증 룰**: normalize 매핑
  ```python
  ENDING_NORMALIZE = {
      '해야 한다': '하여야 한다',
      '한다': '하여야 한다',  # 일부 경우만
      '할 것': '하여야 한다',
      # ...
  }
  ```
- **추출 룰 보강 후보**: 의무 어미를 일관 형식으로 강제 (원본 보존 vs 표준화 둘 중 결정)

### C. 메타 일치성
draft.target / type / category가 본문 **동사·주어**와 모순되지 않는가.

#### C-1. target이 본문 substring으로 존재하지 않을 때 추론 표시 강제
- **discovered**: sample 1 — draft no.15·16 (건축물분양 시규 7조의2 ④항)
- **현상**: ④항 본문 "공개모집은 1일 8시간 이상으로 해야 하며, … 공개추첨은 공개모집이 끝난 이후에 해야 한다" — 주어 미명시. draft target=`분양사업자`로 부여 (②항 주어 계승 추론)
- **영향**: 추론은 합리적이나, 명시적 표시 없으면 추론·명시 구분 불가
- **검증 룰**: `target` 값이 article_text에 substring으로 존재하지 않으면 `ai_flags.target_inferred=true` 강제. 미부여 시 검증 실패
- **추출 룰 보강 후보**: PROMPT v3.0.1 → v3.0.2에 "target 추론 시 표시 의무" 추가

#### C-2. target 조사·표기 변형 ⭐ (v0.3 신규)
- **discovered**: group 2 — 정통공사업법 7조 draft no.26
- **현상**:
  - article: "**설계도서를 작성한 자**는 그 설계도서에 서명…"
  - draft target: "**설계도서 작성자**"
  - 의미 동일하나 substring fail (조사 차이 + 명사화)
- **영향**: C-1의 검증(target substring 존재) 적용 시 이런 정규화 케이스도 false fail
- **검증 룰**: target이 직접 substring 매치 안 되면, 본문에서 명사구 정규화 후 비교
  - "X를 작성한 자" ↔ "X 작성자"
  - "X에서 일하는 자" ↔ "X 종사자"
  - 등 정규화 사전 필요
- **추출 룰 보강 후보**: target 작성 시 article_text 원문 그대로 인용 (조사 포함)

### D. 분해 적정성
1 article에서 동일 의무 동사로 N개 의무가 분해된 경우 **오분해 의심**.

#### D-1. 복합 동사 분해 vs 통합 일관성 결여
- **discovered**: sample 1 비교 케이스
  - **분해 사례**: 산안법 24조 ③항 — "회의를 개최하고 그 결과를 회의록으로 작성하여 보존하여야 한다" → drafts 2개 (개최 / 작성보존)
  - **통합 사례**: 자동차 고시 8조 ③항 — "실적을 다음 연도 1월말까지 확정하고 … 실적 확인서를 자동차제작자에게 발급해주어야한다" → draft 1개 (확정+발급 통합)
- **현상**: 같은 "…하고 …해야" 구조에 대해 article마다 다르게 처리. AI 재량
- **영향**: SET 간 일관성 결여, 의무 카운트 비교 불가
- **검증 룰**: 동일 paragraph 내 의무 동사 N개에 대해 추출된 draft 수가 일관 기준에 따르는지 검사. 일관 기준은 추출 룰에서 명문화 필요
- **추출 룰 보강 후보**: `rule_patterns.yaml` v1.2에 **R-DECOMP** 등록

### E. SKIP 정합성
skipped article의 **사유 코드**가 등록된 SKIP_001~011 중 하나인가.

#### E-1. skipped_paragraphs 자유 텍스트 → SKIP_XXX 코드 강제
- **discovered**: sample 1 4건 + group 1 3건 + group 2 3건 = **10/12 skip 보유 article 100% 재현**
- **현상**: `ai_flags.self_check.skipped_paragraphs`가 자유 텍스트
  - "⑦항 (권한 위임)" — SKIP_001 (위임)
  - "①항 (정의)" — SKIP_002 (정의)
  - "①②항 (권한)" — SKIP_003 (재량/권한 "할 수 있다")
  - "②항 (할 수 있다 — 권한·재량, 의무 아님)" — SKIP_003
  - "③항 (위임)" — SKIP_001
- **영향**: 코드 미부여 → 분류·집계·사이클 비교 불가
- **검증 룰**: skipped_paragraphs 각 항목이 정규식 `^SKIP_\d{3}:` 로 시작하는지 검사. 미준수 시 unmapped로 분류
- **추출 룰 보강 후보**: PROMPT v3.0.2에 "skipped 사유는 `SKIP_XXX:` 형식 강제" 추가

#### E-2. 권한·재량 항이 skipped_paragraphs에 누락 (v0.2 신규)
- **discovered**: group 1 — 산안법 시규 167조 ②항 본 의무
- **현상**: 167조 ②항 "관리 요령으로 대신 게시하거나 갖추어 둘 수 있다" — 표면 권한이지만 단서가 의무. AI는 단서만 draft no.10으로 추출했으나, ②항 본 의무 부분(권한)은 `skipped_paragraphs=[]`에 명시 안 함
- **영향**: 추출 결정의 traceability 손실
- **검증 룰**: article의 paragraph 수와 (extracted draft가 매핑된 paragraph 수 + skipped_paragraphs 수)의 합이 일치하는지 검사
- **추출 룰 보강 후보**: PROMPT v3.0.2에 "권한·재량으로 skip 시 skipped_paragraphs에 명시 의무"

#### E-3. "할 수 있다" 표면이지만 의미상 금지·제한 (v0.2 신규)
- **discovered**: group 1 — 건축법 시령 119조의5 ④항
- **현상**: ④항 "다른 신청인 또는 피신청인은 그 선정대표자를 통해서만 그 사건에 관한 행위를 할 수 있다" — 표면 "할 수 있다", 의미는 금지·제한
- **영향**: drafts 자체 결과는 영향 없으나 분류 정확성 결여
- **검증 룰**: "할 수 있다" 절 앞에 "…만(only)·…에 한정하여" 등 한정 표현 동반 시 권한 아닌 금지·제한으로 재분류
- **추출 룰 보강 후보**: SKIP_003 (권한)와 별도로 SKIP_012 (한정·제한) 신설 검토

### F. 중복 검증
- F-1: 동일 SET cycle 내 drafts 본문 텍스트 중복
- F-2: 동일 article 내 drafts 의도 중복 (다른 표현인데 같은 의무)
- rules: _(sample 1 + group 1 + group 2 모두 PASS — 누적 시 룰 등록)_

### G. 누락 검증
article 본문에 의무 동사 절이 있으나 **어떤 draft도 그 절을 커버하지 않은** 케이스.
- A 카테고리의 역방향
- rules: _(sample 1 + group 1 + group 2 모두 PASS, 단 G-1 관찰 1건은 추가 검토 필요)_
  - **G-1 (관찰, 룰 미등록)**: 산안법 시규 167조 ①항 단서 "고용노동부장관이 정하는 조치를 해야 한다" — reasoning은 "본 의무에 포함"이라 했으나 draft no.9 본문에 단서 내용 명시 없음. 본 의무 종속 부수 조치 vs 독립 의무 판단 룰 필요

### L. AI 메타 정합성 (v0.1 신규 승격)
`ai_flags.self_check` 필드(reasoning, para_count, skipped_paragraphs 등)가 article_text와 정합한가.

#### L-1. reasoning 내 항/호 참조의 article_text 존재 검증
- **discovered**: sample 1 — draft no.13~16 (건축물분양 시규 7조의2)
- **현상**: reasoning이 ⑤항 언급, article_text는 ④까지만 → AI 환각
- **영향**: AI self_check 필드 신뢰도 흔들림
- **검증 룰**:
  ```python
  reasoning_paragraphs = re.findall(r'[①②③④⑤⑥⑦⑧⑨]', reasoning)
  article_paragraphs = re.findall(r'\[([①②③④⑤⑥⑦⑧⑨])\]', article_text)
  if not set(reasoning_paragraphs).issubset(set(article_paragraphs)):
      raise ValidationError('L-1: reasoning에 article에 없는 항 참조')
  ```
- **추출 룰 보강 후보**: PROMPT v3.0.2에 "reasoning 내 항 참조는 article_text에 존재하는 것만"

#### L-2. reasoning이 article 내 SKIP 패턴 미인식 (v0.2 신규)
- **discovered**: group 1 — 건축사법 38조의8 ①항
- **현상**: ①항 후단 "이 경우 제30조제2항을 준용한다" — SKIP_011. reasoning은 "①②는 보고 요구·조사 권한"이라고만 하고 "준용" 미언급
- **영향**: 결과 영향 없음. 그러나 다른 article에서는 결과에 영향 줄 수 있음
- **검증 룰**:
  ```python
  skip_keywords = {
      'SKIP_001': ['위임한다', '위임할 수 있다'],
      'SKIP_011': ['준용한다', '준용할 수 있다'],
  }
  for code, keywords in skip_keywords.items():
      if any(kw in article_text for kw in keywords):
          if code not in reasoning and not any(kw in reasoning for kw in keywords):
              warn(f'L-2: article에 {code} 패턴 있으나 reasoning에 미언급')
  ```
- **추출 룰 보강 후보**: PROMPT v3.0.2에 "article 내 SKIP 키워드 발견 시 reasoning에 명시 의무"

