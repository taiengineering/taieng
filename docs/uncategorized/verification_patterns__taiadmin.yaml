# 검증 룰 패턴 (verification_patterns)

> 추출된 drafts의 **의미적 정합성**을 검증하는 룰 누적 파일.
> `audit_set_v3.sql`(형식 검증: 가운뎃점·coverage·paragraph 매핑)과 별도 트랙으로 운영.
> 추출 룰 트랙은 `rule_patterns.yaml`이 담당.

---

## 발견 사이클 (메타패턴)

1. SET cycle 결과 중 sample 펼침 (무작위 또는 계층 sample)
2. 각 draft에 대해 **옳다 / 틀리다 / 불확실** 판단 + **판단 근거** 명시
3. 판단 근거를 아래 카테고리 중 하나로 분류
4. 매칭되는 카테고리 없으면 `unmapped_findings`에 임시 등록 → 누적되면 신규 카테고리 승격
5. 각 룰을 SQL / 사전 매핑 / 정규식 / LLM 프롬프트 중 하나로 형식화
6. 룰 셋 전체를 cycle 전체에 자동 적용 → 잡은 것·못 잡은 것 분리
7. 못 잡은 것이 0건이고 새 sample에서 신규 룰 0건 → 해당 cycle 진정 PASS

