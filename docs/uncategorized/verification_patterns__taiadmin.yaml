## 추가 카테고리 후보 (sample 검증 중 발견 시 승격)

- **H. 시점·주기 일관성** — "매년·반기·작업 전" 등 시점 표현이 추출 결과에 보존됐는가
- **I. 수량·규모 조건** — "5인 이상·1톤 초과" 등 정량 조건이 보존됐는가
