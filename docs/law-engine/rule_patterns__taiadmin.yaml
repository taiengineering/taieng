# 룰 패턴 카탈로그 (Phase 진화)
# 버전: 1.2
# 최종 업데이트: 2026-05-05 (SET-002 cycle 1 + 대표 원칙 반영)
# 현재 Phase: 1 (AI 추출 + 사람 검증)

meta:
  version: "1.2"
  last_updated: "2026-05-05"
  current_phase: 1
  phase_transition_thresholds:
    phase_2: "룰 커버리지 30%+"
    phase_3: "룰 커버리지 70%+"
    phase_4: "룰 커버리지 95%+"

# ===========================================
# 0. 핵심 원칙 (모든 룰의 상위 원칙)
# ===========================================
core_principles:
  - id: PRINCIPLE_RECALL_FIRST
    name: "불완전한 1건이 누락된 1건보다 낫다"
    rationale: |
      불완전한 draft = 검토·수정 가능 (사람 또는 후속 검증기가 정정)
      누락된 의무 = 영원한 사각지대 (drafts 0건이면 검증기도 못 봄)
    discovered_in: "SET-002 cycle 1 후 대표 통찰 (2026-05-05)"
    application:
      - "추출기: 의심스러우면 추출 + medium (skip 회피)"
      - "추출기: 분해 vs 통합 모호하면 분해 (통합은 후처리)"
      - "추출기: 8종 모호하면 ACTION + medium (skip 회피)"
      - "추출기: article 전체 SKIP이어도 placeholder 1건 (drafts 0건 회피)"
      - "검증기: precision보다 recall 우선 (false negative > false positive 위험)"
      - "검증기: false positive 룰도 review_candidate 분류로 보존 (폐기 회피)"

  - id: PRINCIPLE_NO_SELF_REINFORCEMENT
    name: "추출기와 검증기는 다른 메커니즘"
    rationale: "같은 룰셋이면 자기 충족 사이클 = 추출기 약점이 영원히 안 보임"
    discovered_in: "SET-001 audit_set_v4 분석 (2026-05-05)"
    application:
      - "추출기 PROMPT는 LLM 자유 추론 유지"
      - "검증기는 정적 패턴 매칭·통계·외부 사전 사용"
      - "같은 ground truth (article_text)를 다른 메커니즘으로 검사"

# ===========================================
# 1. SKIPPING RULES (의무 아님 자동 분류)
# ===========================================
skipping_rules:
  - id: SKIP_001
    name: "정의 조항"
    pattern_type: "title_regex"
    pattern: "^정의|^용어"
    action: skipped
    skip_reason: "의무 정의 — 정의 조항"
    confidence: 0.99
    discovered_in: "본 세션 false positive 분석"
    validated_count: 80

  - id: SKIP_002
    name: "벌칙 조항"
    pattern_type: "title_regex"
    pattern: "벌칙|과태료|양벌|행정처분|과징금"
    action: skipped
    skip_reason: "벌칙 조항"
    confidence: 0.99
    validated_count: 290

  - id: SKIP_003
    name: "부칙"
    pattern_type: "title_regex"
    pattern: "^부칙|시행일|경과조치|특례"
    action: skipped
    skip_reason: "부칙"
    confidence: 0.99
    validated_count: 148
    set001_validated: 1

  - id: SKIP_004
    name: "재검토"
    pattern_type: "title_regex"
    pattern: "재검토|타당성"
    action: skipped
    skip_reason: "재검토 조항"
    confidence: 0.99
    validated_count: 339
    set001_validated: 3

  - id: SKIP_005
    name: "권한 위임"
    pattern_type: "title_regex"
    pattern: "권한.*위임|위탁|위임"
    action: skipped
    skip_reason: "권한 위임"
    confidence: 0.95
    validated_count: 198

  - id: SKIP_006
    name: "목적"
    pattern_type: "title_regex"
    pattern: "^목적$"
    action: skipped
    skip_reason: "목적 조항"
    confidence: 0.99
    validated_count: 36

  - id: SKIP_007
    name: "적용범위"
    pattern_type: "title_regex"
    pattern: "적용 ?(범위|대상)"
    action: skipped
    skip_reason: "적용범위 조항"
    confidence: 0.99
    validated_count: 22

  - id: SKIP_008
    name: "본문 위임 패턴"
    pattern_type: "text_regex"
    pattern: "은 (대통령|총리|장관|부령)으로 정한다\\.?$"
    action: skipped_partial
    skip_reason: "하위 법령 위임 (해당 부분만)"
    confidence: 0.90
    validated_count: 0

  - id: SKIP_009
    name: "수수료/행정비용"
    pattern_type: "title_regex"
    pattern: "^수수료|수수료 등|교육비|등록비"
    action: skipped
    skip_reason: "수수료/교육비 등 행정 비용 — 산업안전 의무 아님"
    confidence: 0.95
    discovered_in: "SET-001 cycle 1"
    set001_validated: 1

  - id: SKIP_010
    name: "벌칙·과태료 징수절차"
    pattern_type: "title_regex"
    pattern: "(벌칙|과태료).*징수"
    action: skipped
    skip_reason: "벌칙·과태료 부과 절차 — 산업안전 의무 아님"
    confidence: 0.95
    discovered_in: "SET-001 cycle 1"
    set001_validated: 1

  # ⭐ NEW (SET-002 cycle 1 발견)
  - id: SKIP_011
    name: "조문 전체 준용"
    pattern_type: "text_regex"
    pattern: "(이|에)? (다른 조문|.{1,30}을) ?준용한다\\.?"
    action: skipped_with_placeholder    # ⭐ skipped 단독 아님
    skip_reason: "조문 전체 준용 — 자체 의무 없음"
    confidence: 0.95
    discovered_in: "SET-002 cycle 1 (산안법 시규 92조)"
    set002_validated: 1
    placeholder_required: true   # ⭐ drafts 0건 회피용 placeholder 1건 필수

# ===========================================
# 1.5. PLACEHOLDER RULES ⭐ NEW (대표 원칙 반영)
# ===========================================
placeholder_rules:
  - id: PLACEHOLDER_001
    name: "article 전체 SKIP — placeholder 1건 적재"
    rationale: |
      drafts 0건이면 검증기 사각지대 발생 + article 자체 추적 불가.
      placeholder 1건을 status='placeholder'로 적재해야 추적·재검토 가능.
    discovered_in: "SET-002 cycle 1 (92조 누락 발견 후)"
    structure:
      status: "placeholder"
      ai_confidence: 60
      obligation_summary: "본 article은 ... 의무 추출 없음. ... 함께 적용."
      ai_flags:
        placeholder_type: "article_full_skip"
        skipped_paragraphs: ["SKIP_xxx (사유)"]
        confidence_in_completeness: "medium"
    apply_when:
      - "SKIP_011 (전체 준용)"
      - "SKIP_006 (목적)"
      - "SKIP_007 (적용범위)"
      - "기타 article 전체 SKIP"

# ===========================================
# 2. EXTRACTION RULES
# ===========================================
extraction_rules:
  - id: EXTRACT_001
    name: "항 단위 분해"
    pattern_type: "text_split"
    pattern: "[①②③④⑤⑥⑦⑧⑨⑩]"
    action: split_paragraphs
    confidence: 0.95

  - id: EXTRACT_002
    name: "및/또는 분해"
    pattern_type: "text_regex"
    pattern: "(\\w+) (및|또는) (\\w+)(하여야|해야)"
    action: split_compound_verb
    confidence: 0.85

  - id: EXTRACT_003
    name: "주체 다중 분해 (X와 Y는)"
    pattern_type: "text_regex"
    pattern: "(\\w+)(와|과)\\s*(\\w+)은"
    action: split_subjects
    confidence: 0.90
    discovered_in: "SET-001 cycle 1 (산안법 제24조 ④항)"
    set001_validated: 1

# ===========================================
# 2.5. R-DECOMP RULES ⭐ NEW (recall 우선 원칙)
# ===========================================
r_decomp_rules:
  meta:
    principle: "분해 우선 — 통합은 후처리, 누락은 복구 불가"

  - id: DECOMP_001
    name: "절차 chain → 분해"
    description: "동일 target의 'A하고 B하여야' 패턴"
    pattern_type: "text_regex"
    pattern: "(\\w+)(고|여)[, ]+(\\w+)(하여야|해야)"
    action: split_action_chain
    confidence_marker: "medium"
    rationale: |
      절차 chain은 점검 단위로 분해 가능 = 작업자별 분배 가능.
      통합 시 점검 항목 소실. SaaS 본질(전원 참여)에 부합.
    discovered_in: |
      SET-001 산안기준 24조 (8 의무 분해)
      SET-002 산안기준 627조, 건축사법 시규 3조②
      cycle 1 fresh 분석에서 "통합" 권장은 잘못 — 1차 분해가 옳았음

  - id: DECOMP_002
    name: "독립 의무 chain → 분해"
    description: "별개 paragraph로 명확히 구분된 의무 chain"
    pattern_type: "text_regex"
    pattern: "(하여야 한다|해야 한다)\\s*\\.\\s*[②③④⑤]"
    action: split_paragraphs
    confidence_marker: "high"

  - id: DECOMP_003
    name: "OR 결합 의무 → 분해"
    description: "양자택일 의무 ('A하거나 B해야')"
    pattern_type: "text_regex"
    pattern: "(\\w+) ?거나|(\\w+) ?또는 (\\w+)(하여야|해야)"
    action: split_or_obligation
    confidence_marker: "medium"
    rationale: "선택지별 분해 시 점검 가능. 통합 시 어느 선택지가 이행됐는지 추적 불가."
    discovered_in: "SET-002 산안법 시규 87조 ③항"

  - id: DECOMP_004
    name: "AND/OR 결합 target → 단일 draft"
    description: "복수 target ('X 또는 Y는~', 'X 및 Y는~')"
    pattern_type: "text_regex"
    pattern: "(\\w+) (또는|및) (\\w+)은\\s+"
    action: keep_combined_target
    confidence_marker: "medium"
    rationale: "target 결합 보존. appointment_target에 '또는'·'및' 단어 그대로 유지."
    discovered_in: |
      SET-002 건설기계 시규 96조 ② (국토부장관 또는 시·도지사)
      SET-002 산안 시규 17조 ⑦ (장관 및 공단)

  - id: DECOMP_005
    name: "메인+단서 → 분해"
    description: "메인 의무 + 단서 의무 (일정 조건 시 다른 처리)"
    pattern_type: "text_regex"
    pattern: "(하여야|해야) 한다\\..*다만"
    action: split_main_clause
    confidence_marker: "medium"
    discovered_in: "SET-002 산안 시규 87조 ④항 (발주자 메인 + 통보 단서)"

# ===========================================
# 3. CONDITION RULES
# ===========================================
condition_rules:
  - id: COND_001
    name: "면적 조건"
    pattern_type: "text_regex"
    pattern: "(\\d+(?:,\\d{3})*)\\s*(㎡|m²|평방미터)\\s*(이상|초과|이하|미만)"
    extracts: {condition_code: area, operator_map: {이상: gte, 초과: gt, 이하: lte, 미만: lt}}
    confidence: 0.99

  - id: COND_002
    name: "인원 조건"
    pattern_type: "text_regex"
    pattern: "(\\d+)\\s*명\\s*(이상|초과|이하|미만)"
    extracts: {condition_code: worker_count}
    confidence: 0.99

  - id: COND_003
    name: "공사금액 조건"
    pattern_type: "text_regex"
    pattern: "(\\d+)\\s*(억|만)\\s*원\\s*(이상|초과|이하|미만)"
    extracts: {condition_code: contract_amount}
    confidence: 0.95

  - id: COND_004
    name: "기한 조건"
    pattern_type: "text_regex"
    pattern: "(\\d+)\\s*(일|개월|년)\\s*(이내|이전)"
    extracts: {condition_code: duration}
    confidence: 0.95
    discovered_in: "SET-001 cycle 1"
    set001_validated: 3

# ===========================================
# 4. SUBJECT RULES
# ===========================================
subject_rules:
  - id: SUBJ_001
    name: "표준 주체 매핑"
    pattern_type: "text_match"
    patterns:
      - {pattern: "사업주는", target: "사업주"}
      - {pattern: "안전관리자는", target: "안전관리자"}
      - {pattern: "보건관리자는", target: "보건관리자"}
      - {pattern: "건설업자는", target: "건설업자"}
      - {pattern: "발주자는", target: "발주자"}
      - {pattern: "발주청은", target: "발주청"}
      - {pattern: "도급인은", target: "도급인"}
      - {pattern: "수급인은", target: "수급인"}
      - {pattern: "근로자는", target: "근로자"}
      - {pattern: "분양사업자는", target: "분양사업자"}
      - {pattern: "전기사업자는", target: "전기사업자"}
      - {pattern: "전기통신사업자는", target: "전기통신사업자"}
      - {pattern: "자동차제작자는", target: "자동차제작자"}
      # ⭐ NEW (SET-002 cycle 1)
      - {pattern: "관계인은", target: "관계인"}
      - {pattern: "관리주체는", target: "관리주체"}
      - {pattern: "공공기관은", target: "공공기관"}
      - {pattern: "관리자는", target: "관리자"}
      - {pattern: "총량관리사업자는", target: "총량관리사업자"}
    confidence: 0.99

