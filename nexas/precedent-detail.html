<script>
(function () {
  var SB = 'https://vwlahtguyggrhvslabax.supabase.co/rest/v1';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3bGFodGd1eWdncmh2c2xhYmF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyOTE1OTYsImV4cCI6MjA5Mjg2NzU5Nn0.Yp6P7ahaCuna_gwYC8_S2KD081Ov9Fs65e9o_AenP48';
  var H = { apikey: KEY, Authorization: 'Bearer ' + KEY };
  var SEC_LABEL = { CONSTRUCTION: '건설', MANUFACTURING: '제조', SERVICE: '서비스', COMMON: '공통' };

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function load() {
    var id = new URLSearchParams(location.search).get('id');
    var errEl = document.getElementById('tai-detail-error');
    var titleEl = document.getElementById('tai-detail-title');
    var metaEl = document.getElementById('tai-detail-meta');
    var bodyEl = document.getElementById('tai-detail-body');
    var courtEl = document.getElementById('tai-court');
    if (!id) {
      if (errEl) errEl.textContent = '잘못된 링크입니다.';
      return;
    }
    try {
      var res = await fetch(SB + '/industrial_accident_precedents?id=eq.' + encodeURIComponent(id) + '&select=*', { headers: H });
      var rows = await res.json();
      if (!res.ok || !rows || !rows.length) throw new Error('판례를 찾을 수 없습니다.');
      var p = rows[0];
      var title = p.case_name || '판례';
      var sum = p.summary || title;
      if (typeof TAIDetailMeta !== 'undefined') TAIDetailMeta.setDetailMeta(title, sum);
      if (courtEl) courtEl.textContent = p.court_name || '';
      if (titleEl) titleEl.textContent = title;
      var metaParts = [];
      if (p.case_number) metaParts.push(p.case_number);
      if (p.decision_date) metaParts.push(p.decision_date);
      if (p.hazard_type) metaParts.push(p.hazard_type);
      if (p.sector && SEC_LABEL[p.sector]) metaParts.push(SEC_LABEL[p.sector]);
      if (metaEl) metaEl.textContent = metaParts.join(' · ');
      var html = '';
      if (p.summary) html += '<p class="mb-4">' + esc(p.summary) + '</p>';
      if (p.death_count || p.injury_count) {
        html += '<p class="small text-muted">사망 ' + (p.death_count || 0) + '명 · 상해 ' + (p.injury_count || 0) + '명</p>';
      }
      if (p.source_url) html += '<p><a class="btn btn-base btn-sm" href="' + esc(p.source_url) + '" target="_blank" rel="noopener">원문·출처 보기 →</a></p>';
      if (bodyEl) bodyEl.innerHTML = html || '<p class="text-muted">요약이 없습니다.</p>';
    } catch (e) {
      if (errEl) errEl.textContent = e.message || '오류가 발생했습니다.';
      if (bodyEl) bodyEl.innerHTML = '';
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', load);
  else load();
})();
</script>
