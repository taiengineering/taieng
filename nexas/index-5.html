<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="산업안전 판례 모음 — 법제처·근로복지공단 산재판례 통합 검색">
  <title>산업안전 판례 | TAI 엔지니어링</title>
  <link rel="icon" href="assets/img/fevicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tai-main.css">
  <style>
  /* 혈어로 */
  .prec-hero { background:linear-gradient(135deg,#0d1b2a 0%,#1a2e42 100%); padding:56px 0 44px; }
  .prec-hero h1 { font-size:clamp(1.7rem,3.5vw,2.4rem); font-weight:900; color:#fff; margin-bottom:8px; }
  .prec-hero p { color:rgba(255,255,255,.6); font-size:.93rem; }
  /* 검색 바 */
  .prec-search-bar { background:#fff; border-radius:14px; padding:6px 6px 6px 16px; display:flex; gap:8px; box-shadow:0 4px 20px rgba(0,0,0,.15); max-width:680px; margin:0 auto; }
  .prec-search-bar input { flex:1; border:none; outline:none; font-size:1rem; font-family:inherit; background:transparent; }
  .prec-search-bar button { background:var(--red,#c62828); color:#fff; border:none; border-radius:10px; padding:10px 22px; font-size:.95rem; font-weight:700; cursor:pointer; white-space:nowrap; }
  /* 탭 */
  .prec-main-tabs { display:flex; gap:0; margin:32px auto 0; border-radius:10px; overflow:hidden; border:1.5px solid rgba(255,255,255,.2); max-width:360px; }
  .prec-main-tab { flex:1; padding:10px 0; font-size:.92rem; font-weight:800; color:rgba(255,255,255,.6); background:transparent; border:none; cursor:pointer; transition:all .2s; }
  .prec-main-tab.active { background:#fff; color:var(--navy); }
  /* 키워드 칩 */
  .kw-chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px; }
  .kw-chip { padding:6px 14px; border:1.5px solid var(--border,#e2e4e8); border-radius:999px; font-size:.8rem; font-weight:600; color:var(--sub,#6b7280); cursor:pointer; background:#fff; transition:all .15s; }
  .kw-chip:hover, .kw-chip.active { background:var(--navy); color:#fff; border-color:var(--navy); }
  /* 상태 */
  .prec-status { font-size:.85rem; color:var(--sub); margin-bottom:16px; }
  .prec-status strong { color:var(--navy); }
  .prec-loading { text-align:center; padding:48px 20px; color:var(--sub); }
  /* 카드 */
  .prec-card { background:#fff; border-radius:12px; padding:22px 20px; box-shadow:0 2px 14px rgba(0,0,0,.06); border-left:4px solid var(--border); margin-bottom:14px; cursor:pointer; transition:border-color .2s, transform .2s; }
  .prec-card:hover { border-left-color:var(--red); transform:translateX(3px); }
  .prec-card.sanjae { border-left-color:#1a6fb5; }
  .prec-card.sanjae:hover { border-left-color:#0d4a8a; }
  .prec-tag-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .prec-tag { display:inline-block; font-size:.68rem; font-weight:700; padding:3px 9px; border-radius:4px; }
  .prec-tag.court { background:#f0f4ff; color:#3b5bdb; }
  .prec-tag.src-law { background:#fff0f0; color:var(--red); }
  .prec-tag.src-sanjae { background:#e8f4fd; color:#1a6fb5; }
  .prec-card h5 { font-size:.97rem; font-weight:800; color:var(--navy); margin-bottom:6px; line-height:1.45; }
  .prec-card .prec-summary { font-size:.83rem; color:var(--sub); line-height:1.55; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .prec-meta { display:flex; justify-content:space-between; margin-top:12px; padding-top:10px; border-top:1px solid var(--border); font-size:.76rem; color:var(--sub); }
  /* 페이지네이션 */
  .prec-pg { display:flex; gap:6px; justify-content:center; margin-top:24px; flex-wrap:wrap; }
  .prec-pg-btn { padding:8px 14px; border:1.5px solid var(--border); border-radius:7px; font-size:.83rem; font-weight:700; background:#fff; color:var(--sub); cursor:pointer; }
  .prec-pg-btn.active { background:var(--navy); color:#fff; border-color:var(--navy); }
  /* 모달 */
  .prec-modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:2000; align-items:flex-start; justify-content:center; padding:60px 16px 30px; overflow-y:auto; }
  .prec-modal-overlay.open { display:flex; }
  .prec-modal { background:#fff; border-radius:16px; max-width:700px; width:100%; padding:36px; position:relative; }
  .prec-modal-close { position:absolute; top:16px; right:18px; background:none; border:none; font-size:1.4rem; cursor:pointer; color:var(--sub); }
  .prec-modal h4 { font-size:1.1rem; font-weight:900; color:var(--navy); margin-bottom:14px; line-height:1.4; }
  .prec-modal-meta { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .prec-section { margin-bottom:18px; }
  .prec-section-title { font-size:.76rem; font-weight:800; color:var(--sub); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px; border-bottom:1px solid var(--border); padding-bottom:5px; }
  .prec-section-body { font-size:.87rem; color:#374151; line-height:1.7; white-space:pre-wrap; }
  </style>
</head>
<body>
<nav class="tai-nav">
  <div class="inner">
    <a href="index.html" class="logo"><img src="assets/img/tai-logo.png" alt="TAI"></a>
    <div class="nav-links"><!-- nav-auth.js --></div>
  </div>
</nav>

<!-- 헤더 + 검색바 -->
<div class="prec-hero">
  <div class="sec-inner text-center">
    <span class="page-hero-tag" style="margin-bottom:14px;display:inline-block;">산업안전 판례</span>
    <h1>판례로 배우는 산업안전</h1>
    <p style="margin-bottom:24px;">법제처 전체 판례 + 근로복지공단 산재 전문 판례 통합 검색</p>
    <div class="prec-search-bar">
      <input id="precQuery" type="text" placeholder="키워드 입력 (예: 지게차, 추락, 과태료)" value="산업안전" onkeydown="if(event.key==='Enter') doSearch()">
      <button onclick="doSearch()"><i class="fas fa-search me-1"></i>검색</button>
    </div>
    <div class="prec-main-tabs">
      <button class="prec-main-tab active" onclick="switchTab(this,'industry')">산업안전 전체</button>
      <button class="prec-main-tab" onclick="switchTab(this,'sanjae')">산재 전문</button>
    </div>
  </div>
</div>

<!-- 콘텐츠 -->
<section class="sec" style="background:var(--gray-bg); padding-top:32px;">
  <div class="sec-inner">
    <div class="kw-chips">
      <span class="kw-chip active" onclick="setKw('산업안전',this)">산업안전</span>
      <span class="kw-chip" onclick="setKw('중대재해',this)">중대재해</span>
      <span class="kw-chip" onclick="setKw('과태료',this)">과태료</span>
      <span class="kw-chip" onclick="setKw('추락',this)">추락</span>
      <span class="kw-chip" onclick="setKw('안전관리자',this)">안전관리자</span>
      <span class="kw-chip" onclick="setKw('작업중지',this)">작업중지</span>
      <span class="kw-chip" onclick="setKw('끼임',this)">끼임</span>
      <span class="kw-chip" onclick="setKw('화재',this)">화재</span>
    </div>
    <div id="precStatus" class="prec-status" style="display:none;"></div>
    <div id="precList"><div class="prec-loading"><i class="fas fa-spinner fa-spin me-2"></i>판례를 불러오는 중...</div></div>
    <div id="precPg" class="prec-pg"></div>
  </div>
</section>

<!-- 모달 -->
<div class="prec-modal-overlay" id="precModal">
  <div class="prec-modal">
    <button class="prec-modal-close" onclick="closeModal()">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

<div id="tai-footer"></div>
<script src="assets/js/nav-auth.js"></script>
<script src="assets/js/footer.js"></script>
<script>
const API = 'https://api.taieng.co.kr';
let _tab = 'industry';
let _page = 1;
let _query = '산업안전';
let _total = 0;
const SZ = 10;

// 샘플 (API 미준비)
const SAMPLE = [
  {id:'a1',src:'law',court:'대법원',caseNo:'대법원 2024도8821',title:'지게차 충돌 사망 — 안전관리자 선임 의무 위반',summary:'안전관리자 미선임 상태 작업. 산안법+중대재해처벌법 병합 적용.', date:'2024.11.14',type:'형사'},
  {id:'a2',src:'law',court:'서울고법',caseNo:'서울고법 2024나12345',title:'프레스 방호장치 제거 → 손가락 절단',summary:'사업주가 방호장치 제거 지시. 손해배상 1억 2천만 원.', date:'2024.09.03',type:'민·형사'},
  {id:'a3',src:'law',court:'부산지법',caseNo:'부산지법 2024고단993',title:'건설현장 추락 사망 — 안전난간 미설치',summary:'개구부 안전난간 미설치 상태에서 근로자 추락 사망.', date:'2024.07.22',type:'형사'},
  {id:'a4',src:'sanjae',court:'대법원',caseNo:'대법원 2023도15872',title:'밀폐공간 질식 사망 — 산소 농도 측정 미실시',summary:'맨홀 작업 전 산소농도 미측정. 벌금 5,000만 원+금고형.', date:'2024.04.11',type:'형사'},
  {id:'a5',src:'law',court:'수원지법',caseNo:'수원지법 2024고합211',title:'타워크레인 고압선 접촉 감전 사망',summary:'타워크레인 붐 고압선 접촉. 이격거리 기준 미준수.', date:'2024.12.05',type:'형사'},
  {id:'a6',src:'sanjae',court:'서울행법',caseNo:'서울행법 2024구합70321',title:'출퇴근 재해 — 편의점 경유 후 교통사고',summary:'통상적 경로 소폭 이탈이라도 산재 인정.', date:'2024.11.28',type:'행정'},
];

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function switchTab(btn, tab) {
  document.querySelectorAll('.prec-main-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  _tab = tab;
  _page = 1;
  fetchPrecedents();
}

function setKw(kw, el) {
  document.getElementById('precQuery').value = kw;
  document.querySelectorAll('.kw-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  _page = 1;
  fetchPrecedents();
}

function doSearch() {
  _query = document.getElementById('precQuery').value.trim() || '산업안전';
  _page = 1;
  fetchPrecedents();
}

async function fetchPrecedents() {
  document.getElementById('precList').innerHTML = '<div class="prec-loading"><i class="fas fa-spinner fa-spin me-2"></i>판례를 불러오는 중...</div>';
  document.getElementById('precStatus').style.display = 'none';
  document.getElementById('precPg').innerHTML = '';

  const src = _tab === 'sanjae' ? '&source=sanjae' : '';
  const url = `${API}/precedents/search?query=${encodeURIComponent(_query)}&page=${_page}&size=${SZ}${src}`;

  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error();
    const d = await r.json();
    _total = d.total || 0;
    if (_total > 0) {
      renderList(d.items || []);
    } else {
      throw new Error('empty');
    }
  } catch {
    renderFallback();
  }
}

function renderList(items) {
  const st = document.getElementById('precStatus');
  st.style.display = '';
  st.innerHTML = `<strong>${_total.toLocaleString()}건</strong>의 판례 — "${esc(_query)}" ${_tab==='sanjae'?'(산재 전문)':'(전체)'}`;

  document.getElementById('precList').innerHTML = items.map(p => {
    const isSanjae = _tab === 'sanjae' || (p.datSrcNm||'').includes('산재');
    const court = p.법원명 || p.court || '';
    const caseNo = p.사건번호 || p.caseNo || '';
    const title = p.사건명 || p.title || '(제목 없음)';
    const summary = p.판시사항 || p.판결요지 || p.summary || '';
    const date = p.선고일자 || p.date || '';
    const precId = p.판례일련번호 || p.precId || p.id || '';
    const link = p.판례상세링크 || (precId ? `https://www.law.go.kr/precInfoP.do?precSeq=${precId}` : '');
    return `<div class="prec-card${isSanjae?' sanjae':''}" onclick="openLink('${esc(link)}')">
      <div class="prec-tag-row">
        ${court ? `<span class="prec-tag court">${esc(court)}</span>` : ''}
        <span class="prec-tag ${isSanjae?'src-sanjae':'src-law'}">${isSanjae?'산재 전문':'법제처'}</span>
      </div>
      <h5>${esc(title)}</h5>
      ${caseNo ? `<div style="font-size:.79rem;color:var(--sub);margin-bottom:5px;">사건번호: ${esc(caseNo)}</div>` : ''}
      ${summary ? `<div class="prec-summary">${esc(summary)}</div>` : ''}
      <div class="prec-meta">
        <span>${date ? '선고: ' + date : ''}</span>
        <span style="color:var(--red);font-size:.76rem;"><i class="fas fa-external-link-alt me-1"></i>원문 보기</span>
      </div>
    </div>`;
  }).join('');

  // 페이지네이션
  const total = Math.ceil(_total / SZ);
  if (total > 1) {
    const s = Math.max(1, _page-2), e = Math.min(total, _page+2);
    let html = '';
    if (_page > 1) html += `<button class="prec-pg-btn" onclick="goPage(${_page-1})">&#8249;</button>`;
    for (let i = s; i <= e; i++)
      html += `<button class="prec-pg-btn${i===_page?' active':''}" onclick="goPage(${i})">${i}</button>`;
    if (_page < total) html += `<button class="prec-pg-btn" onclick="goPage(${_page+1})">&#8250;</button>`;
    document.getElementById('precPg').innerHTML = html;
  }
}

function renderFallback() {
  const filtered = _tab === 'sanjae' ? SAMPLE.filter(s => s.src === 'sanjae') : SAMPLE;
  _total = filtered.length;
  const st = document.getElementById('precStatus');
  st.style.display = '';
  st.innerHTML = `<strong>${filtered.length}건</strong> — API 연결 후 실시간 데이터 표시 (현재 샘플)`;

  document.getElementById('precList').innerHTML = filtered.map(p =>
    `<div class="prec-card${p.src==='sanjae'?' sanjae':''}" onclick="openSample('${p.id}')">
      <div class="prec-tag-row">
        <span class="prec-tag court">${esc(p.court)}</span>
        <span class="prec-tag ${p.src==='sanjae'?'src-sanjae':'src-law'}">${p.src==='sanjae'?'산재 전문':'법제처'}</span>
        <span class="prec-tag" style="background:#f8f9fa;color:var(--sub);">${esc(p.type)}</span>
      </div>
      <h5>${esc(p.title)}</h5>
      <div style="font-size:.79rem;color:var(--sub);margin-bottom:5px;">${esc(p.caseNo)}</div>
      <div class="prec-summary">${esc(p.summary)}</div>
      <div class="prec-meta"><span>선고: ${p.date}</span><span style="color:var(--sub);font-size:.75rem;">샘플 데이터</span></div>
    </div>`
  ).join('');
}

function openLink(link) {
  if (link) window.open(link, '_blank');
}

function openSample(id) {
  const p = SAMPLE.find(s => s.id === id);
  if (!p) return;
  document.getElementById('precModal').classList.add('open');
  document.getElementById('modalBody').innerHTML = `
    <h4>${esc(p.title)}</h4>
    <div class="prec-modal-meta">
      <span class="prec-tag court">${esc(p.court)}</span>
      <span class="prec-tag" style="background:#f8f9fa;color:var(--sub);">${p.date}</span>
      <span class="prec-tag" style="background:#f8f9fa;color:var(--sub);">${esc(p.caseNo)}</span>
    </div>
    <div class="prec-section"><div class="prec-section-title">판시사항</div><div class="prec-section-body">${esc(p.summary)}</div></div>
    <p style="margin-top:16px;font-size:.8rem;color:var(--sub);">* 샘플 데이터입니다. API 연결 후 법제처 실제 판례가 표시됩니다.</p>`;
}

function closeModal() { document.getElementById('precModal').classList.remove('open'); }
document.getElementById('precModal').addEventListener('click', function(e) { if(e.target===this) closeModal(); });

function goPage(p) { _page = p; fetchPrecedents(); window.scrollTo({top:200,behavior:'smooth'}); }

document.addEventListener('DOMContentLoaded', () => fetchPrecedents());
</script>
</body></html>
