  .kw-chip:hover, .kw-chip.active { background:var(--navy); color:#fff; border-color:var(--navy); }
  /* 결과 카드 */

  /* 모달 */
  .prec-modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:2000; align-items:flex-start; justify-content:center; padding:60px 16px 30px; overflow-y:auto; }

  .prec-modal { background:#fff; border-radius:16px; max-width:720px; width:100%; padding:36px; position:relative; }

  .prec-section { margin-bottom:20px; }

  .prec-section-body { font-size:.88rem; color:#374151; line-height:1.7; white-space:pre-wrap; }
  /* 페이지네이션 */
  .prec-pagination { display:flex; gap:6px; justify-content:center; margin-top:28px; flex-wrap:wrap; }
  .prec-page-btn { padding:8px 14px; border:1.5px solid var(--border); border-radius:7px; font-size:.83rem; font-weight:700; background:#fff; color:var(--sub); cursor:pointer; }

  /* 빈 상태 */
  .prec-empty { text-align:center; padding:60px 20px; color:var(--sub); }
  .prec-empty i { font-size:2.5rem; margin-bottom:16px; color:#d1d5db; display:block; }
  /* 로딩 */
  .prec-loading { text-align:center; padding:48px 20px; color:var(--sub); }
  /* 카운트 */

<nav class="tai-nav">

  </div>
</nav>

<!-- 히어로 -->
<div class="prec-hero">
  <div class="sec-inner">
    <span class="page-hero-tag">산업안전 판례</span>
    <h1>판례로 배우는 산업안전</h1>
    <p>법제처 전체 판례 + 근로복지공단 산재 전문 판례를 통합 검색합니다</p>
    <!-- 메인 탭 -->
    <div class="prec-main-tabs">
      <button class="prec-main-tab active" onclick="switchTab(this,'industry')">산업안전 전체</button>
      <button class="prec-main-tab" onclick="switchTab(this,'sanjae')">산재 전문</button>
    </div>
  </div>
</div>

<!-- 콘텐츠 -->
<section class="sec" style="background:var(--gray-bg); padding-top:36px;">
  <div class="sec-inner">

    <!-- 검색 -->
    <div class="prec-search-wrap">
      <input id="precQuery" type="text" class="prec-search-input" placeholder="키워드 입력 (예: 지게차, 추락, 과태료)" value="산업안전" onkeydown="if(event.key==='Enter') doSearch()">
      <button class="prec-search-btn" onclick="doSearch()"><i class="fas fa-search me-1"></i>검색</button>
    </div>
    <!-- 추천 키워드 -->
    <div class="prec-keyword-chips">
      <span class="kw-chip active" onclick="setKeyword('산업안전',this)">산업안전</span>
      <span class="kw-chip" onclick="setKeyword('중대재해',this)">중대재해</span>
      <span class="kw-chip" onclick="setKeyword('과태료',this)">과태료</span>
      <span class="kw-chip" onclick="setKeyword('추락',this)">추락</span>
      <span class="kw-chip" onclick="setKeyword('안전관리자',this)">안전관리자</span>
      <span class="kw-chip" onclick="setKeyword('작업중지',this)">작업중지</span>
      <span class="kw-chip" onclick="setKeyword('끼임',this)">끼임</span>
      <span class="kw-chip" onclick="setKeyword('화재',this)">화재</span>
    </div>

    <div id="precCount" class="prec-count" style="display:none;"></div>
    <div id="precList"><div class="prec-loading"><i class="fas fa-spinner fa-spin me-2"></i>판례를 불러오는 중...</div></div>
    <div id="precPagination" class="prec-pagination"></div>

  </div>
</section>

<!-- 모달 -->
<div class="prec-modal-overlay" id="precModal" onclick="closeModal(event)">
  <div class="prec-modal">
    <button class="prec-modal-close" onclick="closeModal()">×</button>

  </div>

<div id="tai-footer"></div>
<script src="assets/js/nav-auth.js"></script>
<script src="assets/js/footer.js"></script>
<script>
const API = 'https://api.taieng.co.kr';
let _curTab = 'industry'; // industry | sanjae
let _curPage = 1;
let _curQuery = '산업안전';
let _total = 0;
const PAGE_SIZE = 10;

// 탭 전환
function switchTab(btn, tab) {
  document.querySelectorAll('.prec-main-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  _curTab = tab;
  _curPage = 1;
  doSearch();
}

// 키워드 칩
function setKeyword(kw, el) {
  document.getElementById('precQuery').value = kw;
  document.querySelectorAll('.kw-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  _curPage = 1;
  doSearch();
}

// 검색 실행
async function doSearch() {
  _curQuery = document.getElementById('precQuery').value.trim() || '산업안전';
  _curPage = 1;
  await fetchPrecedents();
}

async function fetchPrecedents() {
  document.getElementById('precList').innerHTML = '<div class="prec-loading"><i class="fas fa-spinner fa-spin me-2"></i>판례를 불러오는 중...</div>';
  document.getElementById('precCount').style.display = 'none';
  document.getElementById('precPagination').innerHTML = '';

  const source = _curTab === 'sanjae' ? 'sanjae' : '';
  const url = `${API}/precedents/search?query=${encodeURIComponent(_curQuery)}&source=${source}&page=${_curPage}&size=${PAGE_SIZE}`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('api_error');
    const data = await res.json();
    renderList(data);
  } catch(e) {
    renderFallback();
  }
}

function renderList(data) {
  const items = data.data || data.items || data.results || [];
  _total = data.total || data.totalCount || items.length;

  const countEl = document.getElementById('precCount');
  countEl.style.display = '';
  countEl.innerHTML = `<strong>${_total.toLocaleString()}건</strong>의 판례가 검색되었습니다 — "${_curQuery}" ${_curTab === 'sanjae' ? '(산재 전문)' : '(전체)'}`;

  if (!items.length) {
    document.getElementById('precList').innerHTML = `
      <div class="prec-empty"><i class="fas fa-search"></i>검색 결과가 없습니다.<br><small style="margin-top:8px;display:block;">다른 키워드로 검색해 보세요</small></div>`;
    return;
  }

  document.getElementById('precList').innerHTML = items.map(p => {
    const isSanjae = (p.source || p.prec_source || p.datSrcNm || '').includes('산재') || _curTab === 'sanjae';
    const caseNo = p.case_no || p.사건번호 || p.caseNo || '';
    const court = p.court || p.법원명 || p.courtNm || '';
    const title = p.title || p.사건명 || p.caseNm || '(제목 없음)';
    const summary = p.summary || p.판시사항 || p.판결요지 || p.content || '';
    const date = p.decided_at || p.선고일자 || p.decidedAt || '';
    const precId = p.id || p.판례일련번호 || p.precId || '';
    const link = p.external_url || p.prec_link || p.판례상세링크 || '';
    return `
    <div class="prec-card${isSanjae ? ' sanjae' : ''}" onclick="openModal('${precId}','${encodeURIComponent(link)}')"> 
      <div class="prec-tag-row">
        ${court ? `<span class="prec-tag court">${court}</span>` : ''}
        <span class="prec-tag ${isSanjae ? 'src-sanjae' : 'src-law'}">${isSanjae ? '산재 전문' : '법제처'}</span>
        ${p.type || p.판결유형 ? `<span class="prec-tag type">${p.type || p.판결유형}</span>` : ''}
      </div>
      <h5>${esc(title)}</h5>
      ${caseNo ? `<div class="prec-case-no">사건번호: ${esc(caseNo)}</div>` : ''}
      ${summary ? `<div class="prec-summary">${esc(summary)}</div>` : ''}
      <div class="prec-meta">
        <span>${date ? '선고: ' + date : ''}</span>
        <span style="color:var(--red); font-size:.78rem;"><i class="fas fa-external-link-alt me-1"></i>판례 보기</span>
      </div>
    </div>`;
  }).join('');

  renderPagination();
}

function renderPagination() {
  const total = Math.ceil(_total / PAGE_SIZE);
  if (total <= 1) return;
  const pg = document.getElementById('precPagination');
  let html = '';
  const start = Math.max(1, _curPage - 2);
  const end = Math.min(total, _curPage + 2);
  if (_curPage > 1) html += `<button class="prec-page-btn" onclick="goPage(${_curPage-1})">‹</button>`;
  for (let i = start; i <= end; i++)
    html += `<button class="prec-page-btn${i===_curPage?' active':''}" onclick="goPage(${i})">${i}</button>`;
  if (_curPage < total) html += `<button class="prec-page-btn" onclick="goPage(${_curPage+1})">›</button>`;
  pg.innerHTML = html;
}

function goPage(p) { _curPage = p; fetchPrecedents(); window.scrollTo({top:200,behavior:'smooth'}); }

// API 미준비 시 샘플 데이터
function renderFallback() {
  const SAMPLE = [
    {id:'2024도8821',court:'대법원',src:'law',caseNo:'대법원 2024도8821',title:'지게차 충돌 사망 — 안전관리자 선임 의무 위반',summary:'3톤 지게차 충돌로 근로자 1명 사망. 안전관리자 미선임 상태에서 작업을 진행한 사업주에게 산안법 위반 및 중대재해처벌법 병합 적용.',date:'2024.11.14',type:'형사'},
    {id:'2024나12345',court:'서울고법',src:'law',caseNo:'서울고법 2024나12345',title:'프레스 끼임 — 방호장치 미설치로 손가락 3개 절단',summary:'프레스 방호장치를 사업주가 임의 제거 지시. 작업자 손가락 3개 절단. 손해배상 1억 2천만 원 및 형사 벌금 2,000만 원 선고.',date:'2024.09.03',type:'민·형사'},
    {id:'2024고단993',court:'부산지법',src:'law',caseNo:'부산지법 2024고단993',title:'건설현장 추락 사망 — 안전난간 미설치',summary:'고층 건설현장 개구부 안전난간 미설치 상태에서 근로자 추락 사망. 원청·하청 모두 책임 인정. 징역 6개월 집행유예.',date:'2024.07.22',type:'형사'},
    {id:'2023도15872',court:'대법원',src:'sanjae',caseNo:'대법원 2023도15872',title:'밀폐공간 질식 사망 — 산소 농도 측정 미실시',summary:'맨홀 작업 전 산소 농도 미측정으로 작업자 2명 질식 사망. 사전 산소·유해가스 농도 측정 및 환기 의무 미이행.',date:'2024.04.11',type:'형사'},
    {id:'2024고합211',court:'수원지법',src:'law',caseNo:'수원지법 2024고합211',title:'타워크레인 고압선 접촉 감전 사망',summary:'타워크레인 붐대 고압선 접촉으로 신호수 감전 사망. 이격거리 기준 미준수 및 감시인 미배치.',date:'2024.12.05',type:'형사'},
    {id:'2024구합70321',court:'서울행법',src:'sanjae',caseNo:'서울행법 2024구합70321',title:'출퇴근 재해 — 통상적 경로 이탈 후 교통사고',summary:'퇴근 중 편의점 들른 후 교통사고. 「통상적 경로·방법」의 이탈 여부가 쟁점. 산재 인정.',date:'2024.11.28',type:'행정'},
  ];

  const filtered = _curTab === 'sanjae' ? SAMPLE.filter(s => s.src === 'sanjae') : SAMPLE;
  _total = filtered.length;

  const countEl = document.getElementById('precCount');
  countEl.style.display = '';
  countEl.innerHTML = `<strong>${filtered.length}건</strong> — API 연결 후 실시간 데이터가 표시됩니다 (현재 샘플 데이터)`;

  document.getElementById('precList').innerHTML = filtered.map(p => {
    const isSanjae = p.src === 'sanjae';
    return `
    <div class="prec-card${isSanjae ? ' sanjae' : ''}" onclick="openDetailSample('${p.id}')">
      <div class="prec-tag-row">
        <span class="prec-tag court">${p.court}</span>
        <span class="prec-tag ${isSanjae ? 'src-sanjae' : 'src-law'}">${isSanjae ? '산재 전문' : '법제처'}</span>
        <span class="prec-tag type">${p.type}</span>
      </div>
      <h5>${esc(p.title)}</h5>
      <div class="prec-case-no">사건번호: ${esc(p.caseNo)}</div>
      <div class="prec-summary">${esc(p.summary)}</div>
      <div class="prec-meta"><span>선고: ${p.date}</span><span style="color:var(--sub);font-size:.76rem;">샘플 데이터</span></div>
    </div>`;
  }).join('');
}

// 모달 열기 (API)
async function openModal(precId, linkEncoded) {
  if (!precId || precId === 'undefined') {
    const link = linkEncoded ? decodeURIComponent(linkEncoded) : '';
    if (link) { window.open(link, '_blank'); return; }
    return;
  }
  document.getElementById('precModal').classList.add('open');
  document.getElementById('modalBody').innerHTML = '<div class="prec-loading"><i class="fas fa-spinner fa-spin me-2"></i>불러오는 중...</div>';
  try {
    const res = await fetch(`${API}/precedents/${precId}`);
    if (!res.ok) throw new Error();
    const d = await res.json();
    const p = d.data || d;
    renderModal(p);
  } catch {
    const link = linkEncoded ? decodeURIComponent(linkEncoded) : '';
    document.getElementById('modalBody').innerHTML = `
      <p style="color:var(--sub); margin-bottom:16px;">판례 본문을 불러올 수 없습니다.</p>
      ${link ? `<a href="${link}" target="_blank" class="btn-red">법제처에서 보기 →</a>` : ''}`;
  }
}

// 샘플 데이터 모달
const SAMPLE_DETAIL = {
  '2024도8821': {title:'지게차 충돌 사망 — 안전관리자 선임 의무 위반',caseNo:'대법원 2024도8821',court:'대법원',date:'2024.11.14',gist:'50인 이상 제조업 사업장 안전관리자 미선임 자체가 산안법 위반이며, 사망 발생 시 중대재해처벌법 병합 적용',point:'안전관리자 선임 의무를 이행하지 않고 지게차 작업을 진행하다 근로자 사망. 사업주는 산업안전보건법 위반과 중대재해처벌법 위반이 병합 적용됨.',refs:['산업안전보건법 제17조','중대재해처벌법 제6조'],result:'벌금 3,000만 원, 징역 1년(집행유예 2년)'},
  '2024나12345': {title:'프레스 끼임 — 방호장치 미설치',caseNo:'서울고법 2024나12345',court:'서울고등법원',date:'2024.09.03',gist:'방호장치를 임의 제거하거나 해체·무효화를 지시한 경우 형사처벌 및 민사 손해배상 모두 부담',point:'사업주가 생산성을 이유로 프레스 방호장치 제거 지시. 작업자 손가락 3개 절단. 고의적 안전장치 제거는 가중 처벌 요인.',refs:['산업안전보건법 제80조','산업안전보건법 제38조'],result:'손해배상 1억 2천만 원, 벌금 2,000만 원'},
};

function openDetailSample(id) {
  document.getElementById('precModal').classList.add('open');
  const p = SAMPLE_DETAIL[id];
  if (!p) { document.getElementById('modalBody').innerHTML = '<p>상세 정보가 없습니다.</p>'; return; }
  renderModalFromSample(p);
}

function renderModal(p) {
  const title = p.title || p.사건명 || '';
  const caseNo = p.case_no || p.사건번호 || '';
  const court = p.court || p.법원명 || '';
  const date = p.decided_at || p.선고일자 || '';
  const gist = p.summary || p.판시사항 || '';
  const point = p.key_point || p.판결요지 || '';
  const content = p.content || p.판례내용 || '';
  const refs = (p.law_refs || p.참조조문 || []).join(' / ');
  const link = p.external_url || p.prec_link || p.판례상세링크 || '';
  document.getElementById('modalBody').innerHTML = `
    <h4>${esc(title)}</h4>
    <div class="prec-modal-meta">
      ${court ? `<span class="prec-tag court">${esc(court)}</span>` : ''}
      ${date ? `<span class="prec-tag type">${date}</span>` : ''}
      ${caseNo ? `<span class="prec-tag type">${esc(caseNo)}</span>` : ''}
    </div>
    ${gist ? `<div class="prec-section"><div class="prec-section-title">판시사항</div><div class="prec-section-body">${esc(gist)}</div></div>` : ''}
    ${point ? `<div class="prec-section"><div class="prec-section-title">판결요지</div><div class="prec-section-body">${esc(point)}</div></div>` : ''}
    ${content ? `<div class="prec-section"><div class="prec-section-title">판례내용</div><div class="prec-section-body">${esc(content).slice(0,800)}${content.length>800?'…':''}</div></div>` : ''}
    ${refs ? `<div class="prec-section"><div class="prec-section-title">참조조문</div><div class="prec-section-body">${esc(refs)}</div></div>` : ''}
    ${link ? `<div style="margin-top:20px;"><a href="${link}" target="_blank" rel="noopener" class="btn-red">법제처 원문 보기 →</a></div>` : ''}`;
}

function renderModalFromSample(p) {
  document.getElementById('modalBody').innerHTML = `
    <h4>${esc(p.title)}</h4>
    <div class="prec-modal-meta">
      <span class="prec-tag court">${esc(p.court)}</span>
      <span class="prec-tag type">${p.date}</span>
      <span class="prec-tag type">${esc(p.caseNo)}</span>
    </div>
    <div class="prec-section"><div class="prec-section-title">핵심 판시</div><div class="prec-section-body">${esc(p.gist)}</div></div>
    <div class="prec-section"><div class="prec-section-title">판결요지</div><div class="prec-section-body">${esc(p.point)}</div></div>
    <div class="prec-section"><div class="prec-section-title">참조조문</div><div class="prec-section-body">${p.refs.join('\n')}</div></div>
    <div class="prec-section"><div class="prec-section-title">결과</div><div class="prec-section-body">${esc(p.result)}</div></div>
    <p style="margin-top:20px;font-size:.8rem;color:var(--sub);">* 샘플 데이터입니다. API 연결 후 법제처 실제 판례가 표시됩니다.</p>`;
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('precModal') || e.type === 'click' && !e.target.closest)
    document.getElementById('precModal').classList.remove('open');
}
document.getElementById('precModal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('open');
});

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 초기 로드
document.addEventListener('DOMContentLoaded', () => fetchPrecedents());
</script>
