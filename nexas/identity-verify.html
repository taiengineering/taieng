<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>본인인증 | TAI Engineering</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/tai-main.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Noto Sans KR', sans-serif; background: #f8fafc; }
  .verify-wrap { max-width: 480px; margin: 60px auto; }
  .verify-card { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.06); padding: 40px; }
  .verify-card h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; }
  .verify-card .sub { color: #64748b; font-size: .9rem; margin-bottom: 28px; }
  .verify-btns { display: flex; gap: 10px; margin-bottom: 28px; }
  .verify-btns button { flex: 1; padding: 14px 0; border: none; border-radius: 10px; font-size: .95rem; font-weight: 700; cursor: pointer; transition: .15s; }
  .btn-auth { background: #1a5fd4; color: #fff; }
  .btn-auth:hover { background: #144bb0; }
  .btn-sign { background: #f1f5f9; color: #1a5fd4; }
  .btn-sign:hover { background: #e2e8f0; }
  .btn-id { background: #f1f5f9; color: #475569; }
  .btn-id:hover { background: #e2e8f0; }
  .result-box { background: #f8fafc; border-radius: 10px; padding: 20px; }
  .result-box dl { margin: 0; }
  .result-box dt { font-size: .8rem; color: #94a3b8; font-weight: 600; margin-bottom: 2px; }
  .result-box dd { font-size: 1rem; font-weight: 600; color: #0f172a; margin-bottom: 14px; }
  .result-box dd:last-child { margin-bottom: 0; }
  .badge-status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: .8rem; font-weight: 700; }
  .badge-pending { background: #f1f5f9; color: #94a3b8; }
  .badge-success { background: #dcfce7; color: #16a34a; }
  .badge-fail { background: #fee2e2; color: #dc2626; }
  .notice { font-size: .8rem; color: #94a3b8; text-align: center; margin-top: 20px; }
  #tai-toast-wrap { position:fixed; top:1.5rem; right:1.5rem; z-index:9999; display:flex; flex-direction:column; gap:8px; }
  .tai-toast { min-width:280px; padding:12px 16px; border-radius:8px; font-size:14px; font-weight:500; box-shadow:0 4px 12px rgba(0,0,0,.15); color:#fff; animation:toastIn .3s ease; }
  .tai-toast--success { background:#0F9D6A; }
  .tai-toast--error { background:#EF4444; }
  .tai-toast.hide { animation:toastOut .4s ease forwards; }
  @keyframes toastIn { from{opacity:0;transform:translateX(100%)} to{opacity:1;transform:translateX(0)} }
  @keyframes toastOut { from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(100%)} }
</style>
</head>
<body>
<div id="tai-header"></div>
<div id="tai-toast-wrap"></div>

<div class="verify-wrap">
  <div class="verify-card">
    <h2>본인인증</h2>
    <p class="sub">KG이니시스 통합인증서비스를 통해 본인확인을 진행합니다.</p>

    <div class="verify-btns">
      <button class="btn-auth" onclick="requestVerify('01')">간편인증</button>
      <button class="btn-sign" onclick="requestVerify('02')">전자서명</button>
      <button class="btn-id" onclick="requestVerify('03')">본인확인</button>
    </div>

    <div class="result-box">
      <dl>
        <dt>인증 상태</dt>
        <dd><span class="badge-status badge-pending" id="verifyStatus">미인증</span></dd>
        <dt>이름</dt>
        <dd id="verifiedName">-</dd>
        <dt>휴대폰</dt>
        <dd id="verifiedPhone">-</dd>
        <dt>생년월일</dt>
        <dd id="verifiedBirth">-</dd>
      </dl>
    </div>

    <p class="notice">테스트 모드에서는 실제 인증이 수행되지 않습니다.</p>
  </div>
</div>

<div id="tai-footer"></div>

<script src="assets/js/jquery.3.6.min.js"></script>
<script src="assets/js/bootstrap.min.js"></script>
<script src="assets/js/header.js"></script>
<script src="assets/js/footer.js"></script>
<script>
var API_BASE = 'https://api.taieng.co.kr';

function showToast(type, msg) {
  var wrap = document.getElementById('tai-toast-wrap');
  var el = document.createElement('div');
  el.className = 'tai-toast tai-toast--' + type;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(function(){ el.classList.add('hide'); setTimeout(function(){ el.remove(); }, 400); }, 3000);
}

window.addEventListener('message', async function(e) {
  if (!e.data || e.data.type !== 'INICIS_AUTH_RESULT') return;
  if (e.data.success && e.data.mtxId) {
    try {
      var resp = await fetch(API_BASE + '/auth/inicis/result/' + encodeURIComponent(e.data.mtxId));
      var json = await resp.json();
      var d = json.data || {};
      var badge = document.getElementById('verifyStatus');
      if (d.status === 'SUCCESS') {
        badge.textContent = '인증완료';
        badge.className = 'badge-status badge-success';
      } else {
        badge.textContent = d.status || '실패';
        badge.className = 'badge-status badge-fail';
      }
      document.getElementById('verifiedName').textContent = d.user_name || '-';
      document.getElementById('verifiedPhone').textContent = d.user_phone || '-';
      document.getElementById('verifiedBirth').textContent = d.user_birthday || '-';
      showToast('success', '본인인증이 완료되었습니다.');
    } catch(err) {
      showToast('error', err.message || '결과 조회 실패');
    }
  } else {
    showToast('error', e.data.message || '인증에 실패했습니다.');
    var badge = document.getElementById('verifyStatus');
    badge.textContent = '실패';
    badge.className = 'badge-status badge-fail';
  }
});

window.requestVerify = async function(svcCode) {
  try {
    var tok = localStorage.getItem('access_token') || '';
    var resp = await fetch(API_BASE + '/auth/inicis/request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok },
      body: JSON.stringify({ svc_code: svcCode, fixed_user: false })
    });
    var json = await resp.json();
    if (json.status !== 'success') { showToast('error', '인증 요청 실패'); return; }
    var data = json.data;

    var form = document.createElement('form');
    form.method = 'POST';
    form.action = data.form_action;
    form.target = 'inicisAuthPopup';
    form.acceptCharset = 'utf-8';

    Object.keys(data.form_params || {}).forEach(function(key) {
      var input = document.createElement('input');
      input.type = 'hidden';
      input.name = key;
      input.value = data.form_params[key];
      form.appendChild(input);
    });

    window.open('', 'inicisAuthPopup',
      'width=' + (data.popup_width || 400) + ',height=' + (data.popup_height || 640));
    document.body.appendChild(form);
    form.submit();
    form.remove();
  } catch(err) {
    showToast('error', err.message || '인증 요청 실패');
  }
};
</script>
</body>
</html>
