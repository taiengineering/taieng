<script>
(function () {
  var SB = 'https://vwlahtguyggrhvslabax.supabase.co/rest/v1';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3bGFodGd1eWdncmh2c2xhYmF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyOTE1OTYsImV4cCI6MjA5Mjg2NzU5Nn0.Yp6P7ahaCuna_gwYC8_S2KD081Ov9Fs65e9o_AenP48';
  var H = { apikey: KEY, Authorization: 'Bearer ' + KEY };
  var CAT_LABEL = { EDUCATION:'교육자료', CASE_STUDY:'사고사례', GUIDE:'가이드', POSTER:'포스터·홍보', VIDEO_VR:'영상·VR', HEALTH:'보건·건강', RESEARCH:'연구·보고서', CHECKLIST:'체크리스트', FOREIGN:'외국인자료', REGULATION:'법령', OTHER:'기타' };
  var SEC_LABEL = { CONSTRUCTION:'건설', MANUFACTURING:'제조', SERVICE:'서비스', COMMON:'공통' };

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function load() {
    var id = new URLSearchParams(location.search).get('id');
    var errEl = document.getElementById('tai-detail-error');
    var titleEl = document.getElementById('tai-detail-title');
    var metaEl = document.getElementById('tai-detail-meta');
    var bodyEl = document.getElementById('tai-detail-body');
    if (!id) {
      if (errEl) errEl.textContent = '잘못된 링크입니다.';
      return;
    }
    try {
      var res = await fetch(SB + '/kosha_safety_materials?id=eq.' + encodeURIComponent(id) + '&select=*', { headers: H });
      var rows = await res.json();
      if ((!rows || !rows.length) && res.ok) {
        window.location.replace('safety-post-detail.html' + location.search);
        return;
      }
      if (!res.ok || !rows || !rows.length) throw new Error('자료를 찾을 수 없습니다.');
      var d = rows[0];
      var title = d.title || '안전보건자료';
      var cat = CAT_LABEL[d.category] || d.category || '';
      var sec = SEC_LABEL[d.sector] || d.sector || '';
      if (titleEl) titleEl.textContent = title;
      var summarySrc = d.summary || d.description || d.excerpt || title;
      if (typeof TAIDetailMeta !== 'undefined') TAIDetailMeta.setDetailMeta(title, summarySrc);
      if (metaEl) {
        metaEl.innerHTML =
          '<span class="me-2 tai-src-badge">' + esc(cat) + '</span>' +
          '<span class="me-2 tai-src-badge">' + esc(sec) + '</span>';
      }
      var inner = '';
      if (d.summary || d.description || d.excerpt) {
        var raw = d.summary || d.description || d.excerpt;
        inner += '<div class="mb-4">' + String(raw) + '</div>';
      }
      if (d.url) {
        inner += '<p><a class="btn btn-base btn-sm" href="' + esc(d.url) + '" target="_blank" rel="noopener">원문 자료 보기 (KOSHA) →</a></p>';
      } else {
        inner += '<p class="text-muted small">원문 링크가 없습니다.</p>';
      }
      if (bodyEl) bodyEl.innerHTML = inner || '<p class="text-muted">표시할 본문이 없습니다.</p>';
    } catch (e) {
      if (errEl) errEl.textContent = e.message || '오류가 발생했습니다.';
      if (bodyEl) bodyEl.innerHTML = '';
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', load);
  else load();
})();
</script>
