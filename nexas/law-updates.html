<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개정법령 현황 | TAI 엔지니어링</title>
  <link rel="icon" href="assets/img/fevicon.png">
  <link rel="stylesheet" href="assets/css/animate.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/fontawesome.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/tai-main.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
  body { font-family:'Noto Sans KR',sans-serif; }

  /* ── Hero ── */
  .law-hero { background:var(--navy); padding:100px 0 50px; }
  .law-hero h1 { font-size:clamp(1.8rem,3.5vw,2.6rem); font-weight:900; color:#fff; margin-bottom:10px; }
  .law-hero p { color:rgba(255,255,255,.6); font-size:.95rem; margin:0; }
  .law-hero .stats { display:flex; gap:24px; margin-top:16px; }
  .law-hero .stat-num { font-size:1.5rem; font-weight:900; color:#fff; }
  .law-hero .stat-label { font-size:.78rem; color:rgba(255,255,255,.5); margin-left:4px; }

  /* ── Layout ── */
  .law-layout { display:grid; grid-template-columns:300px 1fr; gap:28px; padding:36px 0 60px; align-items:start; }
  @media(max-width:991px){ .law-layout { grid-template-columns:1fr; } }

  /* ── 왼쪽 사이드바 ── */
  .law-sidebar { position:sticky; top:90px; }
  @media(max-width:991px){ .law-sidebar { position:static; } }

  .sb-search { position:relative; margin-bottom:20px; }
  .sb-search input { width:100%; padding:12px 14px 12px 40px; border:1.5px solid var(--border); border-radius:10px; font-size:.88rem; font-family:inherit; background:#fff; outline:none; transition:border .2s; }
  .sb-search input:focus { border-color:var(--navy); box-shadow:0 0 0 3px rgba(15,23,42,.08); }
  .sb-search .icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--sub); }

  .sb-label { font-size:.72rem; font-weight:800; color:var(--sub); text-transform:uppercase; letter-spacing:.08em; margin-bottom:10px; }

  .sb-cards { display:flex; flex-direction:column; gap:8px; margin-bottom:22px; }
  .sb-card { display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:12px; border:1.5px solid var(--border); background:#fff; cursor:pointer; transition:all .15s; }
  .sb-card:hover { border-color:var(--navy); background:#f8faff; }
  .sb-card.active { border-color:var(--navy); background:var(--navy); }
  .sb-card .ico { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1rem; flex-shrink:0; }
  .sb-card .ico.all { background:#f0f4ff; color:#3b5bdb; }
  .sb-card .ico.bld { background:#e0f2fe; color:#0284c7; }
  .sb-card .ico.mfg { background:#ecfdf5; color:#059669; }
  .sb-card .ico.con { background:#fef3c7; color:#d97706; }
  .sb-card .ico.cmn { background:#f3e8ff; color:#7c3aed; }
  .sb-card.active .ico { background:rgba(255,255,255,.15); color:#fff; }
  .sb-card .info { flex:1; min-width:0; }
  .sb-card .info .name { font-size:.88rem; font-weight:700; color:var(--navy); }
  .sb-card.active .info .name { color:#fff; }
  .sb-card .info .desc { font-size:.72rem; color:var(--sub); margin-top:2px; }
  .sb-card.active .info .desc { color:rgba(255,255,255,.6); }
  .sb-card .cnt { font-size:.78rem; font-weight:800; color:var(--sub); background:var(--gray-bg); padding:3px 10px; border-radius:99px; }
  .sb-card.active .cnt { background:rgba(255,255,255,.2); color:#fff; }

  .sb-year { width:100%; padding:9px 12px; border:1.5px solid var(--border); border-radius:10px; font-size:.85rem; font-family:inherit; background:#fff; cursor:pointer; outline:none; margin-bottom:16px; }

  .sb-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
  .sb-chip { padding:6px 12px; border:1.5px solid var(--border); border-radius:99px; font-size:.78rem; font-weight:700; cursor:pointer; background:#fff; color:var(--sub); transition:all .15s; }
  .sb-chip:hover { border-color:var(--navy); color:var(--navy); }
  .sb-chip.active { background:var(--navy); border-color:var(--navy); color:#fff; }

  /* ── 오른쪽 리스트 ── */
  .month-header { display:flex; align-items:center; gap:10px; margin-bottom:12px; margin-top:8px; }
  .month-header .label { font-size:.82rem; font-weight:800; color:var(--sub); white-space:nowrap; }
  .month-header .line { flex:1; height:1px; background:var(--border); }
  .month-header .cnt { font-size:.72rem; font-weight:700; background:var(--gray-bg); padding:3px 10px; border-radius:99px; color:var(--sub); }

  .law-item { background:#fff; border:1.5px solid var(--border); border-radius:12px; margin-bottom:8px; overflow:hidden; transition:box-shadow .2s; }
  .law-item:hover { box-shadow:0 4px 16px rgba(0,0,0,.07); }

  .law-item-head { display:grid; grid-template-columns:1fr 90px 80px 60px 32px; align-items:center; padding:14px 18px; cursor:pointer; gap:10px; }
  .law-item-head:hover { background:#fafbff; }
  @media(max-width:767px){ .law-item-head { grid-template-columns:1fr 70px 32px; } .hide-mobile { display:none; } }

  .law-name-wrap { display:flex; align-items:center; gap:8px; min-width:0; }
  .law-name-wrap .name { font-size:.9rem; font-weight:800; color:var(--navy); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .law-name-wrap .ministry { font-size:.72rem; color:var(--sub); white-space:nowrap; }

  .badge-sm { display:inline-block; padding:3px 8px; border-radius:5px; font-size:.7rem; font-weight:800; white-space:nowrap; }
  .badge-ilbu { background:#f3e8ff; color:#7c3aed; }
  .badge-ta { background:var(--gray-bg); color:var(--sub); }
  .badge-active { background:#ecfdf5; color:#059669; }
  .badge-pending { background:#fef3c7; color:#d97706; }

  .rules-pill { display:inline-block; padding:3px 10px; background:#eff4ff; color:#3b5bdb; border-radius:99px; font-size:.75rem; font-weight:800; }
  .rules-pill.zero { background:var(--gray-bg); color:var(--sub); }

  .expand-btn { text-align:center; font-size:.9rem; color:var(--sub); transition:transform .2s; }
  .law-item.open .expand-btn { transform:rotate(180deg); }

  .law-item-detail { display:none; padding:18px 22px; background:#fafbff; border-top:1px solid var(--border); }
  .law-item.open .law-item-detail { display:block; }

  .detail-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:14px; }
  @media(max-width:767px){ .detail-grid { grid-template-columns:1fr 1fr; } }
  .detail-grid .k { font-size:.7rem; color:var(--sub); font-weight:700; margin-bottom:3px; }
  .detail-grid .v { font-size:.85rem; font-weight:700; color:var(--navy); }

  .ob-tags { display:flex; gap:5px; flex-wrap:wrap; }
  .ob-tag { padding:3px 8px; border-radius:5px; font-size:.7rem; font-weight:800; background:var(--gray-bg); color:#4b5563; }

  .btn-source { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; background:#fff; border:1.5px solid var(--border); border-radius:10px; font-size:.82rem; font-weight:700; color:var(--navy); text-decoration:none; transition:all .15s; margin-top:6px; }
  .btn-source:hover { background:#f0f4ff; border-color:var(--navy); color:var(--navy); }

  .empty-state { text-align:center; padding:60px 20px; color:var(--sub); }
  .empty-state .big { font-size:2.5rem; margin-bottom:10px; }
  .empty-state .msg { font-size:.95rem; font-weight:600; }
  </style>
</head>

<!-- HEADER -->

<div class="law-hero">

    <span class="sec-tag" style="color:rgba(255,255,255,.5); border-color:rgba(255,255,255,.15);">안전정보</span>
    <h1>개정법령 현황</h1>
    <p>산업안전 관련 법령의 개정 이력을 섹터별로 확인하고, 원문을 바로 볼 수 있습니다.</p>

      <!-- 오른쪽 리스트 -->
      <div id="mainList">

<script>
var SB_URL='https://xntdkrjhgcscmqctdzyo.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhudGRrcmpnY3NjbXFjdGR6eW8iLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc0MjE3NDEzNywiZXhwIjoyMDU3NzUwMTM3fQ.gYPRSMJ2ng5M0HndLoRXWfMnLqSHwYFjfpnXMsBhmUY';
var SECTOR_LABEL={BUILDING:'건물',MANUFACTURING:'산업',CONSTRUCTION:'건설',COMMON:'공통'};
var OB_LABEL={INSPECT:'점검',ACTION:'조치',NOTIFY:'신고',REPORT:'기록',APPOINT:'선임',DOCUMENT:'문서',OTHER:'기타',BEFORE_WORK:'작업전'};
var TYPE_LABEL={LAW:'법률',ENFORCEMENT_DECREE:'시행령',ENFORCEMENT_RULE:'시행규칙'};
var allData=[],filters={sector:'ALL',year:'2026',type:'ALL',status:'ALL',search:''};

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function loadData(){
  var hdr={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
  try{
    var vRes=await fetch(SB_URL+'/rest/v1/law_version?is_current=eq.true&select=id,law_id,revision_type_code,announcement_date,enforcement_date,source_url&order=enforcement_date.desc',{headers:hdr});
    var versions=await vRes.json();
    var mRes=await fetch(SB_URL+'/rest/v1/law_master?is_active=eq.true&select=id,law_name,law_type_code,ministry_name,source_url',{headers:hdr});
    var masters=await mRes.json();
    var masterMap={}; masters.forEach(function(m){masterMap[m.id]=m;});
    var rRes=await fetch(SB_URL+'/rest/v1/master_building_legal_rules?is_active=eq.true&select=law_name,sector,obligation_type',{headers:hdr});
    var rules=await rRes.json();
    var ruleAgg={};
    rules.forEach(function(r){
      if(!ruleAgg[r.law_name])ruleAgg[r.law_name]={sectors:{},types:{},count:0};
      ruleAgg[r.law_name].sectors[r.sector]=1;
      ruleAgg[r.law_name].types[r.obligation_type]=1;
      ruleAgg[r.law_name].count++;
    });
    allData=versions.map(function(v){
      var m=masterMap[v.law_id]||{};
      var ra=ruleAgg[m.law_name]||{sectors:{},types:{},count:0};
      var today=new Date().toISOString().slice(0,10);
      return{
        law_name:m.law_name||'(알 수 없음)',
        law_type_code:m.law_type_code||'',
        ministry_name:m.ministry_name||'',
        revision_type:v.revision_type_code||'',
        announcement_date:v.announcement_date,
        enforcement_date:v.enforcement_date,
        source_url:v.source_url||m.source_url||null,
        status:v.enforcement_date>today?'시행예정':'시행중',
        sectors:Object.keys(ra.sectors).join(','),
        obligation_types:Object.keys(ra.types).join(','),
        rule_count:ra.count,
        year:v.enforcement_date?(v.enforcement_date).slice(0,4):'',
        month:v.enforcement_date?(v.enforcement_date).slice(5,7):''
      };
    });
  }catch(e){console.error('load error',e);}
  updateStats(); render();
}

function updateStats(){
  var f=getFiltered();
  document.getElementById('hTotal').textContent=f.length;
  document.getElementById('hActive').textContent=f.filter(function(d){return d.status==='시행중';}).length;
  document.getElementById('hPending').textContent=f.filter(function(d){return d.status==='시행예정';}).length;
  document.getElementById('hIlbu').textContent=f.filter(function(d){return d.revision_type==='일부개정';}).length;
  var sc={ALL:0,BUILDING:0,MANUFACTURING:0,CONSTRUCTION:0,COMMON:0};
  allData.forEach(function(d){
    if(filters.year!=='ALL'&&d.year!==filters.year)return;
    sc.ALL++;
    (d.sectors||'').split(',').forEach(function(s){if(sc[s]!==undefined)sc[s]++;});
  });
  document.getElementById('cAll').textContent=sc.ALL;
  document.getElementById('cBld').textContent=sc.BUILDING;
  document.getElementById('cMfg').textContent=sc.MANUFACTURING;
  document.getElementById('cCon').textContent=sc.CONSTRUCTION;
  document.getElementById('cCmn').textContent=sc.COMMON;
}

function getFiltered(){
  return allData.filter(function(d){
    if(filters.year!=='ALL'&&d.year!==filters.year)return false;
    if(filters.sector!=='ALL'&&(d.sectors||'').indexOf(filters.sector)===-1)return false;
    if(filters.type!=='ALL'&&d.revision_type!==filters.type)return false;
    if(filters.status!=='ALL'&&d.status!==filters.status)return false;
    if(filters.search&&d.law_name.indexOf(filters.search)===-1)return false;
    return true;
  });
}

function render(){
  var list=getFiltered();
  var main=document.getElementById('mainList');
  if(!list.length){main.innerHTML='<div class="empty-state"><div class="big">?\udcdc</div><div class="msg">조건에 맞는 개정 법령이 없습니다.</div></div>';return;}
  var groups={};
  list.forEach(function(d){var k=d.year+'-'+d.month;if(!groups[k])groups[k]=[];groups[k].push(d);});
  var keys=Object.keys(groups).sort().reverse();
  var html='';
  keys.forEach(function(key){
    var parts=key.split('-');
    var items=groups[key];
    html+='<div class="month-header"><span class="label">'+parts[0]+'년 '+parseInt(parts[1])+'월</span><span class="line"></span><span class="cnt">'+items.length+'건</span></div>';
    items.sort(function(a,b){return(b.enforcement_date||'').localeCompare(a.enforcement_date||'');});
    items.forEach(function(d){
      var revBdg=d.revision_type==='일부개정'?'<span class="badge-sm badge-ilbu">일부개정</span>':d.revision_type==='타법개정'?'<span class="badge-sm badge-ta">타법개정</span>':'<span class="badge-sm badge-ta">—</span>';
      var stBdg=d.status==='시행중'?'<span class="badge-sm badge-active">시행중</span>':'<span class="badge-sm badge-pending">시행예정</span>';
      var rPill=d.rule_count>0?'<span class="rules-pill">'+d.rule_count+'건</span>':'<span class="rules-pill zero">0</span>';
      var obTags=(d.obligation_types||'').split(',').filter(Boolean).map(function(t){return'<span class="ob-tag">'+(OB_LABEL[t]||t)+'</span>';}).join('');
      var secTags=(d.sectors||'').split(',').filter(Boolean).map(function(s){return SECTOR_LABEL[s]||s;}).join(' · ');
      var srcUrl=d.source_url||'https://www.law.go.kr/법령/'+encodeURIComponent(d.law_name);
      html+='<div class="law-item"><div class="law-item-head" onclick="this.parentElement.classList.toggle(\'open\')">';
      html+='<div class="law-name-wrap">'+revBdg+'<span class="name" title="'+esc(d.law_name)+'">'+esc(d.law_name)+'</span><span class="ministry hide-mobile">'+esc(d.ministry_name)+'</span></div>';
      html+='<div class="hide-mobile" style="font-size:.82rem;color:#374151;font-variant-numeric:tabular-nums;">'+((d.enforcement_date||'').slice(5).replace('-','.'))+'</div>';
      html+=stBdg;
      html+='<div class="hide-mobile" style="text-align:center;">'+rPill+'</div>';
      html+='<div class="expand-btn">▾</div>';
      html+='</div>';
      html+='<div class="law-item-detail"><div class="detail-grid">';
      html+='<div><div class="k">공포일</div><div class="v">'+(d.announcement_date||'-')+'</div></div>';
      html+='<div><div class="k">시행일</div><div class="v">'+(d.enforcement_date||'-')+'</div></div>';
      html+='<div><div class="k">법령 유형</div><div class="v">'+(TYPE_LABEL[d.law_type_code]||d.law_type_code||'-')+'</div></div>';
      html+='<div><div class="k">소관부처</div><div class="v">'+esc(d.ministry_name||'-')+'</div></div>';
      html+='<div><div class="k">적용 섹터</div><div class="v">'+(secTags||'미분류')+'</div></div>';
      html+='<div><div class="k">관련 의무</div><div class="v">'+d.rule_count+'건</div></div>';
      html+='</div>';
      if(obTags)html+='<div style="margin-bottom:14px"><div class="k" style="margin-bottom:6px">의무 유형</div><div class="ob-tags">'+obTags+'</div></div>';
      html+='<a href="'+esc(srcUrl)+'" target="_blank" rel="noopener" class="btn-source"><i class="fas fa-external-link-alt"></i> 국가법령정보센터에서 원문 보기</a>';
      html+='</div></div>';
    });
  });
  main.innerHTML=html;
}

// Events
document.getElementById('sectorCards').addEventListener('click',function(e){
  var card=e.target.closest('.sb-card');if(!card)return;
  this.querySelectorAll('.sb-card').forEach(function(c){c.classList.remove('active');});
  card.classList.add('active');
  filters.sector=card.dataset.sector;
  updateStats();render();
});
document.getElementById('yearSelect').addEventListener('change',function(){filters.year=this.value;updateStats();render();});
document.getElementById('typeChips').addEventListener('click',function(e){
  var chip=e.target.closest('.sb-chip');if(!chip)return;
  this.querySelectorAll('.sb-chip').forEach(function(c){c.classList.remove('active');});
  chip.classList.add('active');filters.type=chip.dataset.type;render();
});
document.getElementById('statusChips').addEventListener('click',function(e){
  var chip=e.target.closest('.sb-chip');if(!chip)return;
  this.querySelectorAll('.sb-chip').forEach(function(c){c.classList.remove('active');});
  chip.classList.add('active');filters.status=chip.dataset.status;render();
});
document.getElementById('searchInput').addEventListener('input',function(){filters.search=this.value.trim();render();});

document.addEventListener('DOMContentLoaded',function(){loadData();});
</script>
