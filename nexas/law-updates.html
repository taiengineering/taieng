<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개정법령 현황 | TAI 엔지니어링</title>
  <link rel="icon" href="assets/img/fevicon.png">
  <link rel="stylesheet" href="assets/css/animate.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/fontawesome.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/tai-main.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
  body { font-family: 'Noto Sans KR', sans-serif; }

  /* ── fix-request 동일 패턴: 40:60 grid ── */
  .lu-layout {
    min-height: calc(100vh - var(--tai-nav-h, 90px));
    display: grid;
    grid-template-columns: 40% 60%;
  }

  /* ── 왼쪽 패널 (sticky, dark) ── */
  .lu-left {
    background: linear-gradient(160deg, #0d1b2a 0%, #1a3a5c 100%);
    padding: 36px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    color: #fff;
    position: sticky;
    top: 0;
    height: calc(100vh - var(--tai-nav-h, 90px));
    overflow-y: auto;
  }

  .lu-left h2 {
    font-size: 1.5rem;
    font-weight: 900;
    line-height: 1.35;
    margin: 0 0 6px;
    color: #fff;
    text-align: center;
  }
  .lu-left h2 em { font-style: normal; color: #60a5fa; }
  .lu-left .lu-sub {
    font-size: .85rem;
    color: rgba(255,255,255,.6);
    margin-bottom: 24px;
    text-align: center;
  }

  /* 통계 바 */
  .lu-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    width: 100%;
    max-width: 420px;
    margin-bottom: 24px;
  }
  .lu-stat {
    background: rgba(255,255,255,.08);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
  }
  .lu-stat .num { font-size: 1.3rem; font-weight: 900; color: #fff; }
  .lu-stat .label { font-size: .65rem; color: rgba(255,255,255,.5); margin-top: 2px; }

  /* 검색 */
  .lu-search {
    position: relative;
    width: 100%;
    max-width: 420px;
    margin-bottom: 20px;
  }
  .lu-search input {
    width: 100%;
    padding: 12px 14px 12px 40px;
    border: 1.5px solid rgba(255,255,255,.15);
    border-radius: 12px;
    font-size: .88rem;
    font-family: inherit;
    background: rgba(255,255,255,.08);
    color: #fff;
    outline: none;
    transition: border-color .2s;
  }
  .lu-search input::placeholder { color: rgba(255,255,255,.4); }
  .lu-search input:focus { border-color: #60a5fa; background: rgba(255,255,255,.12); }
  .lu-search .icon {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    color: rgba(255,255,255,.4); font-size: .9rem;
  }

  /* 섹터 카드 그리드 */
  .lu-cat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
    max-width: 420px;
    margin-bottom: 22px;
  }
  .lu-cat-card {
    background: rgba(255,255,255,.06);
    border: 1.5px solid rgba(255,255,255,.1);
    border-radius: 14px;
    padding: 18px 14px;
    cursor: pointer;
    transition: all .2s;
    text-align: center;
  }
  .lu-cat-card:hover {
    border-color: #60a5fa;
    background: rgba(96,165,250,.12);
    transform: translateY(-2px);
  }
  .lu-cat-card.active {
    border-color: #60a5fa;
    background: rgba(96,165,250,.2);
    box-shadow: 0 0 20px rgba(96,165,250,.15);
  }
  .lu-cat-card .icon { font-size: 1.5rem; margin-bottom: 6px; }
  .lu-cat-card .name { font-size: .82rem; font-weight: 700; color: rgba(255,255,255,.8); }
  .lu-cat-card.active .name { color: #fff; }
  .lu-cat-card .count {
    font-size: 1.4rem; font-weight: 900; margin-top: 4px;
    color: rgba(255,255,255,.6);
  }
  .lu-cat-card.active .count { color: #60a5fa; }
  .lu-cat-all { grid-column: 1 / -1; }

  /* 필터 칩 */
  .lu-filter-group {
    width: 100%; max-width: 420px; margin-bottom: 14px;
  }
  .lu-filter-title {
    font-size: .68rem; font-weight: 700; color: rgba(255,255,255,.35);
    letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px;
  }
  .lu-filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .lu-chip {
    padding: 6px 14px; border: 1.5px solid rgba(255,255,255,.12);
    border-radius: 999px; font-size: .78rem; font-weight: 600;
    cursor: pointer; background: transparent; color: rgba(255,255,255,.5);
    transition: all .15s;
  }
  .lu-chip:hover { border-color: rgba(255,255,255,.3); color: rgba(255,255,255,.8); }
  .lu-chip.active { background: #60a5fa; border-color: #60a5fa; color: #fff; }

  .lu-year-select {
    width: 100%; max-width: 420px; padding: 9px 12px;
    border: 1.5px solid rgba(255,255,255,.12); border-radius: 10px;
    font-size: .85rem; font-family: inherit;
    background: rgba(255,255,255,.06); color: #fff;
    cursor: pointer; outline: none; margin-bottom: 14px;
  }
  .lu-year-select option { background: #1e293b; color: #fff; }

  /* ── 오른쪽 패널 (scrollable, light) ── */
  .lu-right {
    background: var(--gray-bg, #f4f6f8);
    padding: 28px 32px;
    overflow-y: auto;
    height: calc(100vh - var(--tai-nav-h, 90px));
  }

  .lu-right-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 20px;
  }
  .lu-right-header h3 {
    font-size: 1.15rem; font-weight: 900; color: var(--navy, #0d1b2a);
    margin: 0;
  }
  .lu-right-header .result-count {
    font-size: .82rem; color: var(--sub, #5a6476); font-weight: 600;
  }

  /* 월별 그룹 */
  .lu-month-group { margin-bottom: 24px; }
  .lu-month-label {
    display: flex; align-items: center; gap: 10px;
    font-size: .82rem; font-weight: 700; color: var(--sub, #5a6476);
    margin-bottom: 10px;
  }
  .lu-month-label .bar { flex: 1; height: 1px; background: var(--border, #e8eaed); }
  .lu-month-label .cnt {
    font-size: .7rem; font-weight: 700; background: #e2e8f0;
    padding: 2px 10px; border-radius: 99px; color: #475569;
  }

  /* 법령 행 */
  .lu-row {
    background: #fff; border: 1.5px solid var(--border, #e8eaed);
    border-radius: 14px; margin-bottom: 8px; overflow: hidden;
    transition: box-shadow .2s, border-color .2s;
  }
  .lu-row:hover { box-shadow: 0 4px 16px rgba(0,0,0,.06); border-color: #cbd5e1; }
  .lu-row-head {
    display: grid; grid-template-columns: 1fr 90px 80px 70px 32px;
    align-items: center; padding: 14px 18px; cursor: pointer; gap: 10px;
  }
  .lu-row-head:hover { background: #fafbfc; }
  .lu-name-cell { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .lu-name-cell .name {
    font-size: .9rem; font-weight: 800; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; color: var(--navy, #0d1b2a);
  }
  .lu-name-cell .ministry { font-size: .72rem; color: var(--sub, #5a6476); white-space: nowrap; }

  .lu-badge {
    display: inline-block; padding: 3px 8px; border-radius: 4px;
    font-size: .7rem; font-weight: 700; white-space: nowrap;
  }
  .badge-ilbu { background: #ede9fe; color: #7c3aed; }
  .badge-ta   { background: #f1f5f9; color: #64748b; }
  .badge-ok   { background: #ecfdf5; color: #059669; }
  .badge-wait { background: #fffbeb; color: #d97706; }

  .lu-date { font-size: .82rem; color: #374151; font-variant-numeric: tabular-nums; }
  .lu-rules { text-align: center; }
  .lu-rules-pill {
    display: inline-block; padding: 2px 10px; border-radius: 99px;
    font-size: .75rem; font-weight: 700;
  }
  .lu-rules-pill.has { background: #dbeafe; color: #2563eb; }
  .lu-rules-pill.zero { background: #f1f5f9; color: #94a3b8; }
  .lu-expand { text-align: center; font-size: .9rem; color: #94a3b8; transition: transform .2s; }
  .lu-row.open .lu-expand { transform: rotate(180deg); }

  /* 펼침 상세 */
  .lu-detail { display: none; border-top: 1px solid #f0f1f5; padding: 18px 22px; background: #fafbfd; }
  .lu-row.open .lu-detail { display: block; }
  .lu-detail-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 14px; }
  .lu-detail-item .k { font-size: .7rem; color: var(--sub, #5a6476); font-weight: 600; margin-bottom: 3px; }
  .lu-detail-item .v { font-size: .82rem; font-weight: 600; color: var(--navy, #0d1b2a); }
  .lu-ob-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .lu-ob-tag {
    padding: 3px 8px; border-radius: 4px; font-size: .7rem;
    font-weight: 700; background: #f1f5f9; color: #475569;
  }
  .lu-btn-source {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 16px; margin-top: 10px;
    background: #fff; border: 1.5px solid var(--border, #e8eaed);
    border-radius: 10px; font-size: .82rem; font-weight: 600;
    color: var(--navy, #0d1b2a); text-decoration: none; transition: all .15s;
  }
  .lu-btn-source:hover { background: #f0f4ff; border-color: #2563eb; color: #2563eb; }

  .lu-empty { text-align: center; padding: 60px 20px; color: var(--sub, #5a6476); }
  .lu-empty .icon { font-size: 2.8rem; margin-bottom: 10px; }
  .lu-empty .msg { font-size: .95rem; font-weight: 600; }

  /* ── 반응형 ── */
  @media (max-width: 992px) {
    .lu-layout { grid-template-columns: 1fr; }
    .lu-left {
      position: static; height: auto;
      padding: 28px 20px; min-height: auto;
    }
    .lu-right { height: auto; min-height: 60vh; }
    .lu-row-head { grid-template-columns: 1fr 80px 32px; }
    .lu-date, .lu-rules { display: none; }
    .lu-stats { grid-template-columns: repeat(4, 1fr); }
    .lu-cat-grid { max-width: 100%; }
    .lu-search, .lu-filter-group { max-width: 100%; }
  }

  @media (max-width: 576px) {
    .lu-left { padding: 24px 16px; }
    .lu-right { padding: 20px 16px; }
    .lu-stats { grid-template-columns: repeat(2, 1fr); }
    .lu-left h2 { font-size: 1.2rem; }
  }
  </style>
</head>
<body class="sc5">
<div class="preloader" id="preloader"><div class="preloader-inner"><div class="spinner"><div class="dot1"></div><div class="dot2"></div></div></div></div>
<div class="body-overlay" id="body-overlay"></div>

<div id="tai-header"></div>

<div class="lu-layout">
  <!-- ── 왼쪽 패널 ── -->
  <div class="lu-left">
    <h2><em>개정법령</em> 현황</h2>
    <p class="lu-sub">산업안전 법령의 개정 이력을 섹터별로 확인하세요</p>

    <div class="lu-stats">
      <div class="lu-stat"><div class="num" id="s-total">-</div><div class="label">전체</div></div>
      <div class="lu-stat"><div class="num" id="s-active">-</div><div class="label">시행중</div></div>
      <div class="lu-stat"><div class="num" id="s-pending">-</div><div class="label">시행예정</div></div>

    <div class="lu-filter-group">

        <option value="2026" selected>2026년</option>
        <option value="2025">2025년</option>
        <option value="ALL">전체 연도</option>
      </select>

    <div class="lu-filter-group">
      <div class="lu-filter-title">개정 유형</div>
      <div class="lu-filter-chips" id="typeChips">
        <span class="lu-chip active" data-type="ALL">전체</span>
        <span class="lu-chip" data-type="일부개정">일부개정</span>
        <span class="lu-chip" data-type="타법개정">타법개정</span>
      </div>
    </div>

    <div class="lu-filter-group">
      <div class="lu-filter-title">시행 상태</div>
      <div class="lu-filter-chips" id="statusChips">
        <span class="lu-chip active" data-status="ALL">전체</span>
        <span class="lu-chip" data-status="시행중">시행중</span>
        <span class="lu-chip" data-status="시행예정">시행예정</span>
      </div>
    </div>
  </div>

  <!-- ── 오른쪽 패널 ── -->
  <div class="lu-right">
    <div class="lu-right-header">
      <h3>개정 법령 목록</h3>
      <span class="result-count" id="resultCount">-</span>
    </div>
    <div id="mainList">
      <div class="lu-empty"><div class="icon"><i class="fas fa-spinner fa-spin"></i></div><div class="msg">데이터를 불러오는 중...</div></div>
    </div>
  </div>
</div>

<script src="assets/js/bootstrap.min.js"></script>
<script src="assets/js/main.js"></script>

<script src="assets/js/nav-auth.js"></script>
<script src="assets/js/footer.js"></script>
<script>
const SB_URL='https://xntdkrjhgcscmqctdzyo.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhudGRrcmpnY3NjbXFjdGR6eW8iLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc0MjE3NDEzNywiZXhwIjoyMDU3NzUwMTM3fQ.gYPRSMJ2ng5M0HndLoRXWfMnLqSHwYFjfpnXMsBhmUY';
const H={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
const SL={BUILDING:'건물',MANUFACTURING:'산업',CONSTRUCTION:'건설',COMMON:'공통'};
const OL={INSPECT:'점검',ACTION:'조치',NOTIFY:'신고',REPORT:'기록',APPOINT:'선임',DOCUMENT:'문서',OTHER:'기타',BEFORE_WORK:'작업전'};

let allData=[], filters={sector:'ALL',year:'2026',type:'ALL',status:'ALL',search:''};

async function loadData(){
  try{
    const[vr,mr,rr]=await Promise.all([
      fetch(SB_URL+'/rest/v1/law_version?is_current=eq.true&select=id,law_id,revision_type_code,announcement_date,enforcement_date,source_url&order=enforcement_date.desc',{headers:H}),
      fetch(SB_URL+'/rest/v1/law_master?is_active=eq.true&select=id,law_name,law_type_code,ministry_name,source_url',{headers:H}),
      fetch(SB_URL+'/rest/v1/master_building_legal_rules?is_active=eq.true&select=law_name,sector,obligation_type',{headers:H})
    ]);
    const[versions,masters,rules]=await Promise.all([vr.json(),mr.json(),rr.json()]);
    const mm={}; masters.forEach(m=>mm[m.id]=m);
    const ra={}; rules.forEach(r=>{
      if(!ra[r.law_name])ra[r.law_name]={s:new Set(),t:new Set(),c:0};
      ra[r.law_name].s.add(r.sector); ra[r.law_name].t.add(r.obligation_type); ra[r.law_name].c++;
    });
    allData=versions.map(v=>{
      const m=mm[v.law_id]||{};const a=ra[m.law_name]||{s:new Set(),t:new Set(),c:0};
      return{law_name:m.law_name||'',law_type:m.law_type_code||'',ministry:m.ministry_name||'',
        rev:v.revision_type_code||'',ann:v.announcement_date,enf:v.enforcement_date,
        src:v.source_url||m.source_url||null,
        status:v.enforcement_date>new Date().toISOString().slice(0,10)?'시행예정':'시행중',
        sectors:[...a.s].join(','),obtypes:[...a.t].join(','),rules:a.c,
        year:(v.enforcement_date||'').slice(0,4),month:(v.enforcement_date||'').slice(5,7)};
    });
  }catch(e){console.error(e);}
  updateStats(); render();
}

function updateStats(){
  const d=allData;
  document.getElementById('s-total').textContent=d.length;
  document.getElementById('s-active').textContent=d.filter(x=>x.status==='시행중').length;
  document.getElementById('s-pending').textContent=d.filter(x=>x.status==='시행예정').length;
  document.getElementById('s-ilbu').textContent=d.filter(x=>x.rev==='일부개정').length;
  const sc={ALL:0,BUILDING:0,MANUFACTURING:0,CONSTRUCTION:0,COMMON:0};
  d.forEach(x=>{sc.ALL++;(x.sectors||'').split(',').forEach(s=>{if(sc[s]!==undefined)sc[s]++;});});
  document.getElementById('c-all').textContent=sc.ALL;
  document.getElementById('c-bld').textContent=sc.BUILDING;
  document.getElementById('c-mfg').textContent=sc.MANUFACTURING;
  document.getElementById('c-con').textContent=sc.CONSTRUCTION;
  document.getElementById('c-cmn').textContent=sc.COMMON;
}

function getFiltered(){
  return allData.filter(d=>{
    if(filters.year!=='ALL'&&d.year!==filters.year)return false;
    if(filters.sector!=='ALL'&&!(d.sectors||'').includes(filters.sector))return false;
    if(filters.type!=='ALL'&&d.rev!==filters.type)return false;
    if(filters.status!=='ALL'&&d.status!==filters.status)return false;
    if(filters.search&&!d.law_name.includes(filters.search))return false;
    return true;
  });
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(){
  const list=getFiltered(), el=document.getElementById('mainList');
  document.getElementById('resultCount').textContent=list.length+'건';
  if(!list.length){el.innerHTML='<div class="lu-empty"><div class="icon">📭</div><div class="msg">조건에 맞는 개정 법령이 없습니다</div></div>';return;}
  const groups={};
  list.forEach(d=>{const k=d.year+'-'+d.month;if(!groups[k])groups[k]=[];groups[k].push(d);});
  let html='';
  Object.keys(groups).sort().reverse().forEach(k=>{
    const[y,m]=k.split('-');const items=groups[k];
    html+='<div class="lu-month-group"><div class="lu-month-label">'+y+'년 '+parseInt(m)+'월<span class="bar"></span><span class="cnt">'+items.length+'건</span></div>';
    items.sort((a,b)=>(b.enf||'').localeCompare(a.enf||'')).forEach(d=>{
      const rb=d.rev==='일부개정'?'<span class="lu-badge badge-ilbu">일부개정</span>':d.rev==='타법개정'?'<span class="lu-badge badge-ta">타법개정</span>':'<span class="lu-badge badge-ta">-</span>';
      const sb=d.status==='시행중'?'<span class="lu-badge badge-ok">시행중</span>':'<span class="lu-badge badge-wait">시행예정</span>';
      const rp=d.rules>0?'<span class="lu-rules-pill has">'+d.rules+'</span>':'<span class="lu-rules-pill zero">0</span>';
      const ob=(d.obtypes||'').split(',').filter(Boolean).map(t=>'<span class="lu-ob-tag">'+(OL[t]||t)+'</span>').join('');
      const st=(d.sectors||'').split(',').filter(Boolean).map(s=>SL[s]||s).join(' · ');
      const lt=d.law_type==='LAW'?'법률':d.law_type==='ENFORCEMENT_DECREE'?'시행령':d.law_type==='ENFORCEMENT_RULE'?'시행규칙':d.law_type||'-';
      const su=d.src||'https://www.law.go.kr/법령/'+encodeURIComponent(d.law_name);
      html+='<div class="lu-row"><div class="lu-row-head" onclick="this.parentElement.classList.toggle(\'open\')"><div class="lu-name-cell">'+rb+'<span class="name" title="'+esc(d.law_name)+'">'+esc(d.law_name)+'</span><span class="ministry">'+esc(d.ministry)+'</span></div><div class="lu-date">'+(d.enf||'').slice(5).replace('-','.')+'</div>'+sb+'<div class="lu-rules">'+rp+'</div><div class="lu-expand">▾</div></div>';
      html+='<div class="lu-detail"><div class="lu-detail-grid"><div class="lu-detail-item"><div class="k">공포일</div><div class="v">'+(d.ann||'-')+'</div></div><div class="lu-detail-item"><div class="k">시행일</div><div class="v">'+(d.enf||'-')+'</div></div><div class="lu-detail-item"><div class="k">법령 유형</div><div class="v">'+lt+'</div></div><div class="lu-detail-item"><div class="k">소관부처</div><div class="v">'+(d.ministry||'-')+'</div></div><div class="lu-detail-item"><div class="k">적용 섹터</div><div class="v">'+(st||'미분류')+'</div></div><div class="lu-detail-item"><div class="k">관련 의무</div><div class="v">'+d.rules+'건</div></div></div>'+(ob?'<div style="margin-bottom:12px"><div style="font-size:.68rem;font-weight:700;color:#94a3b8;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px">의무 유형</div><div class="lu-ob-tags">'+ob+'</div></div>':'')+'<a href="'+esc(su)+'" target="_blank" rel="noopener" class="lu-btn-source"><i class="fas fa-external-link-alt"></i> 국가법령정보센터에서 원문 보기</a></div></div>';
    });
    html+='</div>';
  });
  el.innerHTML=html;
}

document.getElementById('catGrid').addEventListener('click',function(e){
  const c=e.target.closest('.lu-cat-card');if(!c)return;
  this.querySelectorAll('.lu-cat-card').forEach(x=>x.classList.remove('active'));
  c.classList.add('active'); filters.sector=c.dataset.sector; render();
});
document.getElementById('yearSelect').addEventListener('change',function(){filters.year=this.value;render();});
document.getElementById('typeChips').addEventListener('click',function(e){
  const c=e.target.closest('.lu-chip');if(!c)return;
  this.querySelectorAll('.lu-chip').forEach(x=>x.classList.remove('active'));
  c.classList.add('active'); filters.type=c.dataset.type; render();
});
document.getElementById('statusChips').addEventListener('click',function(e){
  const c=e.target.closest('.lu-chip');if(!c)return;
  this.querySelectorAll('.lu-chip').forEach(x=>x.classList.remove('active'));
  c.classList.add('active'); filters.status=c.dataset.status; render();
});
document.getElementById('searchInput').addEventListener('input',function(){filters.search=this.value.trim();render();});
document.addEventListener('DOMContentLoaded',loadData);
</script>
</body>
