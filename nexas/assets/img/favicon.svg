<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>TAI Engineering</title>
  <!-- 배경: 다크 네이비 라운드 사각형 -->
  <rect width="64" height="64" rx="10" fill="#0f172a"/>
  <!-- 지붕 왼쪽 대각선 (파란색 — T 획 + 건물 좌측) -->
  <line x1="32" y1="8" x2="6" y2="30" stroke="#1A5FD4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 지붕 오른쪽 대각선 (흰색) -->
  <line x1="32" y1="8" x2="58" y2="30" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 처마선 가로 (A의 크로스바 + T의 수평선) -->
  <line x1="6" y1="30" x2="58" y2="30" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
  <!-- 세로 기둥 좌1 -->
  <line x1="14" y1="30" x2="14" y2="54" stroke="#e2e8f0" stroke-width="1.8"/>
  <!-- 세로 기둥 좌2 -->
  <line x1="22" y1="22" x2="22" y2="54" stroke="#e2e8f0" stroke-width="1.8"/>
  <!-- 중앙 세로선 (I — 파란색 강조) -->
  <line x1="32" y1="8" x2="32" y2="54" stroke="#1A5FD4" stroke-width="2.2"/>
  <!-- 세로 기둥 우2 -->
  <line x1="42" y1="22" x2="42" y2="54" stroke="#e2e8f0" stroke-width="1.8"/>
  <!-- 세로 기둥 우1 -->
  <line x1="50" y1="30" x2="50" y2="54" stroke="#e2e8f0" stroke-width="1.8"/>
  <!-- 층 가로선 1 -->
  <line x1="6" y1="38" x2="58" y2="38" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- 층 가로선 2 -->
  <line x1="6" y1="46" x2="58" y2="46" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- 기단선 -->
  <line x1="6" y1="54" x2="58" y2="54" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
</svg>
