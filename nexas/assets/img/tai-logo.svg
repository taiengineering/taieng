<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" fill="none" role="img" aria-label="TAI Engineering — Trusted AI for Industrial Safety">
  <g transform="translate(15, 12)">
    <!-- 배경 건축 격자 (스캐폴딩) -->
    <g stroke="#A3B5CC" stroke-width="1.4" opacity="0.5">
      <line x1="40" y1="5" x2="40" y2="285"/>
      <line x1="92" y1="5" x2="92" y2="285"/>
      <line x1="160" y1="5" x2="160" y2="285"/>
      <line x1="218" y1="5" x2="218" y2="285"/>
      <line x1="252" y1="5" x2="252" y2="285"/>
      <line x1="5" y1="90" x2="275" y2="90"/>
      <line x1="5" y1="160" x2="275" y2="160"/>
      <line x1="5" y1="225" x2="275" y2="225"/>
    </g>
    <!-- 지붕 왼쪽 (파랑) -->
    <polygon points="12,92 138,20 160,40 44,112" fill="#2274C6"/>
    <!-- 지붕 오른쪽 (회색) -->
    <polygon points="138,20 270,92 238,112 120,40" fill="#6C7280"/>
    <!-- T 수평 바 -->
    <rect x="28" y="90" width="100" height="26" fill="#2274C6"/>
    <!-- A 왼쪽 대각선 (파랑) -->
    <polygon points="85,122 62,282 88,282 110,122" fill="#2274C6"/>
    <!-- A 오른쪽 대각선 (회색) -->
    <polygon points="110,122 85,122 160,282 184,282" fill="#6C7280"/>
    <!-- I 수직 바 -->
    <rect x="198" y="90" width="32" height="192" fill="#6C7280"/>
  </g>
  <!-- 텍스트 -->
  <text x="325" y="143" font-family="'Noto Sans KR','Pretendard',-apple-system,'Segoe UI',sans-serif" font-weight="900" font-size="80" fill="#1E293B" letter-spacing="-1.5">TAI ENGINEERING</text>
  <text x="325" y="205" font-family="'Noto Sans KR','Pretendard',-apple-system,'Segoe UI',sans-serif" font-weight="400" font-size="42" fill="#475569">Trusted AI for Industrial Safety</text>
</svg>
