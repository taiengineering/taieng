  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
    .pr-hero {
      background: linear-gradient(160deg, #0f172a 0%, #312e81 100%);
      padding: calc(var(--tai-nav-h, 90px) + 40px) 0 48px;

    .pr-hero p { color: rgba(255, 255, 255, .55); font-size: .88rem; margin-bottom: 28px; }
    .pr-search-wrap { max-width: 640px; margin: 0 auto; position: relative; }

      width: 100%; padding: 16px 52px 16px 20px; border: 2px solid rgba(255, 255, 255, .2);

    .pr-filters { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; align-items: flex-start; }

    .pr-chip {

    .pr-result-count span { color: #4338ca; }
    .pr-card {
      background: #fff; border: 1.5px solid #e8eaed; border-radius: 14px; padding: 18px 20px; margin-bottom: 10px;
      transition: box-shadow .2s, border-color .2s;

    .pr-card:hover { box-shadow: 0 4px 16px rgba(0, 0, 0, .06); border-color: #cbd5e1; }
    .pr-court { font-size: .72rem; font-weight: 800; color: #6366f1; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
    .pr-title { font-size: .95rem; font-weight: 800; color: #0d1b2a; line-height: 1.4; margin-bottom: 8px; }
    .pr-meta { font-size: .74rem; color: #64748b; display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .pr-meta span { background: #f1f5f9; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
    .pr-summary { font-size: .84rem; color: #475569; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .pr-link {
      display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; font-size: .78rem; font-weight: 700;
      color: #0d1b2a; text-decoration: none; padding: 5px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; transition: all .12s;
    }
    .pr-link:hover { background: #0d1b2a; color: #fff; border-color: #0d1b2a; }
    .pr-empty { text-align: center; padding: 48px 20px; color: #94a3b8; }
    .pr-paging { display: flex; justify-content: center; gap: 4px; margin-top: 28px; flex-wrap: wrap; }
    .pr-pg {
      min-width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: .82rem; font-weight: 700; color: #475569;
      cursor: pointer; background: #fff; transition: all .12s; text-decoration: none; box-sizing: border-box;
    }
    a.pr-pg { color: #475569; }
    .pr-pg:hover { border-color: #0d1b2a; color: #0d1b2a; }
    .pr-pg.active { background: #0d1b2a; color: #fff; border-color: #0d1b2a; }
    .pr-pg.disabled { opacity: .4; cursor: default; pointer-events: none; }
    .pr-source { text-align: center; margin-top: 28px; font-size: .75rem; color: #94a3b8; line-height: 1.7; }
    .pr-back { text-align: center; margin-top: 16px; }
    .pr-back a { color: #4338ca; font-weight: 700; font-size: .88rem; text-decoration: none; }
    .pr-back a:hover { text-decoration: underline; }
    @media (max-width: 768px) { .pr-filters { flex-direction: column; } }
  </style>
</head>
<body class="sc5">
<div class="preloader" id="preloader"><div class="preloader-inner"><div class="spinner"><div class="dot1"></div><div class="dot2"></div></div></div></div>
<div class="body-overlay" id="body-overlay"></div>
<div id="tai-header"></div>

<div class="pr-hero">
  <h1><em>판례</em> 검색</h1>
  <p>산업안전·산업재해 관련 판례를 섹터·재해유형별로 찾아보세요.</p>
  <div class="pr-search-wrap">
    <input type="text" id="searchInput" placeholder="사건명·키워드 (예: 업무상과실, 추락, 중대재해)" autocomplete="off">
    <button type="button" class="pr-search-btn" onclick="doSearch()" aria-label="검색"><i class="fas fa-search"></i></button>
  </div>
  <div class="pr-stats">
    <div class="pr-stat"><div class="num" id="s-total">-</div><div class="label">등록 판례</div></div>

<div class="pr-body"><div class="sec-inner">
  <div class="pr-filters">
    <div class="pr-filter-group">
      <span class="pr-filter-label">섹터</span>
      <div class="pr-chip active" data-sec="ALL">전체</div>
      <div class="pr-chip" data-sec="CONSTRUCTION">건설</div>
      <div class="pr-chip" data-sec="MANUFACTURING">제조</div>

    </div>
    <div class="pr-filter-group">
      <span class="pr-filter-label">재해유형</span>
      <div class="pr-chip active" data-haz="ALL">전체</div>
      <div class="pr-chip" data-haz="추락">추락</div>
      <div class="pr-chip" data-haz="끼임">끼임</div>
      <div class="pr-chip" data-haz="충돌">충돌</div>
      <div class="pr-chip" data-haz="감전">감전</div>
      <div class="pr-chip" data-haz="질식">질식</div>
    </div>
  </div>

  <div class="pr-result-count" id="resultCount">최신 판례를 불러오는 중…</div>
  <h2 class="pr-latest-head" id="latestHeading"><em>최신</em> 판례</h2>

  <div id="resultList"></div>
  <div class="pr-paging" id="paging"></div>

  <div class="pr-source">
    판례 요약·메타데이터는 서비스 제공을 위해 가공·표시될 수 있습니다. 원문은 각 법원·공개 출처를 확인하세요.
  </div>
  <div class="pr-back"><a href="safety-news.html">← 안전보건자료로 이동</a></div>
</div></div>

<div id="tai-footer"></div>
<div class="back-to-top"><span class="back-top"><i class="fas fa-angle-double-up"></i></span></div>

<script src="assets/js/jquery.3.6.min.js"></script>
<script src="assets/js/bootstrap.min.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/header.js"></script>
<script src="assets/js/nav-auth.js"></script>
<script src="assets/js/footer.js"></script>
<script>
var SB = 'https://vwlahtguyggrhvslabax.supabase.co/rest/v1';
var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3bGFodGd1eWdncmh2c2xhYmF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyOTE1OTYsImV4cCI6MjA5Mjg2NzU5Nn0.Yp6P7ahaCuna_gwYC8_S2KD081Ov9Fs65e9o_AenP48';
var H = { apikey: KEY, Authorization: 'Bearer ' + KEY, Prefer: 'count=exact' };
var PG = 20;
var SEC_LABEL = { CONSTRUCTION: '건설', MANUFACTURING: '제조', SERVICE: '서비스', COMMON: '공통' };

var filters = { sec: 'ALL', haz: 'ALL', q: '', page: 1 };

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function parseContentTotal(r) {
  var h = r.headers.get('content-range') || r.headers.get('Content-Range') || '';
  var parts = h.split('/');
  var last = parts.length > 1 ? parts[parts.length - 1] : '0';
  var n = parseInt(String(last).replace(/\*/g, '').trim(), 10);
  return isNaN(n) ? 0 : n;
}

function initFromURL() {
  var p = new URLSearchParams(location.search);
  if (p.get('q')) filters.q = p.get('q');
  if (p.get('sec')) filters.sec = p.get('sec');
  if (p.get('hazard')) filters.haz = p.get('hazard');
  if (p.get('page')) filters.page = parseInt(p.get('page'), 10) || 1;
  document.getElementById('searchInput').value = filters.q;
  document.querySelectorAll('[data-sec]').forEach(function (c) {
    c.classList.toggle('active', c.dataset.sec === filters.sec);
  });
  document.querySelectorAll('[data-haz]').forEach(function (c) {
    c.classList.toggle('active', c.dataset.haz === filters.haz);
  });
}

function updateURL() {
  var p = new URLSearchParams();
  if (filters.q) p.set('q', filters.q);
  if (filters.sec !== 'ALL') p.set('sec', filters.sec);
  if (filters.haz !== 'ALL') p.set('hazard', filters.haz);
  if (filters.page > 1) p.set('page', String(filters.page));
  var qs = p.toString();
  history.replaceState(null, '', qs ? '?' + qs : location.pathname);
}

function buildListUrl(offset) {
  var sel = 'id,case_number,case_name,court_name,decision_date,sector,hazard_type,summary,death_count,injury_count,source_url';
  var url = SB + '/industrial_accident_precedents?select=' + sel + '&order=decision_date.desc&limit=' + PG + '&offset=' + offset;
  if (filters.sec !== 'ALL') url += '&sector=eq.' + encodeURIComponent(filters.sec);
  if (filters.haz !== 'ALL') {
    url += '&hazard_type=ilike.*' + encodeURIComponent(filters.haz) + '*';
  }
  if (filters.q) {
    url += '&case_name=ilike.*' + encodeURIComponent(filters.q) + '*';
  }
  return url;
}

function deathInjury(row) {
  var parts = [];
  if (row.death_count != null && row.death_count > 0) parts.push('사망 ' + row.death_count + '명');
  if (row.injury_count != null && row.injury_count > 0) parts.push('상해 ' + row.injury_count + '명');
  return parts.length ? parts.join(' · ') : '';
}

function doSearch() {
  filters.q = document.getElementById('searchInput').value.trim();
  filters.page = 1;
  fetchResults();
}

async function fetchResults() {
  updateURL();
  var el = document.getElementById('resultList');
  var latestEl = document.getElementById('latestHeading');
  var offset = (filters.page - 1) * PG;
  document.getElementById('resultCount').textContent = '불러오는 중…';
  if (latestEl) latestEl.style.display = filters.q ? 'none' : 'block';

  var url = buildListUrl(offset);
  try {
    var r = await fetch(url, { headers: H });
    if (!r.ok) {
      var tryUrl = url.replace('order=decision_date.desc', 'order=created_at.desc');
      r = await fetch(tryUrl, { headers: H });
      url = tryUrl;
    }
    var total = parseContentTotal(r);
    var items = await r.json();
    document.getElementById('resultCount').innerHTML = filters.q
      ? '"' + esc(filters.q) + '" · 검색 결과 <span>' + total.toLocaleString() + '</span>건'
      : '최신 판례 · 전체 <span>' + total.toLocaleString() + '</span>건 (페이지당 ' + PG + '건)';
    if (!items.length) {
      el.innerHTML = '<div class="pr-empty"><i class="fas fa-inbox"></i><br>' + (filters.q ? '검색 결과가 없습니다.' : '표시할 판례가 없습니다.') + '</div>';
      document.getElementById('paging').innerHTML = '';
      return;
    }
    el.innerHTML = items.map(function (it) {
      var court = esc(it.court_name || '');
      var title = esc(it.case_name || '');
      var di = deathInjury(it);
      var hz = esc(it.hazard_type || '');
      var dt = esc(it.decision_date || '');
      var sec = it.sector || '';
      var sum = esc((it.summary || '').slice(0, 280));
      if ((it.summary || '').length > 280) sum += '…';
      var meta = '';
      if (di) meta += '<span>' + esc(di) + '</span>';
      if (hz) meta += '<span>' + hz + '</span>';
      if (dt) meta += '<span>' + dt + '</span>';
      if (sec && SEC_LABEL[sec]) meta += '<span>' + esc(SEC_LABEL[sec]) + '</span>';
      var detailHref = 'precedent-detail.html?id=' + encodeURIComponent(it.id);
      var link =
        '<a class="pr-link" href="' + detailHref + '"><i class="fas fa-file-alt"></i> 상세 페이지</a>' +
        (it.source_url
          ? ' <a class="pr-link" href="' + esc(it.source_url) + '" target="_blank" rel="noopener"><i class="fas fa-external-link-alt"></i> 원문·출처</a>'
          : '');
      return (
        '<div class="pr-card">' +
        (court ? '<div class="pr-court">' + court + '</div>' : '') +
        '<div class="pr-title"><a href="' + detailHref + '" style="color:inherit;text-decoration:none;">' + title + '</a></div>' +
        (meta ? '<div class="pr-meta">' + meta + '</div>' : '') +
        (sum ? '<div class="pr-summary">' + sum + '</div>' : '') +
        link +
        '</div>'
      );
    }).join('');
    renderPaging(total);
  } catch (e) {
    el.innerHTML = '<div class="pr-empty">데이터를 불러올 수 없습니다.</div>';
    document.getElementById('paging').innerHTML = '';
  }
}

function listQueryForPage(pageNum) {
  var p = new URLSearchParams();
  if (filters.q) p.set('q', filters.q);
  if (filters.sec !== 'ALL') p.set('sec', filters.sec);
  if (filters.haz !== 'ALL') p.set('hazard', filters.haz);
  if (pageNum > 1) p.set('page', String(pageNum));
  var qs = p.toString();
  return qs ? '?' + qs : '';
}

function renderPaging(total) {
  var pages = Math.ceil(total / PG);
  if (pages <= 1) {
    document.getElementById('paging').innerHTML = '';
    return;
  }
  var cur = filters.page;
  var h = '';
  if (cur > 1) {
    h +=
      '<a class="pr-pg" href="' +
      listQueryForPage(cur - 1) +
      '" rel="prev" aria-label="이전 페이지"><i class="fas fa-chevron-left"></i></a>';
  } else {
    h += '<span class="pr-pg disabled" aria-hidden="true"><i class="fas fa-chevron-left"></i></span>';
  }
  var start = Math.max(1, cur - 3);
  var end = Math.min(pages, cur + 3);
  if (start > 1) {
    h += '<a class="pr-pg" href="' + listQueryForPage(1) + '">1</a>';
    if (start > 2) h += '<span class="pr-pg disabled">…</span>';
  }
  for (var i = start; i <= end; i++) {
    h +=
      '<a class="pr-pg ' +
      (i === cur ? 'active' : '') +
      '" href="' +
      listQueryForPage(i) +
      '">' +
      i +
      '</a>';
  }
  if (end < pages) {
    if (end < pages - 1) h += '<span class="pr-pg disabled">…</span>';
    h += '<a class="pr-pg" href="' + listQueryForPage(pages) + '">' + pages + '</a>';
  }
  if (cur < pages) {
    h +=
      '<a class="pr-pg" href="' +
      listQueryForPage(cur + 1) +
      '" rel="next" aria-label="다음 페이지"><i class="fas fa-chevron-right"></i></a>';
  } else {
    h += '<span class="pr-pg disabled" aria-hidden="true"><i class="fas fa-chevron-right"></i></span>';
  }
  document.getElementById('paging').innerHTML = h;
}

async function loadStats() {
  try {
    var r = await fetch(SB + '/industrial_accident_precedents?select=id&limit=1', { headers: Object.assign({}, H, { Prefer: 'count=exact' }) });
    document.getElementById('s-total').textContent = parseContentTotal(r).toLocaleString();
  } catch (e) {
    document.getElementById('s-total').textContent = '849';
  }
}

document.querySelectorAll('[data-sec]').forEach(function (c) {
  c.addEventListener('click', function () {
    document.querySelectorAll('[data-sec]').forEach(function (x) { x.classList.remove('active'); });
    c.classList.add('active');
    filters.sec = c.dataset.sec;
    filters.page = 1;
    fetchResults();
  });
});
document.querySelectorAll('[data-haz]').forEach(function (c) {
  c.addEventListener('click', function () {
    document.querySelectorAll('[data-haz]').forEach(function (x) { x.classList.remove('active'); });
    c.classList.add('active');
    filters.haz = c.dataset.haz;
    filters.page = 1;
    fetchResults();
  });
});
document.getElementById('searchInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') doSearch();
});

document.addEventListener('DOMContentLoaded', function () {
  initFromURL();
  fetchResults();
  loadStats();
});
</script>
</body>
</html>
