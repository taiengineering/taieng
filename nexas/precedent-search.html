<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판례 검색 | TAI 엔지니어링</title>
  <meta name="description" content="산업안전·산재 관련 판례를 검색합니다.">
  <link rel="icon" href="assets/img/fevicon.png">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/fontawesome.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/tai-brand.css">
  <link rel="stylesheet" href="assets/css/tai-main.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; background: #f8fafc; }
    .prec-hero { background: linear-gradient(135deg, #0d1b2a 0%, #1e3a5f 100%); padding: 88px 0 48px; color: #fff; }
    .prec-hero h1 { font-size: clamp(1.5rem, 3vw, 2.1rem); font-weight: 900; margin-bottom: 8px; }
    .prec-hero p { color: rgba(255,255,255,.65); font-size: .92rem; margin: 0; }
    .prec-wrap { max-width: 920px; margin: -28px auto 0; padding: 0 20px 64px; position: relative; z-index: 2; }
    .prec-card { background: #fff; border-radius: 14px; box-shadow: 0 8px 32px rgba(15,23,42,.08); padding: 24px 22px 20px; border: 1px solid #e2e8f0; }
    .prec-card label { font-size: .78rem; font-weight: 700; color: #64748b; display: block; margin-bottom: 8px; }
    .prec-search-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .prec-search-row input { flex: 1; min-width: 200px; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; font-size: .95rem; }
    .prec-search-row button { border: none; border-radius: 10px; padding: 12px 22px; font-weight: 800; background: #1a5fd4; color: #fff; cursor: pointer; }
    .prec-search-row button:hover { background: #154a9e; }
    .prec-hint { font-size: .8rem; color: #94a3b8; margin-top: 12px; line-height: 1.5; }
    .prec-results { margin-top: 28px; }
    .prec-results h2 { font-size: 1rem; font-weight: 800; color: #0f172a; margin-bottom: 14px; }
    .prec-item { border: 1px solid #e8ecf4; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; background: #fafbfe; }
    .prec-item h3 { font-size: .9rem; font-weight: 800; color: #0f172a; margin: 0 0 6px; line-height: 1.4; }
    .prec-item p { font-size: .82rem; color: #475569; margin: 0; line-height: 1.5; }
    .prec-meta { font-size: .74rem; color: #64748b; margin-top: 8px; }
    .prec-empty { text-align: center; padding: 36px 16px; color: #94a3b8; font-size: .9rem; }
    .prec-back { margin-top: 20px; text-align: center; }
    .prec-back a { color: #1a5fd4; font-weight: 700; font-size: .88rem; text-decoration: none; }
    .prec-back a:hover { text-decoration: underline; }
  </style>
</head>
<body class="sc5">
<div class="preloader" id="preloader"><div class="preloader-inner"><div class="spinner"><div class="dot1"></div><div class="dot2"></div></div></div></div>
<div class="body-overlay" id="body-overlay"></div>

<div id="tai-header"></div>

<section class="prec-hero">
  <div class="container">
    <h1>판례 검색</h1>
    <p>산업안전·산재 관련 키워드로 판례를 찾아보세요.</p>
  </div>
</section>

<div class="prec-wrap">
  <div class="prec-card">
    <label for="precQ">검색어</label>
    <div class="prec-search-row">
      <input type="search" id="precQ" placeholder="예: 산업안전보건, 중대재해, 산재 인정" autocomplete="off">
      <button type="button" id="precBtn">검색</button>
    </div>
    <p class="prec-hint">검색 결과는 국가법령정보 API 연동 데이터가 있으면 표시하고, 없을 때는 안내 메시지가 나옵니다. <a href="safety-news.html" style="color:#1a5fd4;font-weight:700;">안전정보</a>에서 주요 판례 요약도 확인할 수 있습니다.</p>
  </div>

  <div class="prec-results" id="precResults" style="display:none;">
    <h2>검색 결과</h2>
    <div id="precList"></div>
  </div>
  <div id="precIdle" class="prec-empty" style="margin-top:24px;">검색어를 입력한 뒤 검색을 눌러주세요.</div>

  <div class="prec-back">
    <a href="safety-news.html">← 안전정보(뉴스·판례 하이라이트)로 이동</a>
  </div>
</div>

<div id="tai-footer"></div>
<div class="back-to-top"><span class="back-top"><i class="fas fa-angle-double-up"></i></span></div>

<script src="assets/js/jquery.3.6.min.js"></script>
<script src="assets/js/bootstrap.min.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/header.js"></script>
<script src="assets/js/nav-auth.js"></script>
<script src="assets/js/footer.js"></script>
<script>
(function () {
  'use strict';
  var API = 'https://api.taieng.co.kr';

  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderItems(items) {
    var list = document.getElementById('precList');
    if (!items || !items.length) {
      list.innerHTML = '<div class="prec-empty">일치하는 판례가 없거나, 서버에서 결과를 가져오지 못했습니다.</div>';
      return;
    }
    list.innerHTML = items.map(function (p) {
      var title = esc(p.사건명 || p.title || '');
      var body = esc((p.판시사항 || p.판결요지 || '').slice(0, 160));
      if ((p.판시사항 || '').length > 160) body += '…';
      var meta = [p.법원명, p.선고일자].filter(Boolean).map(esc).join(' · ');
      var link = p.판례상세링크 || '';
      var inner = '<div class="prec-item"><h3>' + title + '</h3><p>' + body + '</p>' +
        (meta ? '<div class="prec-meta">' + meta + '</div>' : '') + '</div>';
      return link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;display:block;">' + inner + '</a>' : inner;
    }).join('');
  }

  async function runSearch() {
    var q = (document.getElementById('precQ').value || '').trim();
    var idle = document.getElementById('precIdle');
    var box = document.getElementById('precResults');
    var list = document.getElementById('precList');
    if (!q) {
      idle.style.display = 'block';
      box.style.display = 'none';
      idle.textContent = '검색어를 입력해 주세요.';
      return;
    }
    idle.style.display = 'none';
    box.style.display = 'block';
    list.innerHTML = '<div class="prec-empty"><i class="fas fa-spinner fa-spin"></i> 검색 중…</div>';
    try {
      var res = await fetch(API + '/precedents/search?query=' + encodeURIComponent(q) + '&size=20');
      var data = await res.json();
      var items = (data.data && data.data.prec) || data.data || data.items || [];
      renderItems(items);
    } catch (e) {
      list.innerHTML = '<div class="prec-empty">검색 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.</div>';
    }
  }

  document.getElementById('precBtn').addEventListener('click', runSearch);
  document.getElementById('precQ').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); runSearch(); }
  });
})();
</script>
</body>
</html>
