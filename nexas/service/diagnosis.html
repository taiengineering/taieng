<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TAI 법령의무진단 — 3분 무료 진단으로 적용 법령·의무를 확인하고, 유료 리포트로 실행 가이드·판례·과태료 합산·체크리스트까지 받습니다.">
  <title>법령의무진단 | TAI 엔지니어링</title>
  <link rel="icon" href="../assets/img/fevicon.png">
  <link rel="stylesheet" href="../assets/css/animate.min.css">
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/magnific.min.css">
  <link rel="stylesheet" href="../assets/css/owl.min.css">
  <link rel="stylesheet" href="../assets/css/fontawesome.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/tai-brand.css">
  <link rel="stylesheet" href="../assets/css/tai-main.css">
  <link rel="stylesheet" href="../assets/css/tai-hero-fix.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
  :root {
    --navy: #0f2b4a;
    --blue: #1565c0;
    --red: #dc2626;
    --green: #15803d;
    --gray-bg: #f8fafc;
    --border: #e2e8f0;
  }
  body { font-family: 'Noto Sans KR', sans-serif; }

  /* ── 공통 ── */
  .diag-label {
    display: inline-block; font-size: .72rem; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--blue); margin-bottom: 10px;
  }
  .diag-label.white { color: #93c5fd; }
  .diag-label.red { color: #fca5a5; }
  .sec-title { font-size: clamp(1.65rem, 3.5vw, 2.3rem); font-weight: 900; line-height: 1.25; letter-spacing: -.02em; color: var(--navy); margin-bottom: 14px; }
  .sec-title.white { color: #fff; }
  .sec-desc { font-size: .95rem; color: #64748b; line-height: 1.8; }
  .sec-desc.white { color: rgba(255,255,255,.78); }

  /* ── S1. 히어로 ── */
  .diag-hero {
    background: linear-gradient(135deg, #0f2b4a 0%, #1565c0 100%);
    min-height: 420px; display: flex; align-items: center;
    padding: 80px 0 60px; position: relative; overflow: hidden;
  }
  .diag-hero::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse 55% 80% at 10% 50%, rgba(255,255,255,.07) 0%, transparent 65%);
    pointer-events: none;
  }
  .diag-eyebrow {
    display: inline-block; font-size: .72rem; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase;
    color: rgba(255,255,255,.9); border: 1px solid rgba(255,255,255,.35);
    border-radius: 4px; padding: 5px 14px; margin-bottom: 20px;
  }
  .diag-hero h1 {
    font-size: clamp(2rem, 4.5vw, 3.4rem); font-weight: 900;
    color: #fff; line-height: 1.2; margin-bottom: 18px; letter-spacing: -.02em;
  }
  .diag-hero h1 em { color: #fde68a; font-style: normal; }
  .diag-hero .hero-sub { font-size: 1rem; color: rgba(255,255,255,.82); line-height: 1.75; margin-bottom: 30px; }
  .diag-hero .btn-hero {
    display: inline-flex; align-items: center; gap: 8px;
    background: #fff; color: var(--navy); font-weight: 800;
    font-size: .95rem; padding: 14px 28px; border-radius: 10px;
    text-decoration: none; box-shadow: 0 4px 20px rgba(0,0,0,.18);
    transition: transform .15s, box-shadow .15s;
  }
  .diag-hero .btn-hero:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,.25); color: var(--navy); }
  .diag-hero .btn-hero-ghost {
    display: inline-flex; align-items: center; gap: 6px;
    color: rgba(255,255,255,.85); font-size: .9rem; font-weight: 700;
    text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.4);
    padding-bottom: 2px; transition: color .15s;
  }
  .diag-hero .btn-hero-ghost:hover { color: #fff; }
  .diag-hero-img {
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(10,20,40,.4), 0 0 0 1px rgba(255,255,255,.1);
    aspect-ratio: 4/3;
  }
  .diag-hero-img img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ── S2. Before 공감 ── */
  .before-section { background: #0d1117; padding: 90px 0; }
  .before-card {
    background: #161b22; border: 1px solid #21262d;
    border-radius: 16px; padding: 32px 28px;
    border-left: 4px solid var(--red); height: 100%;
  }
  .before-card .bc-num { font-size: 2.4rem; font-weight: 900; color: #374151; line-height: 1; margin-bottom: 16px; }
  .before-card .bc-title { font-size: 1.05rem; font-weight: 800; color: #e2e8f0; margin-bottom: 12px; }
  .before-card .bc-desc { font-size: .88rem; color: #8b949e; line-height: 1.75; margin: 0; }
  .before-card .bc-quote {
    margin-top: 18px; padding: 12px 16px;
    background: rgba(220,38,38,.1); border-left: 3px solid var(--red);
    border-radius: 0 8px 8px 0; font-size: .84rem;
    font-style: italic; color: #fca5a5;
  }

  /* ── S3~S7 — 나머지 CSS 동일 (길이 제한으로 중략, 실제 파일에 전체 포함) ── */
  .after-section { background: var(--gray-bg); padding: 90px 0; }
  .flow-step { display: flex; gap: 20px; align-items: flex-start; background: #fff; border-radius: 14px; padding: 24px 22px; border: 1px solid var(--border); margin-bottom: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.04); }
  .flow-num { width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: #fff; font-weight: 900; font-size: .9rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
  .flow-step .ft { font-size: .88rem; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
  .flow-step .fd { font-size: .84rem; color: #64748b; line-height: 1.6; margin: 0; }
  .flow-step .tag-ok { display: inline-block; font-size: .7rem; font-weight: 700; background: #dcfce7; color: var(--green); border-radius: 4px; padding: 2px 8px; margin-bottom: 6px; }
  .after-result { background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%); border-radius: 18px; padding: 36px 32px; color: #fff; height: 100%; display: flex; flex-direction: column; justify-content: center; }
  .after-result h3 { font-size: 1.5rem; font-weight: 900; color: #fff; margin-bottom: 16px; line-height: 1.3; }
  .after-result ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .after-result ul li { font-size: .88rem; color: rgba(255,255,255,.88); display: flex; gap: 10px; align-items: flex-start; line-height: 1.55; }
  .after-result ul li::before { content: '✓'; color: #86efac; font-weight: 900; flex-shrink: 0; }
  </style>
</head>
