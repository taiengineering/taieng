<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무료 법령진단 | TAI Safe</title>
<style>
  :root{--p:#2c5fff;--ink:#1a2233;--mut:#6b7585;--line:#e4e8f0;--bg:#f5f7fb;--ok:#16a34a;--warn:#dc2626}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:680px;margin:0 auto;padding:24px 16px 80px}
  .head{text-align:center;padding:24px 0 12px}
  .head h1{font-size:24px;font-weight:800}
  .head p{color:var(--mut);font-size:14px;margin-top:6px}
  .steps{display:flex;gap:6px;justify-content:center;margin:18px 0}
  .steps i{width:30px;height:4px;border-radius:2px;background:var(--line)}
  .steps i.on{background:var(--p)}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
  .card h2{font-size:17px;font-weight:700;margin-bottom:4px}
  .card .sub{color:var(--mut);font-size:13px;margin-bottom:16px}
  .sector-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .sector-btn{border:2px solid var(--line);border-radius:14px;padding:18px 10px;text-align:center;cursor:pointer;background:#fff;transition:.15s}
  .sector-btn:hover{border-color:var(--p)}
  .sector-btn.on{border-color:var(--p);background:#f0f5ff}
  .sector-btn .ic{font-size:26px}
  .sector-btn .nm{font-weight:700;margin-top:6px;font-size:14px}
  .grp{margin-bottom:20px}
  .grp-t{font-size:13px;font-weight:700;color:var(--p);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .fld label .req{color:var(--warn)}
  .fld .help{font-size:12px;color:var(--mut);margin-top:4px}
  .ipt,.sel{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit}
  .ipt:focus,.sel:focus{outline:none;border-color:var(--p)}
  .unit-row{display:flex;align-items:center;gap:8px}
  .unit-row .ipt{flex:1}
  .unit-row .u{font-size:13px;color:var(--mut);white-space:nowrap}
  .bool-row{display:flex;gap:8px}
  .bool-btn{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px;text-align:center;cursor:pointer;background:#fff;font-size:14px;font-weight:600}
  .bool-btn.on{border-color:var(--p);background:#f0f5ff;color:var(--p)}
  .btn{width:100%;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;background:var(--p);color:#fff}
  .btn:disabled{background:#b8c4dd;cursor:not-allowed}
  .btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .auth-box{text-align:center;padding:10px 0}
  .auth-box .ic{font-size:40px}
  .auth-box p{color:var(--mut);font-size:14px;margin:10px 0 18px}
  .dev-skip{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
  .dev-skip .btn-ghost{font-size:13px;padding:11px}
  .dev-note{font-size:11px;color:var(--mut);margin-top:6px}
  .hide{display:none}
  .res-hero{text-align:center;padding:12px 0 20px}
  .res-hero .grade{display:inline-block;font-size:30px;font-weight:800;padding:8px 26px;border-radius:50px;color:#fff;background:var(--warn)}
  .res-stat{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
  .res-stat .b{background:var(--bg);border-radius:12px;padding:16px;text-align:center}
  .res-stat .b .n{font-size:26px;font-weight:800;color:var(--p)}
  .res-stat .b .l{font-size:12px;color:var(--mut);margin-top:2px}
  .cta{background:linear-gradient(135deg,#2c5fff,#1746d4);color:#fff;border-radius:16px;padding:24px;text-align:center;margin-top:20px}
  .cta h3{font-size:19px;font-weight:800}
  .cta p{font-size:14px;opacity:.92;margin:8px 0 16px}
  .cta .btn{background:#fff;color:var(--p)}
  .loading{text-align:center;padding:50px 0;color:var(--mut)}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{background:#fef2f2;border:1px solid #fecaca;color:var(--warn);border-radius:10px;padding:12px;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>무료 법령진단</h1>
    <p>우리 사업장에 적용되는 안전보건 법령을 1분 만에 확인하세요</p>
  </div>
  <div class="steps">
    <i id="s1" class="on"></i><i id="s2"></i><i id="s3"></i><i id="s4"></i>
  </div>

  <!-- STEP 1: 섹터 선택 -->
  <div id="step1" class="card">
    <h2>어떤 사업장인가요?</h2>
    <div class="sub">진단할 사업장 유형을 선택하세요</div>
    <div class="sector-grid">
      <div class="sector-btn" data-sector="BUILDING"><div class="ic">🏢</div><div class="nm">건축물</div></div>
      <div class="sector-btn" data-sector="INDUSTRIAL"><div class="ic">🏭</div><div class="nm">제조업</div></div>
      <div class="sector-btn" data-sector="CONSTRUCTION"><div class="ic">🏗️</div><div class="nm">건설현장</div></div>
    </div>
    <button id="toAuth" class="btn" style="margin-top:18px" disabled>다음</button>
  </div>

  <!-- STEP 2: 본인인증 (정책: 무료=비회원OK+본인인증 필수) -->
  <div id="step2" class="card hide">
    <h2>본인인증</h2>
    <div class="sub">안전한 진단 결과 제공을 위해 본인인증이 필요합니다 (회원가입 불필요)</div>
    <div class="auth-box">
      <div class="ic">🔐</div>
      <p>휴대폰 본인인증으로 간편하게 확인합니다</p>
      <button id="doAuth" class="btn">본인인증 하기</button>
    </div>
    <!-- 개발/테스트 우회: ?dev=1 일 때만 노출. 인증 키 설정 전 흐름 점검용. 정책상 운영 기본값은 인증 필수. -->
    <div id="devSkip" class="dev-skip hide">
      <button id="skipAuth" class="btn btn-ghost">[개발용] 본인인증 건너뛰고 진행</button>
      <div class="dev-note">테스트 모드입니다. 실제 배포에서는 본인인증이 필수입니다.</div>
    </div>
    <div id="authErr" class="err hide"></div>
  </div>

  <!-- STEP 3: 기본 입력 (동적 렌더) -->
  <div id="step3" class="card hide">
    <h2>사업장 정보 입력</h2>
    <div class="sub">무료 진단은 기본 정보만으로 진행됩니다</div>
    <div id="dynForm"><div class="loading"><div class="spin"></div>입력항목을 불러오는 중...</div></div>
    <button id="doDiag" class="btn" style="margin-top:6px">진단 시작</button>
    <div id="diagErr" class="err hide"></div>
  </div>

  <!-- STEP 4: 결과 + 유료 CTA (정책: 무료는 여기서 마무리, 자동 유료 연결 없음) -->
  <div id="step4" class="card hide">
    <div id="resBody"><div class="loading"><div class="spin"></div>진단 중...</div></div>
  </div>
</div>

<script>
const API = window.TAI_API_BASE || 'https://api.taieng.co.kr';
const DEV = new URLSearchParams(location.search).get('dev')==='1';
const st = { sector:null, tier:'FREE', fields:[], values:{}, authed:false, ci:null };

function goStep(n){
  for(let i=1;i<=4;i++){
    document.getElementById('step'+i).classList.toggle('hide', i!==n);
    document.getElementById('s'+i).classList.toggle('on', i<=n);
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

// STEP1: 섹터 선택
document.querySelectorAll('.sector-btn').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.sector-btn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    st.sector=b.dataset.sector;
    document.getElementById('toAuth').disabled=false;
  };
});
document.getElementById('toAuth').onclick=()=>{
  if(!st.sector) return;
  if(st.authed){ loadFields(); goStep(3); } else { goStep(2); }
};

// STEP2: 본인인증 (정책 필수). 이니시스 통합인증 연결점.
// 인증 키 미설정 동안 흐름이 막히지 않도록, ?dev=1 이면 우회 버튼 노출.
document.getElementById('doAuth').onclick=async()=>{
  const err=document.getElementById('authErr');
  err.classList.add('hide');
  try{
    // 이니시스 통합인증 준비 확인 (환경변수/키 설정 후 ready:true). 미설정시 안내.
    const r=await fetch(API+'/auth/identity/ready');
    if(!r.ok) throw 0;
    const j=await r.json();
    if(j && j.ready && j.auth_url){ window.location.href=j.auth_url; return; }
    throw 0;
  }catch(e){
    if(DEV){
      err.textContent='본인인증이 아직 설정되지 않았습니다. 아래 [개발용] 버튼으로 진행할 수 있습니다.';
    }else{
      err.textContent='본인인증 준비 중입니다. 잠시 후 다시 시도해주세요.';
    }
    err.classList.remove('hide');
  }
};
// 개발 우회 버튼: ?dev=1 일 때만
(function setupDevSkip(){
  if(!DEV) return;
  document.getElementById('devSkip').classList.remove('hide');
  document.getElementById('skipAuth').onclick=()=>{
    st.authed=true; st.ci=null;        // 인증 없이 진행 (테스트)
    loadFields(); goStep(3);
  };
})();
// 인증 콜백 처리 (?auth=ok&ci=...)
(function handleAuthReturn(){
  const q=new URLSearchParams(location.search);
  if(q.get('auth')==='ok'){ st.authed=true; st.ci=q.get('ci')||null;
    const sv=sessionStorage.getItem('tai_free_sector'); if(sv) st.sector=sv;
    if(st.sector){ loadFields(); goStep(3);} }
})();

// STEP3: 동적 필드 렌더 (/diagnosis/fields)
async function loadFields(){
  sessionStorage.setItem('tai_free_sector', st.sector);
  const box=document.getElementById('dynForm');
  box.innerHTML='<div class="loading"><div class="spin"></div>입력항목을 불러오는 중...</div>';
  try{
    const r=await fetch(`${API}/diagnosis/fields?sector=${st.sector}&tier=FREE`);
    const j=await r.json();
    st.fields=(j.data&&j.data.groups)||[];
    renderForm(box, st.fields);
  }catch(e){
    box.innerHTML='<div class="err">입력항목을 불러오지 못했습니다. 새로고침 해주세요.</div>';
  }
}

function renderForm(box, groups){
  box.innerHTML='';
  groups.forEach(g=>{
    const gd=document.createElement('div'); gd.className='grp';
    gd.innerHTML=`<div class="grp-t">${g.group}</div>`;
    g.fields.forEach(f=>{ gd.appendChild(renderField(f)); });
    box.appendChild(gd);
  });
}

function renderField(f){
  const w=document.createElement('div'); w.className='fld';
  const req=f.is_required?'<span class="req">*</span>':'';
  const lab=`<label>${f.field_name}${req}</label>`;
  let body='';
  const code=f.field_code;
  if(f.field_type==='boolean'){
    body=`<div class="bool-row" data-code="${code}">`+
         `<div class="bool-btn" data-v="true">예</div>`+
         `<div class="bool-btn" data-v="false">아니오</div></div>`;
  } else if(f.field_type==='select'){
    const opts=(f.input_options||[]).map(o=>`<option value="${o.value||o}">${o.label||o}</option>`).join('');
    body=`<select class="sel" data-code="${code}"><option value="">선택하세요</option>${opts}</select>`;
  } else if(f.field_type==='number'){
    const u=f.unit?`<span class="u">${f.unit}</span>`:'';
    body=`<div class="unit-row"><input class="ipt" type="number" inputmode="decimal" data-code="${code}" placeholder="${f.placeholder||''}">${u}</div>`;
  } else {
    body=`<input class="ipt" type="text" data-code="${code}" placeholder="${f.placeholder||''}">`;
  }
  const help=f.help_text?`<div class="help">${f.help_text}</div>`:'';
  w.innerHTML=lab+body+help;
  // boolean 토글 바인딩
  const br=w.querySelector('.bool-row');
  if(br){ br.querySelectorAll('.bool-btn').forEach(btn=>{ btn.onclick=()=>{
    br.querySelectorAll('.bool-btn').forEach(x=>x.classList.remove('on'));
    btn.classList.add('on'); st.values[code]=btn.dataset.v==='true';
  };});}
  return w;
}

function collectValues(){
  const v={...st.values};
  document.querySelectorAll('#dynForm [data-code]').forEach(el=>{
    if(el.classList.contains('bool-row')) return;
    const c=el.dataset.code, val=el.value;
    if(val!=='' && val!=null){ v[c]=el.type==='number'?Number(val):val; }
  });
  return v;
}

// STEP3 → 진단 실행
document.getElementById('doDiag').onclick=async()=>{
  const err=document.getElementById('diagErr'); err.classList.add('hide');
  const vals=collectValues();
  // 필수값 체크
  const miss=[];
  st.fields.forEach(g=>g.fields.forEach(f=>{ if(f.is_required && (vals[f.field_code]==null||vals[f.field_code]==='')) miss.push(f.field_name); }));
  if(miss.length){ err.textContent='필수 항목을 입력해주세요: '+miss.join(', '); err.classList.remove('hide'); return; }
  goStep(4);
  const body=document.getElementById('resBody');
  body.innerHTML='<div class="loading"><div class="spin"></div>법령을 분석하고 있습니다...</div>';
  try{
    const r=await fetch(`${API}/diagnosis/run`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sector:st.sector,tier:'FREE',ci:st.ci,input:vals})});
    const j=await r.json();
    renderResult(body, j.data||j);
  }catch(e){
    body.innerHTML='<div class="err">진단 처리 중 오류가 발생했습니다. 다시 시도해주세요.</div>';
  }
};

// STEP4: 결과 + 유료 CTA (정책—여기서 마무리)
function renderResult(box, d){
  const total=d.applicable_count ?? d.applicable ?? d.total ?? '-';
  const rules=d.rule_count ?? d.rules ?? '-';
  const grade=d.risk_grade || d.grade || 'HIGH';
  const gColor=grade==='LOW'?'#16a34a':(grade==='MID'||grade==='MEDIUM'?'#f59e0b':'#dc2626');
  box.innerHTML=`
    <div class="res-hero">
      <div class="grade" style="background:${gColor}">위험도 ${grade}</div>
    </div>
    <div class="res-stat">
      <div class="b"><div class="n">${total}</div><div class="l">적용 가능 법령</div></div>
      <div class="b"><div class="n">${rules}</div><div class="l">주요 의무조항</div></div>
    </div>
    <p style="text-align:center;color:var(--mut);font-size:13px">무료 진단은 적용 가능한 법령의 개수만 안내합니다.<br>조항별 상세 판정·서식·조치방안은 안전관리설계서에서 확인하세요.</p>
    <div class="cta">
      <h3>우리 사업장의 안전관리설계서 받기</h3>
      <p>적용 법령의 조항별 판정 근거·이행 서식·점검 체크리스트까지<br>전문 설계서로 받아보세요</p>
      <button class="btn" onclick="location.href='/paid-diagnosis?sector=${st.sector}'">유료 진단으로 자세히 보기</button>
    </div>`;
}
</script>
</body>
</html>
