<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재해사례 검색 | TAI 엔지니어링 — 산업재해 사고사례 2,800건+</title>
  <meta name="description" content="KOSHA 국내 산업재해 사고사례 2,800건 이상 검색. 추락, 끼임, 충돌, 감전 등 재해사례를 확인하고 유사 사고를 예방하세요.">
  <link rel="canonical" href="https://taieng.co.kr/accident-cases">
  <link rel="icon" href="assets/img/fevicon.png">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/fontawesome.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/tai-main.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
    .ac-hero {
      background: linear-gradient(160deg, #1a0000 0%, #7f1d1d 50%, #991b1b 100%);
      padding: calc(var(--tai-nav-h, 90px) + 40px) 0 48px;
      text-align: center;
      color: #fff;
    }
    .ac-hero h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 900; margin: 0 0 8px; }
    .ac-hero h1 em { font-style: normal; color: #fecaca; }
    .ac-hero p { color: rgba(255, 255, 255, .55); font-size: .88rem; margin-bottom: 28px; }
    .ac-search-wrap { max-width: 640px; margin: 0 auto; position: relative; }
    .ac-search-wrap input {
      width: 100%; padding: 16px 52px 16px 20px; border: 2px solid rgba(255, 255, 255, .2);
      border-radius: 16px; font-size: 1rem; font-family: inherit; background: rgba(255, 255, 255, .1);
      color: #fff; outline: none; transition: border .2s, background .2s; cursor: text;
    }
    .ac-search-wrap input::placeholder { color: rgba(255, 255, 255, .4); }
    .ac-search-wrap input:focus { border-color: #fecaca; background: rgba(255, 255, 255, .15); }
    .ac-search-btn {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 42px; height: 42px; border: none; border-radius: 12px; background: #fecaca; color: #7f1d1d;
      font-size: 1rem; cursor: pointer;
    }
    .ac-stats { display: flex; justify-content: center; gap: 24px; margin-top: 20px; flex-wrap: wrap; }
    .ac-stat { text-align: center; }
    .ac-stat .num { font-size: 1.4rem; font-weight: 900; color: #fff; }
    .ac-stat .label { font-size: .68rem; color: rgba(255, 255, 255, .45); margin-top: 2px; }
    .ac-body { background: #f4f6f8; min-height: 60vh; padding: 28px 0 60px; }
    .ac-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
    .ac-tab {
      padding: 10px 22px; border-radius: 999px; font-size: .82rem; font-weight: 800; cursor: pointer;
      border: 1.5px solid #e2e8f0; background: #fff; color: #64748b; transition: all .12s;
    }
    .ac-tab:hover { border-color: #94a3b8; color: #334155; }
    .ac-tab.active { background: #0d1b2a; color: #fff; border-color: #0d1b2a; }
    .ac-result-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .ac-result-count { font-size: .88rem; font-weight: 700; color: #0d1b2a; }
    .ac-result-count span { color: #b91c1c; }
    .ac-card {
      background: #fff; border: 1.5px solid #e8eaed; border-radius: 14px; padding: 18px 20px; margin-bottom: 10px;
      transition: box-shadow .2s, border-color .2s; display: flex; gap: 14px; align-items: flex-start;
    }
    .ac-card:hover { box-shadow: 0 4px 16px rgba(0, 0, 0, .06); border-color: #cbd5e1; }
    .ac-icon {
      width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: .85rem; flex-shrink: 0; background: #fee2e2; color: #b91c1c;
    }
    .ac-title { font-size: .92rem; font-weight: 800; color: #0d1b2a; line-height: 1.45; margin-bottom: 6px; }
    .ac-meta { font-size: .73rem; color: #94a3b8; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .ac-badge { font-size: .68rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
    .ac-badge-danger { background: #fee2e2; color: #991b1b; }
    .ac-badge-muted { background: #f1f5f9; color: #64748b; }
    .ac-link {
      display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; font-size: .78rem; font-weight: 700;
      color: #0d1b2a; text-decoration: none; padding: 5px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; transition: all .12s;
    }
    .ac-link:hover { background: #0d1b2a; color: #fff; border-color: #0d1b2a; }
    .ac-empty { text-align: center; padding: 60px 20px; color: #94a3b8; }
    .ac-paging { display: flex; justify-content: center; gap: 4px; margin-top: 28px; flex-wrap: wrap; }
    .ac-pg {
      min-width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: .82rem; font-weight: 700; color: #475569;
      cursor: pointer; background: #fff; transition: all .12s;
    }
    .ac-pg:hover { border-color: #0d1b2a; color: #0d1b2a; }
    .ac-pg.active { background: #0d1b2a; color: #fff; border-color: #0d1b2a; }
    .ac-pg.disabled { opacity: .4; cursor: default; pointer-events: none; }
    .ac-source { text-align: center; margin-top: 32px; font-size: .75rem; color: #94a3b8; line-height: 1.7; }
    .ac-sum { font-size: .82rem; color: #475569; line-height: 1.55; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    @media (max-width: 768px) {
      .ac-card { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body class="sc5">
<div class="preloader" id="preloader"><div class="preloader-inner"><div class="spinner"><div class="dot1"></div><div class="dot2"></div></div></div></div>
<div class="body-overlay" id="body-overlay"></div>
<div id="tai-header"></div>

<div class="ac-hero">
  <h1><em>재해사례</em> 검색</h1>
  <p>KOSHA 국내 산업재해 사례와 건설업 일별 중대재해 정보를 한곳에서 검색합니다.</p>
  <div class="ac-search-wrap">
    <input type="text" id="searchInput" placeholder="검색어 (예: 추락, 비계, 감전, 용접)" autocomplete="off">
    <button type="button" class="ac-search-btn" onclick="doSearch()" aria-label="검색"><i class="fas fa-search"></i></button>
  </div>
  <div class="ac-stats">
    <div class="ac-stat"><div class="num" id="s-domestic">-</div><div class="label">국내 재해사례</div></div>
    <div class="ac-stat"><div class="num" id="s-construction">-</div><div class="label">건설 중대재해</div></div>
  </div>
</div>

<div class="ac-body"><div class="sec-inner">
  <div class="ac-tabs">
    <div class="ac-tab active" data-tab="domestic" role="tab">국내 재해사례 (2,802건)</div>
    <div class="ac-tab" data-tab="construction" role="tab">건설 중대재해 (1,039건)</div>
  </div>

  <div class="ac-result-bar">
    <div class="ac-result-count" id="resultCount">불러오는 중…</div>
  </div>

  <div id="resultList"></div>
  <div class="ac-paging" id="paging"></div>

  <div class="ac-source">
    본 자료는 한국산업안전보건공단에서 공공누리 제1유형으로 개방한 공공저작물입니다.<br>
    출처: 한국산업안전보건공단 (portal.kosha.or.kr)
  </div>
</div></div>

<div id="tai-footer"></div>
<div class="back-to-top"><span class="back-top"><i class="fas fa-angle-double-up"></i></span></div>

<script src="assets/js/jquery.3.6.min.js"></script>
<script src="assets/js/bootstrap.min.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/header.js"></script>
<script src="assets/js/nav-auth.js"></script>
<script src="assets/js/footer.js"></script>
<script>
(function () {
  'use strict';
  const SB = 'https://vwlahtguyggrhvslabax.supabase.co/rest/v1';
  const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3bGFodGd1eWdncmh2c2xhYmF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyOTE1OTYsImV4cCI6MjA5Mjg2NzU5Nn0.Yp6P7ahaCuna_gwYC8_S2KD081Ov9Fs65e9o_AenP48';
  const H = { apikey: KEY, Authorization: 'Bearer ' + KEY, Prefer: 'count=exact' };
  const PG = 20;

  let state = { tab: 'domestic', q: '', page: 1 };

  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function deathBadgeFromTitle(title) {
    const t = String(title || '');
    let m = t.match(/사망\s*(\d+)\s*명/);
    if (m) return '<span class="ac-badge ac-badge-danger">사망 ' + m[1] + '명</span>';
    m = t.match(/(\d+)\s*명\s*사망/);
    if (m) return '<span class="ac-badge ac-badge-danger">사망 ' + m[1] + '명</span>';
    return '<span class="ac-badge ac-badge-muted">재해사례</span>';
  }

  function initFromURL() {
    const p = new URLSearchParams(location.search);
    const tab = p.get('tab');
    if (tab === 'construction') state.tab = 'construction';
    else state.tab = 'domestic';
    if (p.get('q')) state.q = p.get('q');
    if (p.get('page')) state.page = parseInt(p.get('page'), 10) || 1;
    document.getElementById('searchInput').value = state.q;
    document.querySelectorAll('.ac-tab').forEach(function (el) {
      el.classList.toggle('active', el.dataset.tab === state.tab);
    });
  }

  function updateURL() {
    const p = new URLSearchParams();
    if (state.tab !== 'domestic') p.set('tab', state.tab);
    if (state.q) p.set('q', state.q);
    if (state.page > 1) p.set('page', String(state.page));
    const qs = p.toString();
    history.replaceState(null, '', qs ? '?' + qs : location.pathname);
  }

  function buildDomesticURL(offset) {
    let url = SB + '/kosha_accident_cases?select=id,title,board_no,reg_dt,collected_at&order=collected_at.desc&limit=' + PG + '&offset=' + offset;
    url += '&title=not.is.null';
    if (state.q) url += '&title=ilike.*' + encodeURIComponent(state.q) + '*';
    return url;
  }

  function buildConstructionURL(offset) {
    let url = SB + '/kosha_construction_accidents?select=id,accident_type,work_type,occurrence_date,accident_summary,collected_at&order=collected_at.desc&limit=' + PG + '&offset=' + offset;
    if (state.q) {
      const enc = encodeURIComponent(state.q);
      url += '&or=(accident_summary.ilike.*' + enc + '*,work_type.ilike.*' + enc + '*,accident_type.ilike.*' + enc + '*)';
    }
    return url;
  }

  async function loadStats() {
    try {
      const r1 = await fetch(SB + '/kosha_accident_cases?select=id&limit=1', { headers: Object.assign({}, H, { Prefer: 'count=exact' }) });
      const t1 = parseInt(r1.headers.get('content-range') && r1.headers.get('content-range').split('/')[1] || '0', 10);
      document.getElementById('s-domestic').textContent = t1.toLocaleString();
    } catch (e) {
      document.getElementById('s-domestic').textContent = '2,802';
    }
    try {
      const r2 = await fetch(SB + '/kosha_construction_accidents?select=id&limit=1', { headers: Object.assign({}, H, { Prefer: 'count=exact' }) });
      const t2 = parseInt(r2.headers.get('content-range') && r2.headers.get('content-range').split('/')[1] || '0', 10);
      document.getElementById('s-construction').textContent = t2.toLocaleString();
    } catch (e) {
      document.getElementById('s-construction').textContent = '1,039';
    }
  }

  function renderPaging(total) {
    const pages = Math.ceil(total / PG);
    if (pages <= 1) {
      document.getElementById('paging').innerHTML = '';
      return;
    }
    const cur = state.page;
    let h = '';
    h += '<div class="ac-pg ' + (cur === 1 ? 'disabled' : '') + '" onclick="window.__acGoPage(' + (cur - 1) + ')"><i class="fas fa-chevron-left"></i></div>';
    let start = Math.max(1, cur - 3);
    let end = Math.min(pages, cur + 3);
    if (start > 1) h += '<div class="ac-pg" onclick="window.__acGoPage(1)">1</div>' + (start > 2 ? '<div class="ac-pg disabled">…</div>' : '');
    for (let i = start; i <= end; i++) {
      h += '<div class="ac-pg ' + (i === cur ? 'active' : '') + '" onclick="window.__acGoPage(' + i + ')">' + i + '</div>';
    }
    if (end < pages) {
      h += (end < pages - 1 ? '<div class="ac-pg disabled">…</div>' : '') + '<div class="ac-pg" onclick="window.__acGoPage(' + pages + ')">' + pages + '</div>';
    }
    h += '<div class="ac-pg ' + (cur === pages ? 'disabled' : '') + '" onclick="window.__acGoPage(' + (cur + 1) + ')"><i class="fas fa-chevron-right"></i></div>';
    document.getElementById('paging').innerHTML = h;
  }

  window.__acGoPage = function (p) {
    if (p < 1) return;
    state.page = p;
    fetchResults();
    window.scrollTo({ top: 380, behavior: 'smooth' });
  };

  window.doSearch = function () {
    state.q = document.getElementById('searchInput').value.trim();
    state.page = 1;
    fetchResults();
  };

  async function fetchResults() {
    updateURL();
    const el = document.getElementById('resultList');
    const offset = (state.page - 1) * PG;
    const url = state.tab === 'domestic' ? buildDomesticURL(offset) : buildConstructionURL(offset);
    document.getElementById('resultCount').textContent = '불러오는 중…';
    try {
      const r = await fetch(url, { headers: H });
      const total = parseInt(r.headers.get('content-range') && r.headers.get('content-range').split('/')[1] || '0', 10);
      const items = await r.json();
      const label = state.tab === 'domestic' ? '국내 재해사례' : '건설 중대재해';
      document.getElementById('resultCount').innerHTML = state.q
        ? '"' + esc(state.q) + '" · ' + label + ' <span>' + total.toLocaleString() + '</span>건'
        : label + ' 최신 <span>' + total.toLocaleString() + '</span>건';
      if (!items.length) {
        el.innerHTML = '<div class="ac-empty"><i class="fas fa-search"></i><br>결과가 없습니다.</div>';
        document.getElementById('paging').innerHTML = '';
        return;
      }
      if (state.tab === 'domestic') {
        el.innerHTML = items.map(function (it) {
          const badge = deathBadgeFromTitle(it.title);
          const meta = [it.reg_dt, it.board_no ? 'No.' + esc(it.board_no) : ''].filter(Boolean).join(' · ');
          return (
            '<div class="ac-card">' +
            '<div class="ac-icon"><i class="fas fa-exclamation-triangle"></i></div>' +
            '<div style="flex:1;min-width:0">' +
            '<div class="ac-title">' + esc(it.title) + '</div>' +
            '<div class="ac-meta">' + badge + (meta ? '<span>' + esc(meta) + '</span>' : '') + '</div>' +
            '<a class="ac-link" href="https://portal.kosha.or.kr/" target="_blank" rel="noopener">KOSHA 포털 <i class="fas fa-external-link-alt"></i></a>' +
            '</div></div>'
          );
        }).join('');
      } else {
        el.innerHTML = items.map(function (it) {
          const sub = (it.accident_summary || '').replace(/<[^>]+>/g, '').slice(0, 220);
          return (
            '<div class="ac-card">' +
            '<div class="ac-icon"><i class="fas fa-hard-hat"></i></div>' +
            '<div style="flex:1;min-width:0">' +
            '<div class="ac-title">' + esc(it.work_type || it.accident_type || '건설 중대재해') + '</div>' +
            '<div class="ac-meta">' +
            '<span class="ac-badge ac-badge-muted">' + esc(it.accident_type || '') + '</span>' +
            (it.occurrence_date ? '<span>' + esc(it.occurrence_date) + '</span>' : '') +
            '</div>' +
            (sub ? '<div class="ac-sum">' + esc(sub) + (sub.length >= 220 ? '…' : '') + '</div>' : '') +
            '</div></div>'
          );
        }).join('');
      }
      renderPaging(total);
    } catch (e) {
      el.innerHTML = '<div class="ac-empty">데이터를 불러올 수 없습니다.</div>';
      document.getElementById('paging').innerHTML = '';
    }
  }

  document.querySelectorAll('.ac-tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.ac-tab').forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active');
      state.tab = t.dataset.tab;
      state.page = 1;
      fetchResults();
    });
  });

  document.getElementById('searchInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doSearch();
  });

  document.addEventListener('DOMContentLoaded', function () {
    initFromURL();
    loadStats();
    fetchResults();
  });
})();
</script>
</body>
</html>
