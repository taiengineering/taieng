<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAI 화면 쇼케이스</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0e1a;font-family:'Noto Sans KR','Segoe UI',sans-serif;}
.shell{display:flex;height:100vh;width:100vw;}

/* ── 사이드바 ── */
.sidebar{width:200px;flex-shrink:0;background:#0d1120;border-right:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;overflow:hidden;}
.sb-logo{padding:14px 16px 10px;font-size:17px;font-weight:800;color:#fff;letter-spacing:-.3px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0;}
.sb-logo span{color:#22d3ee;}
.sb-search{padding:8px 10px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.06);}
.sb-search input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:5px;padding:5px 9px;color:#fff;font-size:11px;outline:none;}
.sb-search input::placeholder{color:rgba(255,255,255,.3);}
.sb-list{flex:1;overflow-y:auto;padding:6px 0;}
.sb-list::-webkit-scrollbar{width:3px;}
.sb-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}
.sb-group{padding:8px 12px 3px;font-size:9px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.3);text-transform:uppercase;}
.sb-item{display:flex;align-items:center;gap:7px;padding:6px 12px;cursor:pointer;transition:background .12s;font-size:11px;color:rgba(255,255,255,.6);}
.sb-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.sb-item.active{background:rgba(34,211,238,.12);color:#22d3ee;}
.sb-item .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;background:rgba(255,255,255,.2);}
.sb-item.active .dot{background:#22d3ee;}
.sb-item .new-tag{margin-left:auto;font-size:8px;background:rgba(34,211,238,.2);color:#22d3ee;padding:1px 4px;border-radius:3px;}

/* ── 메인 ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}

/* ── 툴바 ── */
.toolbar{height:44px;flex-shrink:0;background:#0d1120;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px;padding:0 14px;}
.tb-title{font-size:13px;font-weight:500;color:#fff;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tb-url{font-size:10px;color:rgba(255,255,255,.3);font-family:monospace;margin-right:6px;}
.tb-meta{font-size:10px;color:rgba(34,211,238,.7);margin-right:4px;white-space:nowrap;}
.layout-btns{display:flex;gap:4px;}
.lbtn{width:30px;height:26px;border:1px solid rgba(255,255,255,.15);border-radius:4px;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}
.lbtn:hover{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.06);}
.lbtn.active{border-color:#22d3ee;background:rgba(34,211,238,.12);}
.lbtn svg{width:13px;height:13px;stroke:rgba(255,255,255,.45);fill:none;stroke-width:1.5;}
.lbtn.active svg{stroke:#22d3ee;}
.tb-reload{padding:3px 10px;border:1px solid rgba(255,255,255,.15);border-radius:4px;background:none;color:rgba(255,255,255,.5);cursor:pointer;font-size:11px;}
.tb-reload:hover{border-color:rgba(255,255,255,.35);color:#fff;}
.tb-open{padding:3px 10px;border-radius:4px;background:rgba(34,211,238,.15);border:1px solid rgba(34,211,238,.3);color:#22d3ee;cursor:pointer;font-size:11px;}
.tb-open:hover{background:rgba(34,211,238,.25);}

/* ── 그리드 래퍼 ── */
.grid-wrap{flex:1;overflow:auto;padding:8px;}
.grid-wrap::-webkit-scrollbar{width:4px;height:4px;}
.grid-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px;}

/* ── 그리드 레이아웃 ── */
.grid{display:grid;width:100%;}
.grid.l1  {grid-template-columns:1fr;                  gap:8px;}
.grid.l4  {grid-template-columns:repeat(2,1fr);        gap:8px;}
.grid.l9  {grid-template-columns:repeat(3,1fr);        gap:8px;}
/* ★ 10열×2행 (가로 두 배, 세로 두 개 줄임) */
.grid.l20 {grid-template-columns:repeat(10,1fr);       gap:6px;}

/* ── 타일 ── */
.tile{background:#111827;border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.08);transition:border-color .15s;cursor:pointer;position:relative;}
.tile:hover{border-color:rgba(34,211,238,.45);}
.tile.selected{border-color:#22d3ee;box-shadow:0 0 0 1px #22d3ee;}
.tile-header{padding:5px 8px;background:#0d1120;display:flex;align-items:center;gap:5px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;}
.tile-dots{display:flex;gap:3px;}
.tile-dots span{width:6px;height:6px;border-radius:50%;}
.tile-dots .d1{background:#ff5f57;}
.tile-dots .d2{background:#febc2e;}
.tile-dots .d3{background:#28c840;}
.tile-name{font-size:10px;color:rgba(255,255,255,.5);margin-left:2px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tile-new{font-size:8px;background:rgba(34,211,238,.2);color:#22d3ee;padding:1px 4px;border-radius:2px;}

/* ── iframe 스케일 래퍼 ── */
.iframe-wrap{position:relative;overflow:hidden;width:100%;}
.iframe-wrap iframe{border:none;display:block;transform-origin:top left;}

/* ── 오버레이 ── */
.tile-overlay{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);}
.tile:hover .tile-overlay{display:flex;}
.overlay-btn{padding:6px 14px;background:#22d3ee;color:#000;border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;}

/* ── 로딩 스피너 ── */
.tile-loading{position:absolute;inset:0;z-index:5;background:#111827;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.1);border-top-color:#22d3ee;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-txt{font-size:10px;color:rgba(255,255,255,.3);}
.tile.hidden{display:none!important;}
</style>
</head>
<body>
<div class="shell">

  <!-- 사이드바 -->
  <aside class="sidebar">
    <div class="sb-logo">TAI<span>Safe</span></div>
    <div class="sb-search">
      <input id="sbSearch" placeholder="화면 검색..." oninput="filterCards(this.value)">
    </div>
    <div class="sb-list" id="sbList"></div>
  </aside>

  <!-- 메인 -->
  <div class="main">
    <div class="toolbar">
      <div class="tb-title" id="tbTitle">TAI 마케팅 사이트 — 전체 화면 보기</div>
      <div class="tb-url" id="tbUrl">new.taieng.co.kr</div>
      <!-- 현재 그리드 정보 표시 -->
      <div class="tb-meta" id="tbMeta">10열 × 2행 (20페이지)</div>
      <div class="layout-btns">
        <!-- 단일 -->
        <button class="lbtn" id="lb1" onclick="setLayout(1)" title="단일 화면">
          <svg viewBox="0 0 13 13"><rect x="1" y="1" width="11" height="11" rx="1"/></svg>
        </button>
        <!-- 4분할 2×2 -->
        <button class="lbtn" id="lb4" onclick="setLayout(4)" title="4분할 (2×2)">
          <svg viewBox="0 0 13 13"><rect x="1" y="1" width="5" height="5" rx=".4"/><rect x="7" y="1" width="5" height="5" rx=".4"/><rect x="1" y="7" width="5" height="5" rx=".4"/><rect x="7" y="7" width="5" height="5" rx=".4"/></svg>
        </button>
        <!-- 9분할 3×3 -->
        <button class="lbtn" id="lb9" onclick="setLayout(9)" title="9분할 (3×3)">
          <svg viewBox="0 0 13 13">
            <rect x="1"   y="1"   width="3" height="3" rx=".3"/>
            <rect x="5"   y="1"   width="3" height="3" rx=".3"/>
            <rect x="9"   y="1"   width="3" height="3" rx=".3"/>
            <rect x="1"   y="5"   width="3" height="3" rx=".3"/>
            <rect x="5"   y="5"   width="3" height="3" rx=".3"/>
            <rect x="9"   y="5"   width="3" height="3" rx=".3"/>
            <rect x="1"   y="9"   width="3" height="3" rx=".3"/>
            <rect x="5"   y="9"   width="3" height="3" rx=".3"/>
            <rect x="9"   y="9"   width="3" height="3" rx=".3"/>
          </svg>
        </button>
        <!-- 전체: 10×2 -->
        <button class="lbtn active" id="lb20" onclick="setLayout(20)" title="전체 (10×2)">
          <svg viewBox="0 0 13 13">
            <rect x=".5" y="1"   width="1.0" height="5" rx=".2"/>
            <rect x="2"  y="1"   width="1.0" height="5" rx=".2"/>
            <rect x="3.5" y="1"  width="1.0" height="5" rx=".2"/>
            <rect x="5"  y="1"   width="1.0" height="5" rx=".2"/>
            <rect x="6.5" y="1"  width="1.0" height="5" rx=".2"/>
            <rect x="8"  y="1"   width="1.0" height="5" rx=".2"/>
            <rect x="9.5" y="1"  width="1.0" height="5" rx=".2"/>
            <rect x="11" y="1"   width="1.0" height="5" rx=".2"/>
            <rect x=".5" y="7"   width="1.0" height="5" rx=".2"/>
            <rect x="2"  y="7"   width="1.0" height="5" rx=".2"/>
            <rect x="3.5" y="7"  width="1.0" height="5" rx=".2"/>
            <rect x="5"  y="7"   width="1.0" height="5" rx=".2"/>
            <rect x="6.5" y="7"  width="1.0" height="5" rx=".2"/>
            <rect x="8"  y="7"   width="1.0" height="5" rx=".2"/>
            <rect x="9.5" y="7"  width="1.0" height="5" rx=".2"/>
            <rect x="11" y="7"   width="1.0" height="5" rx=".2"/>
          </svg>
        </button>
      </div>
      <button class="tb-reload" onclick="reloadAll()">⟳ 새로고침</button>
      <button class="tb-open" onclick="openCurrent()">↗ 새 탭</button>
    </div>

    <div class="grid-wrap">
      <div class="grid l20" id="grid"></div>
    </div>
  </div>
</div>

<script>
/* nexas/ = Cloudflare Pages 루트 → prefix 없음 */
const BASE = 'https://new.taieng.co.kr/';

const PAGES = [
  {id:'home',       name:'홈',           url:BASE+'index.html',               group:'메인',   isNew:false},
  {id:'about',      name:'회사소개',      url:BASE+'about.html',               group:'메인',   isNew:false},
  {id:'pricing',    name:'요금제',        url:BASE+'pricing.html',             group:'메인',   isNew:true },
  {id:'contact',    name:'문의하기',      url:BASE+'contact.html',             group:'메인',   isNew:false},
  {id:'faq',        name:'FAQ',          url:BASE+'faq.html',                 group:'메인',   isNew:false},
  {id:'sm',         name:'안전관리자',    url:BASE+'for-safety-manager.html',  group:'대상별', isNew:false},
  {id:'bo',         name:'사업주',        url:BASE+'for-business-owner.html',  group:'대상별', isNew:false},
  {id:'tgt-bld',    name:'건물·시설',     url:BASE+'target/building.html',     group:'대상별', isNew:false},
  {id:'tgt-fac',    name:'공장·산업',     url:BASE+'target/factory.html',      group:'대상별', isNew:false},
  {id:'tgt-con',    name:'건설현장',      url:BASE+'target/construction.html', group:'대상별', isNew:false},
  {id:'svc-saas',   name:'SaaS 구독',    url:BASE+'service/saas.html',        group:'서비스', isNew:false},
  {id:'svc-diag',   name:'법령진단',      url:BASE+'service/diagnosis.html',   group:'서비스', isNew:false},
  {id:'svc-cons',   name:'컨설팅',        url:BASE+'service/consulting.html',  group:'서비스', isNew:false},
  {id:'svc-appt',   name:'선임 연결',     url:BASE+'service/appointment.html', group:'서비스', isNew:false},
  {id:'svc-edu',    name:'교육',          url:BASE+'service/education.html',   group:'서비스', isNew:false},
  {id:'svc-inapp',  name:'인앱 서비스',   url:BASE+'service/inapp.html',       group:'서비스', isNew:false},
  {id:'svc-repair', name:'수선 연결',     url:BASE+'service/repair.html',      group:'서비스', isNew:false},
  {id:'free-diag',  name:'무료 법령진단', url:BASE+'free-diagnosis.html',      group:'진단',   isNew:false},
  {id:'connect',    name:'전문가 연결',   url:BASE+'connect.html',             group:'연결',   isNew:false},
  {id:'patents',    name:'특허',          url:BASE+'patents.html',             group:'회사',   isNew:false},
];

/* ── 레이아웃 정의 (cols, rows) ── */
const LAYOUTS = {
  1:  {cols:1,  rows:1},
  4:  {cols:2,  rows:2},
  9:  {cols:3,  rows:3},
  /* ★ 가로 두 배(10열), 세로 두 개 줄임(2행) */
  20: {cols:10, rows:2},
};
const META_LABEL = {1:'단일', 4:'2열×2행', 9:'3열×3행', 20:'10열×2행 (20페이지)'};

let currentLayout = 20;
let currentPage   = null;
const iframeMap   = {};
const VPORT_W = 1440, VPORT_H = 900;

/* ── 사이드바 렌더 ── */
function renderSidebar(){
  const el     = document.getElementById('sbList');
  const groups = [...new Set(PAGES.map(p=>p.group))];
  el.innerHTML = groups.map(g => {
    const items = PAGES.filter(p=>p.group===g).map(p=>
      `<div class="sb-item" id="sb-${p.id}" onclick="focusPage('${p.id}')">
        <span class="dot"></span><span>${p.name}</span>
        ${p.isNew?'<span class="new-tag">NEW</span>':''}
      </div>`
    ).join('');
    return `<div class="sb-group">${g}</div>${items}`;
  }).join('');
}

/* ── 그리드 렌더 ── */
function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = PAGES.map(p=>
    `<div class="tile" id="tile-${p.id}" onclick="focusPage('${p.id}')">
      <div class="tile-header">
        <div class="tile-dots"><span class="d1"></span><span class="d2"></span><span class="d3"></span></div>
        <span class="tile-name">${p.name}</span>
        ${p.isNew?'<span class="tile-new">NEW</span>':''}
      </div>
      <div class="iframe-wrap" id="wrap-${p.id}">
        <div class="tile-loading" id="load-${p.id}">
          <div class="spinner"></div>
          <div class="loading-txt">${p.name}</div>
        </div>
        <iframe id="iframe-${p.id}" title="${p.name}" scrolling="no"></iframe>
      </div>
      <div class="tile-overlay">
        <button class="overlay-btn" onclick="event.stopPropagation();setLayout(1);focusPage('${p.id}')">전체 보기</button>
      </div>
    </div>`
  ).join('');
  PAGES.forEach(p=>{ iframeMap[p.id] = document.getElementById('iframe-'+p.id); });
}

/* ── 타일 크기 & iframe 스케일 계산 ── */
function applyTileSizes(){
  const gw     = document.querySelector('.grid-wrap');
  const availW = gw.clientWidth  - 16;   /* padding×2 */
  const availH = gw.clientHeight - 16;
  const {cols, rows} = LAYOUTS[currentLayout];
  const gap    = currentLayout===20 ? 6 : 8;
  const tileW  = Math.floor((availW - gap*(cols-1)) / cols);
  const tileH  = currentLayout===1
    ? availH - 28                                               /* 단일: 헤더 28px */
    : Math.floor((availH - gap*(rows-1)) / rows) - 28;
  const scale  = Math.min(tileW/VPORT_W, tileH/VPORT_H);

  PAGES.forEach(p=>{
    const wrap  = document.getElementById('wrap-'+p.id);
    const frame = iframeMap[p.id];
    if(!wrap||!frame) return;
    wrap.style.height      = tileH+'px';
    frame.style.width      = VPORT_W+'px';
    frame.style.height     = VPORT_H+'px';
    frame.style.transform  = `scale(${scale})`;
    /* transform으로 잘리지 않게 래퍼 높이 보정 */
    wrap.style.height = (VPORT_H * scale)+'px';
  });
}

/* ── 지연 로드 (순차적, 300ms 간격) ── */
let loadIdx = 0;
function lazyLoad(){
  if(loadIdx >= PAGES.length) return;
  const p     = PAGES[loadIdx++];
  const frame = iframeMap[p.id];
  if(!frame){ lazyLoad(); return; }
  frame.onload  = ()=>{ const ld=document.getElementById('load-'+p.id); if(ld) ld.style.display='none'; setTimeout(lazyLoad,80); };
  frame.onerror = ()=>{ const ld=document.getElementById('load-'+p.id); if(ld) ld.innerHTML='<div class="loading-txt" style="color:rgba(255,120,120,.7)">로드 실패</div>'; setTimeout(lazyLoad,80); };
  frame.src = p.url;
  setTimeout(lazyLoad, 350);
}

/* ── 레이아웃 전환 ── */
function setLayout(n){
  currentLayout = n;
  document.getElementById('grid').className = 'grid l'+n;
  document.getElementById('tbMeta').textContent = META_LABEL[n];
  if(n===1){
    const target = currentPage || PAGES[0].id;
    PAGES.forEach(p=>{ document.getElementById('tile-'+p.id)?.classList.toggle('hidden', p.id!==target); });
  } else {
    PAGES.forEach(p=>{ document.getElementById('tile-'+p.id)?.classList.remove('hidden'); });
  }
  [1,4,9,20].forEach(x=>{ document.getElementById('lb'+x)?.classList.toggle('active', x===n); });
  setTimeout(applyTileSizes, 50);
}

/* ── 페이지 포커스 ── */
function focusPage(id){
  currentPage = id;
  const p = PAGES.find(x=>x.id===id); if(!p) return;
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('sb-'+id)?.classList.add('active');
  document.querySelectorAll('.tile').forEach(el=>el.classList.remove('selected'));
  document.getElementById('tile-'+id)?.classList.add('selected');
  document.getElementById('tbTitle').textContent = p.name + ' — ' + p.group;
  document.getElementById('tbUrl').textContent = p.url.replace('https://','');
  if(currentLayout===1){
    PAGES.forEach(x=>{ document.getElementById('tile-'+x.id)?.classList.toggle('hidden', x.id!==id); });
  }
  document.getElementById('sb-'+id)?.scrollIntoView({block:'nearest'});
}

/* ── 검색 필터 ── */
function filterCards(q){
  q = q.toLowerCase();
  PAGES.forEach(p=>{
    const match = !q || p.name.toLowerCase().includes(q) || p.group.toLowerCase().includes(q);
    document.getElementById('tile-'+p.id)?.classList.toggle('hidden', !match);
    const sb = document.getElementById('sb-'+p.id);
    if(sb) sb.style.display = match ? '' : 'none';
  });
}

/* ── 유틸 ── */
function reloadAll(){
  loadIdx = 0;
  PAGES.forEach(p=>{
    const frame=iframeMap[p.id], ld=document.getElementById('load-'+p.id);
    if(frame){ frame.src=''; }
    if(ld){ ld.style.display='flex'; ld.innerHTML='<div class="spinner"></div><div class="loading-txt">재로딩...</div>'; }
  });
  setTimeout(lazyLoad, 200);
}
function openCurrent(){
  const p = PAGES.find(x=>x.id===currentPage)||PAGES[0];
  window.open(p.url,'_blank');
}

/* ── 초기화 ── */
renderSidebar();
renderGrid();
setLayout(20);
applyTileSizes();
lazyLoad();
window.addEventListener('resize', ()=>setTimeout(applyTileSizes,100));
</script>
</body>
</html>
