  <style>
  body { background:#f8fafc; font-family:'Noto Sans KR',sans-serif; }
  .ei-wrap { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
  .ei-back  { display:inline-flex; align-items:center; gap:6px; color:#64748b;
              font-size:.88rem; text-decoration:none; margin-bottom:28px; }
  .ei-back:hover { color:#0d1b2a; }

  /* 진행 표시 */
  .ei-progress { display:flex; align-items:center; gap:0; margin-bottom:40px; }
  .ei-step { display:flex; flex-direction:column; align-items:center; gap:4px; flex:0 0 auto; }
  .ei-dot  { width:28px; height:28px; border-radius:50%; display:flex;
              align-items:center; justify-content:center; font-size:.75rem; font-weight:800; }
  .ei-dot.active { background:#0d1b2a; color:#fff; }
  .ei-dot.done   { background:#22c55e; color:#fff; }
  .ei-dot.idle   { background:#e8eaed; color:#94a3b8; }
  .ei-step-label { font-size:.68rem; color:#94a3b8; font-weight:600; white-space:nowrap; }
  .ei-step-label.active { color:#0d1b2a; }
  .ei-step-label.done   { color:#22c55e; }
  .ei-line { flex:1; height:2px; background:#e8eaed; margin:0 6px 14px; }
  .ei-line.done { background:#22c55e; }

  /* 히어로 */
  .ei-hero { background:linear-gradient(135deg,#0d1b2a,#1a3a5c); border-radius:20px;
              padding:40px 36px; color:#fff; margin-bottom:28px; text-align:center; }
  .ei-hero-icon { font-size:3rem; margin-bottom:12px; }
  .ei-hero h1   { font-size:1.5rem; font-weight:900; margin-bottom:10px; color:#fff; }
  .ei-hero p    { font-size:.9rem; color:rgba(255,255,255,.8); line-height:1.7; margin:0; }

  /* 혜택 카드 */
  .ei-benefits { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:28px; }
  @media(max-width:520px){ .ei-benefits { grid-template-columns:1fr; } }
  .ei-benefit-card { background:#fff; border:1.5px solid #e8eaed; border-radius:14px;
                      padding:20px 16px; }
  .ei-benefit-card .bc-icon { font-size:1.5rem; margin-bottom:8px; }
  .ei-benefit-card .bc-title { font-size:.9rem; font-weight:800; color:#0d1b2a; margin-bottom:6px; }
  .ei-benefit-card .bc-desc  { font-size:.8rem; color:#64748b; line-height:1.6; margin:0; }

  /* CTA */
  .ei-cta { background:#0d1b2a; color:#fff; border:none; border-radius:12px;
              padding:16px; font-size:1rem; font-weight:700; width:100%;
              cursor:pointer; transition:background .2s; }
  .ei-cta:hover { background:#1a3a5c; }

  /* 본인인증 안내 */
  .ei-identity-notice { background:#fef3c7; border:1px solid #fcd34d; border-radius:12px;
                          padding:20px; margin-top:20px; }
  .ei-identity-notice h4 { font-size:1rem; font-weight:800; color:#92400e; margin-bottom:8px; }
  .ei-identity-notice p  { font-size:.85rem; color:#78350f; line-height:1.6; margin-bottom:12px; }
  .ei-identity-btn { display:inline-block; background:#92400e; color:#fff;
                      border-radius:8px; padding:10px 20px; font-size:.88rem;
                      font-weight:700; text-decoration:none; }

<body>
<div class="ei-wrap">
  <a href="./" class="ei-back">← 마이페이지</a>

  <!-- 진행 표시 -->
  <div class="ei-progress">
    <div class="ei-step">
      <div class="ei-dot active">1</div>
      <div class="ei-step-label active">혜택 확인</div>
    </div>
    <div class="ei-line"></div>
    <div class="ei-step">
      <div class="ei-dot idle">2</div>
      <div class="ei-step-label">약관 동의</div>
    </div>
    <div class="ei-line"></div>
    <div class="ei-step">
      <div class="ei-dot idle">3</div>
      <div class="ei-step-label">정보 입력</div>
    </div>
  </div>

  <!-- 히어로 -->
  <div class="ei-hero" id="eiHero">
    <div class="ei-hero-icon" id="eiIcon"></div>
    <h1 id="eiTitle"></h1>
    <p id="eiDesc"></p>
  </div>

  <!-- 혜택 카드 -->
  <div class="ei-benefits" id="eiBenefits"></div>

  <!-- CTA -->
  <button class="ei-cta" id="btnContinue">지금 등록하기 →</button>

  <!-- 본인인증 미완료 안내 -->
  <div class="ei-identity-notice" id="identityRequired" style="display:none;">
    <h4>⚠️ 본인인증이 필요합니다</h4>
    <p>
      전문가 등록은 본인인증 완료 후 진행할 수 있습니다.<br>
      이니시스 안전인증 연동 준비 중이며 <strong>곧 오픈 예정</strong>입니다.
    </p>
    <a href="profile/?verify=1" id="btnVerify" class="ei-identity-btn">본인인증 하기</a>
  </div>
</div>

<script>
var type = (new URLSearchParams(location.search)).get('type') || 'safety';

var TYPE_DATA = {
  safety: {
    icon: '🛡️',
    title: '안전관리 대행 전문가로 등록하세요',
    desc: '법령진단이 완료된 사업장과 직접 연결되어 안전관리 업무를 수탁하세요.',
    benefits: [
      { icon:'🎯', title:'우선 노출', desc:'법령진단 완료 사업장에 우선 노출됩니다.' },
      { icon:'📋', title:'문서 자동 생성', desc:'점검표·보고서가 자동으로 생성됩니다.' },
      { icon:'💰', title:'투명한 정산', desc:'플랫폼을 통해 성사된 계약의 플랫폼 이용료만 정산합니다.' },
      { icon:'📊', title:'대시보드 제공', desc:'수탁 현황·일정 대시보드가 제공됩니다.' }
    ]
  },
  fix: {
    icon: '🔧',
    title: '시공·수선 전문 업체로 등록하세요',
    desc: '수선 의뢰 사업장과 직접 매칭되어 설비 수선·시설 개선 업무를 진행하세요.',
    benefits: [
      { icon:'🔧', title:'직접 매칭', desc:'수선 의뢰와 직접 연결됩니다.' },
      { icon:'📍', title:'지역 우선 노출', desc:'지역 기반으로 우선 노출됩니다.' },
      { icon:'📁', title:'디지털 처리', desc:'견적·계약·완료 보고가 디지털로 처리됩니다.' },
      { icon:'💰', title:'투명한 정산', desc:'플랫폼 이용료 기반으로 투명하게 정산됩니다.' }
    ]
  },
  consult: {
    icon: '📋',
    title: '진단·컨설팅 전문가로 등록하세요',
    desc: '법령진단 의뢰 사업장과 직접 연결되어 전문 컨설팅을 제공하세요.',
    benefits: [
      { icon:'📋', title:'직접 연결', desc:'법령진단 의뢰 사업장과 직접 연결됩니다.' },
      { icon:'🤖', title:'AI 1차 분석', desc:'TAI 엔진 1차 분석 + 전문가 검토로 차별화됩니다.' },
      { icon:'📄', title:'보고서 자동 생성', desc:'보고서 자동 생성이 지원됩니다.' },
      { icon:'💰', title:'투명한 수익 구조', desc:'성과 정산금 기반 투명한 수익 구조입니다.' }
    ]
  }
};

var data = TYPE_DATA[type] || TYPE_DATA.safety;
document.getElementById('eiIcon').textContent  = data.icon;
document.getElementById('eiTitle').textContent = data.title;
document.getElementById('eiDesc').textContent  = data.desc;

document.getElementById('eiBenefits').innerHTML = data.benefits.map(function(b) {
  return '<div class="ei-benefit-card">'
    + '<div class="bc-icon">' + b.icon + '</div>'
    + '<div class="bc-title">' + b.title + '</div>'
    + '<p class="bc-desc">' + b.desc + '</p>'
    + '</div>';
}).join('');

// 본인인증 링크에 redirect 추가
var verifyBtn = document.getElementById('btnVerify');
if (verifyBtn) {
  verifyBtn.href = 'profile/?verify=1&redirect=' + encodeURIComponent('expert-terms.html?type=' + type);
}

document.getElementById('btnContinue').onclick = function() {
  if (!localStorage.getItem('access_token')) {
    location.href = '../log-in.html?redirect=' + encodeURIComponent(location.href);
    return;
  }
  if (localStorage.getItem('identity_verified') !== 'true') {
    var notice = document.getElementById('identityRequired');
    notice.style.display = 'block';
    notice.scrollIntoView({ behavior:'smooth' });
    return;
  }
  location.href = 'expert-terms.html?type=' + type;
};
</script>
<script src="/assets/js/tai-analytics.js"></script>
