<script>
/* ══════════════════════════════════════════
   유틸
══════════════════════════════════════════ */
var BASE_API = 'https://api.taieng.co.kr';

async function apiCall(method, endpoint, body) {
  var token = localStorage.getItem('access_token') || '';
  var opts  = { method: method, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token } };
  if (body) opts.body = JSON.stringify(body);
  var res = await fetch(BASE_API + endpoint, opts);
  var d   = await res.json().catch(function(){ return {}; });
  if (!res.ok) throw new Error(d.detail || d.message || '오류가 발생했습니다.');
  return d;
}

function showToast(level, msg) {
  var el = document.createElement('div');
  el.className = 'tai-toast';
  el.textContent = msg;
  var bg = { error:'#e63946', success:'#22c55e', info:'#3b82f6', warning:'#f59e0b' };
  el.style.background = bg[level] || '#0d1b2a';
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3500);
}

function setLoading(btn, loading, text) {
  if (!btn) return;
  btn.disabled    = loading;
  btn.textContent = text;
}

/* ══════════════════════════════════════════
   페이지 초기화
══════════════════════════════════════════ */
var type = (new URLSearchParams(location.search)).get('type') || 'safety';
document.getElementById('backLink').href = '../expert-terms.html?type=' + type;

if (localStorage.getItem('identity_verified') !== 'true') {
  location.replace('../expert-intro.html?type=' + type);
} else if (!localStorage.getItem('expert_terms_agreed_' + type)) {
  location.replace('../expert-terms.html?type=' + type);
}

var TYPE_MAP   = { 'safety': 'EXPERT', 'fix': 'REPAIR', 'consult': 'CONSULTING' };
var expertType = TYPE_MAP[type] || 'EXPERT';

/* ── ALLOWED_MATRIX ── */
var ALLOWED_MATRIX = {
  'EXPERT':     ['INDIVIDUAL', 'SOLE_PROPRIETOR', 'SIMPLIFIED_TAX', 'CORPORATION'],
  'CONSULTING': ['INDIVIDUAL', 'SOLE_PROPRIETOR', 'SIMPLIFIED_TAX', 'CORPORATION'],
  'REPAIR':     ['SOLE_PROPRIETOR', 'SIMPLIFIED_TAX', 'CORPORATION'],
};

var ENTITY_LIST = [
  { code:'INDIVIDUAL',      label:'개인',      desc:'사업자 없이 개인으로 활동' },
  { code:'SOLE_PROPRIETOR', label:'개인사업자', desc:'일반과세 개인사업자' },
  { code:'SIMPLIFIED_TAX',  label:'간이과세자', desc:'간이과세 개인사업자' },
  { code:'CORPORATION',     label:'법인사업자', desc:'주식회사·유한회사 등' },
];

function getDisabledReason(expType, entityCode) {
  if (expType === 'REPAIR' && entityCode === 'INDIVIDUAL') {
    return '수선중개는 사업자 등록이 필요합니다 (개인사업자/간이과세자/법인)';
  }
  return '';
}

/* ── DOC_CONFIG (entity_type별 서류) ── */
var DOC_CONFIG = {
  INDIVIDUAL:       [ { type:'LICENSE',   label:'자격증 사본',  required:true  },
                      { type:'PORTFOLIO', label:'포트폴리오',   required:false } ],
  SOLE_PROPRIETOR:  [ { type:'BIZ_REG',  label:'사업자등록증', required:true  },
                      { type:'LICENSE',  label:'자격증 사본',  required:true  },
                      { type:'PORTFOLIO',label:'포트폴리오',   required:false } ],
  SIMPLIFIED_TAX:   [ { type:'BIZ_REG',  label:'사업자등록증', required:true  },
                      { type:'LICENSE',  label:'자격증 사본',  required:true  },
                      { type:'PORTFOLIO',label:'포트폴리오',   required:false } ],
  CORPORATION:      [ { type:'BIZ_REG',  label:'사업자등록증',     required:true  },
                      { type:'CORP_REG', label:'법인등기부등본',   required:true  },
                      { type:'PERMIT',   label:'인허가증',         required:true  },
                      { type:'INSURANCE',label:'배상책임보험증권', required:false },
                      { type:'PORTFOLIO',label:'포트폴리오',       required:false } ],
};

/* 수선업 추가 필수 서류 */
var REPAIR_EXTRA = [
  { type:'PERMIT',    label:'인허가증',         required:true  },
  { type:'INSURANCE', label:'배상책임보험증권', required:false },
];

function getDocConfig() {
  var base = (DOC_CONFIG[selectedEntityType] || []).slice();
  if (expertType === 'REPAIR') {
    /* REPAIR_EXTRA 중 base에 없는 것만 추가 */
    REPAIR_EXTRA.forEach(function(ex) {
      if (!base.find(function(b){ return b.type === ex.type; })) {
        base.push(ex);
      }
    });
  }
  return base;
}

/* ══════════════════════════════════════════
   업로드 상태
══════════════════════════════════════════ */
var uploadedFiles          = {};   // { DOC_TYPE: { path, name, size, mime } }
var pendingFiles           = {};   // 신청 전 선택 파일
var currentApplicationId  = null;

async function uploadFile(docType, file, applicationId) {
  if (file.size > 20 * 1024 * 1024) {
    showToast('error', '파일 크기는 20MB 이하여야 합니다.');
    return false;
  }
  var allowed = ['image/png','image/jpeg','image/jpg','application/pdf'];
  if (allowed.indexOf(file.type) === -1) {
    showToast('error', 'PNG, JPG, PDF 파일만 업로드 가능합니다.');
    return false;
  }

  var uploadBtn = document.getElementById('upload-btn-' + docType);
  setLoading(uploadBtn, true, '업로드 중...');

  try {
    /* 1. Signed Upload URL 발급 */
    var urlRes = await apiCall('POST', '/experts/upload-url', {
      application_id: applicationId,
      doc_type:       docType,
      file_name:      file.name,
      file_size:      file.size,
    });
    var signedUrl = urlRes.data.signed_url;
    var filePath  = urlRes.data.path;

    /* 2. Supabase Storage 직접 PUT 업로드 */
    var uploadRes = await fetch(signedUrl, {
      method: 'PUT', headers: { 'Content-Type': file.type }, body: file,
    });
    if (!uploadRes.ok) throw new Error('파일 업로드 실패');

    /* 3. /experts/attach 등록 */
    await apiCall('POST', '/experts/attach', {
      application_id: applicationId,
      doc_type:       docType,
      file_path:      filePath,
      file_name:      file.name,
      file_size:      file.size,
      mime_type:      file.type,
    });

    /* 4. 로컬 상태 저장 + UI 갱신 */
    uploadedFiles[docType] = { path:filePath, name:file.name, size:file.size, mime:file.type };
    renderUploadedFile(docType, file.name);
    showToast('success', file.name + ' 업로드 완료');
    return true;

  } catch(e) {
    showToast('error', e.message || '업로드 실패');
    return false;
  } finally {
    setLoading(uploadBtn, false, '파일 선택');
  }
}

function renderUploadedFile(docType, fileName) {
  var zone  = document.getElementById('upload-zone-'    + docType);
  var done  = document.getElementById('uploaded-zone-'  + docType);
  var label = document.getElementById('uploaded-name-'  + docType);
  if (zone)  zone.classList.add('d-none');
  if (done)  done.classList.remove('d-none');
  if (label) label.textContent = fileName;
}

function removeFile(docType) {
  delete uploadedFiles[docType];
  delete pendingFiles[docType];
  var zone = document.getElementById('upload-zone-'   + docType);
  var done = document.getElementById('uploaded-zone-' + docType);
  if (zone) zone.classList.remove('d-none');
  if (done) done.classList.add('d-none');
  var fileInput = document.getElementById('file-' + docType);
  if (fileInput) fileInput.value = '';
}

function handleDrop(event, docType) {
  event.preventDefault();
  var z = document.getElementById('upload-zone-' + docType);
  if (z) z.classList.remove('drag-over');
  var file = event.dataTransfer && event.dataTransfer.files[0];
  if (file) processFile(docType, file);
}

function handleDragOver(event, docType) {
  event.preventDefault();
  var z = document.getElementById('upload-zone-' + docType);
  if (z) z.classList.add('drag-over');
}

function handleDragLeave(docType) {
  var z = document.getElementById('upload-zone-' + docType);
  if (z) z.classList.remove('drag-over');
}

function handleFileSelect(event, docType) {
  var file = event.target.files && event.target.files[0];
  if (!file) return;
  processFile(docType, file);
}

function processFile(docType, file) {
  if (currentApplicationId) {
    uploadFile(docType, file, currentApplicationId);
  } else {
    pendingFiles[docType] = file;
    renderUploadedFile(docType, file.name);
  }
}

/* ── 업로더 HTML 생성 ── */
function renderDocUploader(docType, label, required) {
  return '<div class="doc-upload-item" id="doc-item-' + docType + '">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">'
    + '<label class="ea-label mb-0">' + label
    + (required ? ' <span style="color:#e63946;">*</span>' : ' <span style="color:#94a3b8;font-weight:400;font-size:.75rem;">(선택)</span>')
    + '</label>'
    + '<small style="color:#94a3b8;font-size:.72rem;">PNG·JPG·PDF / 최대 20MB</small>'
    + '</div>'
    /* 업로드 전 영역 */

function validateBizNo(val) {
  var v = val.replace(/[^0-9]/g,'');
  if (v.length !== 10) return false;
  var key = [1,3,7,1,3,7,1,3,5], sum = 0;
  for (var i=0;i<9;i++) sum += key[i] * parseInt(v[i]);
  sum += Math.floor((5*parseInt(v[8]))/10);
  return (10-(sum%10))%10 === parseInt(v[9]);
}

var selectedRegions = [];
function toggleRegion(el, sido) {
  if (el.classList.contains('selected')) {
    el.classList.remove('selected');
    selectedRegions = selectedRegions.filter(function(s){ return s !== sido; });
  } else {
    el.classList.add('selected');
    selectedRegions.push(sido);
  }
}

var checkedItems = {};
function toggleCheck(el) {
  el.classList.toggle('checked');
  checkedItems[el.dataset.id] = el.classList.contains('checked');
}

var formData = {};
function selectYN(el, val, key) {
  el.parentNode.querySelectorAll('.ea-yn-btn').forEach(function(b){ b.className='ea-yn-btn'; });
  el.classList.add(val ? 'sel-y' : 'sel-n');
  formData[key] = val;
  if (key === 'license_yn') {
    var sub = document.getElementById('licenseTypeSub');
    if (sub) sub.style.display = val ? 'block' : 'none';
  }
}

function formatBizNo(el) {
  var v = el.value.replace(/[^0-9]/g,'');
  if (v.length <= 3) el.value = v;
  else if (v.length <= 5) el.value = v.slice(0,3)+'-'+v.slice(3);
  else el.value = v.slice(0,3)+'-'+v.slice(3,5)+'-'+v.slice(5,10);
  el.className = 'ea-input';
  document.getElementById('fBizNoErr').className = 'ea-input-err';
}

function onBizNoBlur(el) {
  var raw = el.value.replace(/[^0-9]/g,'');
  var errEl = document.getElementById('fBizNoErr');
  if (!raw) return;
  if (validateBizNo(raw)) {
    el.classList.add('valid'); el.classList.remove('invalid'); errEl.className='ea-input-err';
  } else {
    el.classList.add('invalid'); el.classList.remove('valid'); errEl.className='ea-input-err show';
  }
}

function countIntro(el) {
  var c = document.getElementById('introCounter');
  if (c) c.textContent = el.value.length + ' / 200';
}

var selectedWorkTypes = new Set();
function toggleWorkType(wtype) {
  var chk  = document.getElementById('chk-' + wtype);
  var card = document.getElementById('card-' + wtype);
  var detailId = wtype === 'RESIDENT' ? 'section-resident-detail' : 'section-non-resident-detail';
  if (selectedWorkTypes.has(wtype)) {
    selectedWorkTypes.delete(wtype);
    if (chk) chk.checked = false;
    if (card) card.classList.remove('selected');
    var d = document.getElementById(detailId);
    if (d) d.style.display = 'none';
  } else {
    selectedWorkTypes.add(wtype);
    if (chk) chk.checked = true;
    if (card) card.classList.add('selected');
    var d2 = document.getElementById(detailId);
    if (d2) d2.style.display = 'block';
  }
  var e = document.getElementById('err-work-type');
  if (e) e.classList.remove('show');
}

function buildPayload(bizName, bizNo, phone, intro) {
  var typeData = {};
  if (type === 'safety') {
    typeData.max_sites = parseInt((document.getElementById('fMaxSite')||{}).value||0);
  } else if (type === 'fix') {
    typeData.license_yn   = formData.license_yn || false;
    typeData.license_type = (document.getElementById('fLicenseType')||{}).value||'';
    typeData.tech_count   = parseInt((document.getElementById('fTechCount')||{}).value||0);
  } else if (type === 'consult') {
    typeData.diag_count = parseInt((document.getElementById('fDiagCount')||{}).value||0);
  }

  var workTypesArr = type === 'safety' ? Array.from(selectedWorkTypes) : null;

  var residentDetail = null;
  if (type === 'safety' && selectedWorkTypes.has('RESIDENT')) {
    residentDetail = {
      employment_type: (document.getElementById('employmentType')||{}).value || null,
      immediate_join:  ((document.querySelector('[name=immediateJoin]:checked'))||{}).value || 'N',
      salary_min:      Number((document.getElementById('salaryMin')||{}).value) || null,
      salary_max:      Number((document.getElementById('salaryMax')||{}).value) || null,
    };
  }

  var nonResidentDetail = null;
  if (type === 'safety' && selectedWorkTypes.has('NON_RESIDENT')) {
    nonResidentDetail = {
      visit_per_month: Number((document.getElementById('visitPerMonth')||{}).value) || null,
      remote_support:  ((document.querySelector('[name=remoteSupport]:checked'))||{}).value || 'Y',
      visit_price:     Number((document.getElementById('visitPrice')||{}).value) || null,
    };
  }

  return {
    expert_type:         expertType,
    entity_type:         selectedEntityType,
    biz_name:            bizName,
    biz_number:          bizNo,
    representative:      (document.getElementById('fRepresentative')||{}).value||'',
    contact_phone:       phone,
    service_regions:     selectedRegions,
    intro_text:          intro,
    terms_agreed:        true,
    terms_agreed_at:     localStorage.getItem('expert_terms_agreed_' + type),
    type_data:           typeData,
    work_types:          workTypesArr,
    resident_detail:     residentDetail,
    non_resident_detail: nonResidentDetail,
  };
}

  var bizName = (document.getElementById('fBizName')||{}).value||'';
  var bizNo   = ((document.getElementById('fBizNo')||{}).value||'').replace(/[^0-9]/g,'');
  var phone   = (document.getElementById('fPhone')||{}).value||'';
  var intro   = (document.getElementById('fIntro')||{}).value||'';

  if (!bizName.trim())    { showToast('error','업체명 또는 성명을 입력해주세요.'); return; }
  if (!validateBizNo(bizNo)) { showToast('error','올바른 사업자등록번호를 입력해주세요.'); return; }
  if (!phone.trim())      { showToast('error','연락처를 입력해주세요.'); return; }
  if (selectedRegions.length === 0) { showToast('error','활동 가능 지역을 하나 이상 선택해주세요.'); return; }

  /* ── 3. 근무형태 (선임) ── */
  if (type === 'safety' && selectedWorkTypes.size === 0) {
    var errWt = document.getElementById('err-work-type');
    if (errWt) errWt.classList.add('show');
    var st = document.getElementById('section-work-type');
    if (st) st.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }

  /* ── 4. 필수 서류 체크 ── */
  var configs = getDocConfig();
  var missing = configs.filter(function(c){
    return c.required && !uploadedFiles[c.type] && !pendingFiles[c.type];
  }).map(function(c){ return c.label; });
  if (missing.length > 0) {
    showToast('error', '필수 서류를 업로드해 주세요: ' + missing.join(', '));
    var dw = document.getElementById('doc-section-wrap');
    if (dw) dw.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }

  var btn = document.getElementById('btnSubmit');
  setLoading(btn, true, '신청 중...');

  try {
    /* ── 5. 신청 접수 → application_id 획득 ── */
    var applyRes = await apiCall('POST', '/experts/apply', buildPayload(bizName.trim(), bizNo, phone, intro));
    currentApplicationId = applyRes.data.application_id;

    /* ── 6. pendingFiles 일괄 업로드 ── */
    var uploadTasks = Object.entries(pendingFiles).map(function(entry) {
      return uploadFile(entry[0], entry[1], currentApplicationId);
    });
    await Promise.all(uploadTasks);

    /* ── 7. 완료 화면 ── */
    if (window.TaiMypageState) TaiMypageState.setExpertStatus(type, 'pending');
    document.getElementById('formArea').style.display  = 'none';
    document.querySelector('.ea-back').style.display   = 'none';
    document.querySelector('.ea-notice').style.display = 'none';
    document.getElementById('completeArea').style.display = 'block';
    showToast('success', '신청이 완료되었습니다. 1~2 영업일 내 검토 후 안내드립니다.');

  } catch(e) {
    showToast('error', e.message || '신청 실패');
    setLoading(btn, false, '등록 신청하기');
  }
}
</script>
</body>
</html>
