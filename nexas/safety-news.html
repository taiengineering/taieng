<script>
const SB='https://vwlahtguyggrhvslabax.supabase.co/rest/v1';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3bGFodGd1eWdncmh2c2xhYmF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyOTE1OTYsImV4cCI6MjA5Mjg2NzU5Nn0.Yp6P7ahaCuna_gwYC8_S2KD081Ov9Fs65e9o_AenP48';
const H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Prefer':'count=exact'};
const PG=20;
const CAT_LABEL={EDUCATION:'교육자료',CASE_STUDY:'사고사례',GUIDE:'가이드',POSTER:'포스터·홍보',VIDEO_VR:'영상·VR',HEALTH:'보건·건강',RESEARCH:'연구·보고서',CHECKLIST:'체크리스트',FOREIGN:'외국인자료',REGULATION:'법령',OTHER:'기타'};
const CAT_ICON={EDUCATION:'fa-chalkboard-teacher',CASE_STUDY:'fa-exclamation-triangle',GUIDE:'fa-book-open',POSTER:'fa-image',VIDEO_VR:'fa-play-circle',HEALTH:'fa-heartbeat',RESEARCH:'fa-flask',CHECKLIST:'fa-clipboard-check',FOREIGN:'fa-globe',REGULATION:'fa-gavel',OTHER:'fa-file-alt'};
const SEC_LABEL={CONSTRUCTION:'건설',MANUFACTURING:'제조',SERVICE:'서비스',COMMON:'공통'};

let filters={cat:'ALL',sec:'ALL',q:'',page:1};

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function parseContentTotal(r){
  var h=r.headers.get('content-range')||r.headers.get('Content-Range')||'';
  var parts=h.split('/');
  var last=parts.length>1?parts[parts.length-1]:'0';
  var n=parseInt(String(last).replace(/\*/g,'').trim(),10);
  return isNaN(n)?0:n;
}

// URL 파라미터 초기화
function initFromURL(){
  const p=new URLSearchParams(location.search);
  if(p.get('q'))filters.q=p.get('q');
  if(p.get('cat'))filters.cat=p.get('cat');
  if(p.get('sec'))filters.sec=p.get('sec');
  if(p.get('page'))filters.page=parseInt(p.get('page'))||1;
  document.getElementById('searchInput').value=filters.q;
  document.querySelectorAll('[data-cat]').forEach(c=>{c.classList.toggle('active',c.dataset.cat===filters.cat);});
  document.querySelectorAll('[data-sec]').forEach(c=>{c.classList.toggle('active',c.dataset.sec===filters.sec);});
}

function updateURL(){
  const p=new URLSearchParams();
  if(filters.q)p.set('q',filters.q);
  if(filters.cat!=='ALL')p.set('cat',filters.cat);
  if(filters.sec!=='ALL')p.set('sec',filters.sec);
  if(filters.page>1)p.set('page',filters.page);
  const qs=p.toString();
  history.replaceState(null,'',qs?'?'+qs:location.pathname);
}

// 이벤트
document.querySelectorAll('[data-cat]').forEach(c=>{
  c.addEventListener('click',()=>{
    document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    filters.cat=c.dataset.cat;filters.page=1;
    fetchResults();
  });
});
document.querySelectorAll('[data-sec]').forEach(c=>{
  c.addEventListener('click',()=>{
    document.querySelectorAll('[data-sec]').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    filters.sec=c.dataset.sec;filters.page=1;
    fetchResults();
  });
});
document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});

function doSearch(){
  filters.q=document.getElementById('searchInput').value.trim();
  filters.page=1;
  fetchResults();
}

async function fetchResults(){
  updateURL();
  const el=document.getElementById('resultList');
  const latestEl=document.getElementById('latestHeading');
  const offset=(filters.page-1)*PG;
  let url=`${SB}/kosha_safety_materials?select=id,title,url,category,sector&order=collected_at.desc&limit=${PG}&offset=${offset}`;
  if(filters.cat!=='ALL')url+=`&category=eq.${filters.cat}`;
  if(filters.sec!=='ALL')url+=`&sector=eq.${filters.sec}`;
  if(filters.q)url+=`&title=ilike.*${encodeURIComponent(filters.q)}*`;
  document.getElementById('resultCount').textContent='불러오는 중…';
  if(latestEl)latestEl.style.display=filters.q?'none':'block';
  try{
    const r=await fetch(url,{headers:H});
    const total=parseContentTotal(r);
    const items=await r.json();
    document.getElementById('resultCount').innerHTML=
      filters.q?`"<span>${esc(filters.q)}</span>" 검색 결과 <span>${total.toLocaleString()}</span>건`
      :`최신 자료 · 전체 <span>${total.toLocaleString()}</span>건 (페이지당 ${PG}건)`;
    if(!items.length){
      el.innerHTML=filters.q
        ?'<div class="sh-empty"><div class="icon"><i class="fas fa-search"></i></div>검색 결과가 없습니다.<br>다른 키워드로 검색해보세요.</div>'
        :'<div class="sh-empty"><div class="icon"><i class="fas fa-inbox"></i></div>표시할 자료가 없습니다.<br>잠시 후 다시 시도해 주세요.</div>';
      document.getElementById('paging').innerHTML='';
      return;
    }
    el.innerHTML=items.map(it=>{
      const cat=it.category||'OTHER';
      const sec=it.sector||'COMMON';
      return `<div class="sh-card">
        <div class="sh-icon ic-${cat}"><i class="fas ${CAT_ICON[cat]||'fa-file-alt'}"></i></div>
        <div style="flex:1;min-width:0">
          <div class="sh-title">${esc(it.title)}</div>
          <div class="sh-meta">
            <span class="sh-cat-badge">${CAT_LABEL[cat]||cat}</span>
            <span class="sh-sector-badge sec-${sec}">${SEC_LABEL[sec]||sec}</span>
          </div>
          ${it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener" class="sh-link"><i class="fas fa-external-link-alt"></i> 자료 보기</a>`:''}
        </div>
      </div>`;
    }).join('');
    renderPaging(total);
  }catch(e){
    el.innerHTML='<div class="sh-empty"><i class="fas fa-exclamation-circle"></i> 데이터를 불러올 수 없습니다.</div>';
  }
}

function renderPaging(total){
  const pages=Math.ceil(total/PG);
  if(pages<=1){document.getElementById('paging').innerHTML='';return;}
  const cur=filters.page;
  let h='';
  h+=`<div class="sh-pg ${cur===1?'disabled':''}" onclick="goPage(${cur-1})"><i class="fas fa-chevron-left"></i></div>`;
  let start=Math.max(1,cur-3),end=Math.min(pages,cur+3);
  if(start>1)h+=`<div class="sh-pg" onclick="goPage(1)">1</div>${start>2?'<div class="sh-pg disabled">…</div>':''}`;
  for(let i=start;i<=end;i++)h+=`<div class="sh-pg ${i===cur?'active':''}" onclick="goPage(${i})">${i}</div>`;
  if(end<pages)h+=`${end<pages-1?'<div class="sh-pg disabled">…</div>':''}<div class="sh-pg" onclick="goPage(${pages})">${pages}</div>`;
  h+=`<div class="sh-pg ${cur===pages?'disabled':''}" onclick="goPage(${cur+1})"><i class="fas fa-chevron-right"></i></div>`;
  document.getElementById('paging').innerHTML=h;
}
function goPage(p){if(p<1)return;filters.page=p;fetchResults();window.scrollTo({top:400,behavior:'smooth'});}

async function loadStats(){
  try{
    const r=await fetch(`${SB}/kosha_safety_materials?select=category&limit=1`,{headers:{...H,'Prefer':'count=exact'}});
    const total=parseContentTotal(r);
    document.getElementById('s-total').textContent=total.toLocaleString();
    const cats=['EDUCATION','CASE_STUDY','GUIDE','POSTER'];
    const ids=['s-edu','s-case','s-guide','s-poster'];
    for(let i=0;i<cats.length;i++){
      const cr=await fetch(`${SB}/kosha_safety_materials?select=id&category=eq.${cats[i]}&limit=1`,{headers:{...H,'Prefer':'count=exact'}});
      document.getElementById(ids[i]).textContent=parseContentTotal(cr).toLocaleString();
    }
  }catch(e){}
}

document.addEventListener('DOMContentLoaded',()=>{initFromURL();fetchResults();loadStats();});
</script>
</body>
