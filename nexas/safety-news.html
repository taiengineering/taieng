<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안전정보 | TAI 엔지니어링</title>
  <link rel="icon" href="assets/img/fevicon.png">
  <link rel="stylesheet" href="assets/css/animate.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/fontawesome.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/tai-main.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
  body { font-family: 'Noto Sans KR', sans-serif; }
  .news-hero { background:var(--navy); padding:100px 0 50px; }
  .news-hero h1 { font-size:clamp(1.8rem,3.5vw,2.6rem); font-weight:900; color:#fff; margin-bottom:10px; }
  .news-hero p { color:rgba(255,255,255,.6); font-size:.95rem; }
  .cat-filter { display:flex; gap:8px; flex-wrap:wrap; padding:28px 0; border-bottom:1px solid var(--border); margin-bottom:32px; }
  .cat-btn { padding:7px 16px; border-radius:999px; font-size:.82rem; font-weight:600; cursor:pointer; border:1.5px solid var(--border); background:#fff; color:var(--sub); transition:all .15s; }
  .cat-btn.active, .cat-btn:hover { background:var(--navy); color:#fff; border-color:var(--navy); }
  .news-card { background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 14px rgba(0,0,0,.06); height:100%; transition:transform .2s; }
  .news-card:hover { transform:translateY(-4px); }
  .news-card-body { padding:20px; }
  .news-tag { display:inline-block; font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; border-radius:4px; padding:3px 8px; margin-bottom:10px; }
  .tag-law      { background:#fff0f0; color:var(--red); }
  .tag-accident { background:#e8f4fd; color:#1a6fb5; }
  .tag-inspect  { background:#f0fff4; color:#1a8f4b; }
  .tag-guide    { background:#fdf6e8; color:#9a6b00; }
  .news-card h5 { font-size:.95rem; font-weight:800; color:var(--navy); margin-bottom:8px; line-height:1.4; }
  .news-card p { font-size:.82rem; color:var(--sub); margin:0; line-height:1.55; }
  .news-meta { display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:14px; border-top:1px solid var(--border); font-size:.76rem; color:var(--sub); }
  .notice-bar { background:#fffbeb; border:1px solid #fcd34d; border-radius:10px; padding:16px 20px; margin-bottom:24px; display:flex; gap:12px; align-items:center; }
  .notice-bar .icon { color:#f59e0b; font-size:1.1rem; flex-shrink:0; }
  .notice-bar p { margin:0; font-size:.88rem; color:#92400e; }
  .news-loading { text-align:center; padding:40px; color:var(--sub); }
  .prec-cta { margin-top:50px; padding:32px 20px; background:#fff; border-radius:14px; box-shadow:0 2px 14px rgba(0,0,0,.06); text-align:center; }
  .prec-cta h3 { font-size:1.25rem; font-weight:800; color:var(--navy); margin-bottom:8px; }
  .prec-cta p { color:var(--sub); font-size:.9rem; margin-bottom:20px; }
  </style>
</head>
<body class="sc5">
<div class="preloader" id="preloader"><div class="preloader-inner"><div class="spinner"><div class="dot1"></div><div class="dot2"></div></div></div></div>
<div class="body-overlay" id="body-overlay"></div>

<!-- HEADER -->
<div id="tai-header"></div>

<div class="news-hero">
  <div class="sec-inner">
    <h1>안전정보</h1>
    <p>산업안전 법령 개정 · 재해 사례 · 감독 동향을 확인하세요</p>
  </div>
</div>

<div class="sec" style="background:var(--gray-bg); padding-top:40px;">
  <div class="sec-inner">
    <div id="noticeBar" class="notice-bar" style="display:none;">
      <div class="icon"><i class="fas fa-bullhorn"></i></div>
      <p id="noticeText"></p>
    </div>
    <div class="cat-filter">
      <button class="cat-btn active" onclick="loadNews('all',   this)">전체</button>
      <button class="cat-btn"        onclick="loadNews('law',   this)">법령 개정</button>
      <button class="cat-btn"        onclick="loadNews('accident',this)">재해 사례</button>
      <button class="cat-btn"        onclick="loadNews('inspection',this)">감독 동향</button>
    </div>
    <div id="newsGrid" class="row g-4">
      <div class="news-loading"><i class="fas fa-spinner fa-spin me-2"></i>뉴스를 불러오는 중...</div>
    </div>
    <div class="text-center mt-4" id="loadMoreWrap" style="display:none;">
      <button class="btn-outline" style="padding:12px 36px;" onclick="loadMoreNews()">+ 더 보기</button>
    </div>

    <div class="prec-cta">
      <h3>최신 산업안전·산재 판례도 검색해 보세요</h3>
      <p>현장에서 꼭 알아야 할 산업안전보건법·중대재해처벌법·산재 판례를 키워드로 찾을 수 있습니다.</p>
      <a href="precedent-search.html" class="btn-red" style="display:inline-block;">판례 검색 →</a>
    </div>
  </div>
</div>

<div id="tai-footer"></div>
<div class="back-to-top"><span class="back-top"><i class="fas fa-angle-double-up"></i></span></div>
<script src="assets/js/jquery.3.6.min.js"></script>
<script src="assets/js/bootstrap.min.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/header.js"></script>
<script src="assets/js/nav-auth.js"></script>
<script src="assets/js/footer.js"></script>
<script>
const API = 'https://api.taieng.co.kr';
const TAG_MAP = { 'law':{ label:'법령 개정', cls:'tag-law' }, 'accident':{ label:'재해 사례', cls:'tag-accident' }, 'inspection':{ label:'감독 동향', cls:'tag-inspect' }, 'guide':{ label:'실무 가이드',cls:'tag-guide' } };
const IMG_FALLBACK = ['https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=600&q=70','https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=600&q=70','https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=600&q=70','https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=600&q=70','https://images.unsplash.com/photo-1581092160562-40aa08c7880a?auto=format&fit=crop&w=600&q=70'];
const SAMPLE_NEWS = [{id:'s1',post_type:'law',title:'산업안전보건법 시행규칙 개정 — 지게차 작업계획서 의무화',content:'2026년 3월부터 3톤 이상 지게차 작업 시 작업계획서 제출 의무화.',published_at:'2026-03-15',source:'TAI 법령팀'},{id:'s2',post_type:'accident',title:'끼임 사고 예방 — 프레스 작업 10대 안전수칙',content:'제조업 끼임 사고의 40%는 프레스 작업 중 발생합니다.',published_at:'2026-03-10',source:'TAI 안전팀'},{id:'s3',post_type:'inspection',title:'고용노동부 건설현장 기획감독 — 주요 적발 사례',content:'2026년 1분기 기획감독 결과 타워크레인·가설공사 위반이 집중적으로 적발.',published_at:'2026-03-05',source:'TAI 정보팀'},{id:'s4',post_type:'law',title:'중대재해처벌법 — 50인 미만 사업장 전면 적용',content:'2026년 1월부터 50인 미만 사업장도 적용 대상입니다.',published_at:'2026-02-20',source:'TAI 법령팀'},{id:'s5',post_type:'accident',title:'건설현장 추락사고 예방 — 작업발판 설치 기준',content:'추락사고는 건설현장 사망의 49%를 차지합니다.',published_at:'2026-02-10',source:'TAI 안전팀'},{id:'s6',post_type:'inspection',title:'화학공장 PSM 감독 강화 — 2026년 중점 점검 방향',content:'공정안전관리(PSM) 대상 사업장의 자체감사 이행 여부 집중 점검.',published_at:'2026-01-25',source:'TAI 정보팀'}];
let _curType='all', _newsPage=1;
const PAGE_SZ=6;
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(d){ return String(d||'').slice(0,10).replace(/-/g,'.'); }
async function loadNews(type, btn) {
  if(btn){ document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
  _curType=type; _newsPage=1;
  const grid=document.getElementById('newsGrid');
  grid.innerHTML='<div class="news-loading"><i class="fas fa-spinner fa-spin me-2"></i>뉴스를 불러오는 중...</div>';
  try {
    const params=type==='all'?'':`&post_type=${type}`;
    const res=await fetch(`${API}/posts?size=${PAGE_SZ}${params}`);
    const data=await res.json();
    const posts=(data.data&&data.data.items)||data.data||[];
    if(posts.length){ renderNews(posts); document.getElementById('loadMoreWrap').style.display=posts.length<PAGE_SZ?'none':''; return; }
    throw new Error('empty');
  } catch {
    const filtered=type==='all'?SAMPLE_NEWS:SAMPLE_NEWS.filter(p=>p.post_type===type);
    renderNews(filtered,true); document.getElementById('loadMoreWrap').style.display='none';
  }
}
function renderNews(posts) {
  const grid=document.getElementById('newsGrid');
  if(!posts.length){ grid.innerHTML='<p style="text-align:center;padding:40px;color:var(--sub);">게시물이 없습니다.</p>'; return; }
  grid.innerHTML=posts.map((p,i)=>{ const tag=TAG_MAP[p.post_type]||{label:'정보',cls:'tag-guide'}; const img=p.thumbnail_url||IMG_FALLBACK[i%IMG_FALLBACK.length]; return `<div class="col-lg-4 col-md-6"><div class="news-card"><img src="${esc(img)}" alt="" style="width:100%;height:180px;object-fit:cover;"><div class="news-card-body"><span class="news-tag ${tag.cls}">${esc(tag.label)}</span><h5>${esc(p.title)}</h5><p>${esc((p.content||'').slice(0,80))}${(p.content||'').length>80?'…':''}</p><div class="news-meta"><span>${fmtDate(p.published_at||p.created_at)}</span><span>${esc(p.source||'TAI')}</span></div></div></div></div>`; }).join('');
}
async function loadMoreNews() {
  _newsPage++;
  try { const params=_curType==='all'?'':`&post_type=${_curType}`; const res=await fetch(`${API}/posts?size=${PAGE_SZ}&page=${_newsPage}${params}`); const data=await res.json(); const posts=(data.data&&data.data.items)||data.data||[]; if(!posts.length){ document.getElementById('loadMoreWrap').style.display='none'; return; } const grid=document.getElementById('newsGrid'); grid.insertAdjacentHTML('beforeend',posts.map((p,i)=>{ const tag=TAG_MAP[p.post_type]||{label:'정보',cls:'tag-guide'}; const img=p.thumbnail_url||IMG_FALLBACK[i%IMG_FALLBACK.length]; return `<div class="col-lg-4 col-md-6"><div class="news-card"><img src="${esc(img)}" alt="" style="width:100%;height:180px;object-fit:cover;"><div class="news-card-body"><span class="news-tag ${tag.cls}">${esc(tag.label)}</span><h5>${esc(p.title)}</h5><p>${esc((p.content||'').slice(0,80))}…</p><div class="news-meta"><span>${fmtDate(p.published_at)}</span><span>${esc(p.source||'TAI')}</span></div></div></div></div>`; }).join('')); if(posts.length<PAGE_SZ) document.getElementById('loadMoreWrap').style.display='none'; } catch {}
}
document.addEventListener('DOMContentLoaded',function(){
  loadNews('all');
  document.getElementById('noticeBar').style.display='flex';
  document.getElementById('noticeText').innerHTML='<strong>[공지]</strong> 중대재해처벌법 개정 시행령 2026년 1월 적용 — 50인 미만 사업장 주요 변경사항을 확인하세요.';
});
</script>
</body>
</html>
