<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전문가 매칭 | TAI Fix</title>
  <meta name="description" content="증상을 말씀해주세요. TAI 전문가가 적합한 업체를 매칭해드립니다.">
  <link rel="icon" href="assets/img/fevicon.png">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/fontawesome.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/tai-main.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
  body { font-family: 'Noto Sans KR', sans-serif; background: #f0f4f8; }

  /* ── 채팅 래퍼 ── */
  .chat-page { max-width: 800px; margin: 0 auto; padding: 32px 16px 80px; }

  .chat-header {
    background: linear-gradient(135deg, #0d1b2a, #1a3a5c);
    border-radius: 20px 20px 0 0;
    padding: 20px 24px;
    display: flex; align-items: center; gap: 14px;
  }
  .chat-header .avatar {
    width: 46px; height: 46px; border-radius: 50%;
    background: #378add; display: flex; align-items: center;
    justify-content: center; font-size: 1.3rem; font-weight: 900;
    color: #fff; flex-shrink: 0;
  }
  .chat-header .info h5 { color: #fff; font-weight: 900; font-size: 1rem; margin: 0; }
  .chat-header .info p  { color: rgba(255,255,255,.6); font-size: .78rem; margin: 2px 0 0; }
  .chat-header .badge-turn {
    margin-left: auto; background: rgba(255,255,255,.15);
    border-radius: 999px; padding: 4px 12px;
    font-size: .75rem; color: rgba(255,255,255,.85); font-weight: 700;
    white-space: nowrap;
  }

  /* ── 메시지 영역 ── */
  .chat-body {
    background: #fff;
    min-height: 400px;
    max-height: 520px;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex; flex-direction: column; gap: 18px;
  }

  .msg-row { display: flex; gap: 10px; align-items: flex-end; }
  .msg-row.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: #378add; display: flex; align-items: center;
    justify-content: center; font-size: .9rem; font-weight: 900;
    color: #fff; flex-shrink: 0;
  }

  .bubble {
    max-width: 72%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: .9rem; line-height: 1.6;
  }
  .bubble.expert {
    background: #f1f5f9; color: #0f172a;
    border-bottom-left-radius: 4px;
  }
  .bubble.user {
    background: #378add; color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.user .msg-time { color: rgba(255,255,255,.65); }
  .msg-time { font-size: .68rem; color: #94a3b8; margin-top: 4px; text-align: right; }

  /* 타이핑 인디케이터 */
  .typing-indicator {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    background: #f1f5f9; border-radius: 18px; border-bottom-left-radius: 4px;
    font-size: .82rem; color: #64748b; width: fit-content;
  }
  .typing-dots { display: flex; gap: 3px; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%; background: #94a3b8;
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: .2s; }
  .typing-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce {
    0%,80%,100% { transform: translateY(0); }
    40%          { transform: translateY(-6px); }
  }

  /* ── 입력창 ── */
  .chat-input-bar {
    background: #fff;
    border-top: 1px solid #e8eaed;
    border-radius: 0 0 20px 20px;
    padding: 14px 16px;
    display: flex; gap: 10px; align-items: flex-end;
  }
  .chat-input-bar textarea {
    flex: 1; border: 1.5px solid #e8eaed; border-radius: 14px;
    padding: 11px 14px; font-size: .9rem; resize: none;
    font-family: inherit; line-height: 1.5; max-height: 120px;
    outline: none; transition: border-color .15s;
  }
  .chat-input-bar textarea:focus { border-color: #378add; }
  .chat-input-bar textarea::placeholder { color: #94a3b8; }
  .btn-send {
    width: 44px; height: 44px; border-radius: 12px;
    background: #378add; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background .15s;
  }
  .btn-send:hover { background: #2563aa; }
  .btn-send:disabled { background: #cbd5e1; cursor: not-allowed; }
  .btn-send svg { width: 20px; height: 20px; fill: #fff; }

  /* ── 결과 카드 (3턴 후) ── */
  .result-section {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    margin-top: 20px;
    border: 1px solid #e8eaed;
    display: none;
  }
  .result-section.show { display: block; }
  .result-title {
    font-size: 1rem; font-weight: 900; color: #0d1b2a;
    margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
  }
  .result-item {
    border: 1px solid #e8eaed; border-radius: 12px; padding: 14px 16px;
    margin-bottom: 10px; position: relative;
  }
  .result-item .ri-label {
    font-size: .72rem; font-weight: 700; color: #64748b;
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px;
  }
  .result-item .ri-value {
    font-size: .9rem; font-weight: 700; color: #0d1b2a;
  }
  /* 블러 */
  .result-item.blurred .ri-value {
    filter: blur(5px);
    user-select: none;
    pointer-events: none;
  }
  .result-item.blurred::after {
    content: '🔒';
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    font-size: 1rem;
  }
  .result-item.blurred .ri-label { color: #94a3b8; }

  /* CTA 카드 */
  .cta-card {
    background: linear-gradient(135deg, #0d1b2a, #1a3a5c);
    border-radius: 16px; padding: 24px; margin-top: 16px;
    text-align: center;
  }
  .cta-card h5 { color: #fff; font-weight: 900; font-size: 1rem; margin-bottom: 8px; }
  .cta-card p  { color: rgba(255,255,255,.7); font-size: .85rem; margin-bottom: 20px; line-height: 1.6; }
  .cta-card .btn-cta {
    background: #378add; color: #fff; font-weight: 800;
    font-size: .95rem; padding: 13px 28px; border: none;
    border-radius: 12px; cursor: pointer; transition: background .15s;
    display: inline-block; text-decoration: none;
  }
  .cta-card .btn-cta:hover { background: #2563aa; color: #fff; }

  /* 채팅 비활성 overlay */
  .chat-disabled {
    position: relative;
  }
  .chat-disabled::after {
    content: '';
    position: absolute; inset: 0;
    background: rgba(255,255,255,.6);
    border-radius: 0 0 0 0;
    pointer-events: all;
  }

  /* 오류 메시지 */
  .chat-error {
    background: #fef2f2; border: 1px solid #fecaca;
    border-radius: 10px; padding: 10px 14px;
    font-size: .82rem; color: #dc2626; margin-top: 8px; display: none;
  }
  .chat-error.show { display: block; }

  @media(max-width:600px) {
    .chat-page { padding: 16px 8px 60px; }
    .bubble { max-width: 85%; }
  }
  </style>
</head>
<body class="sc5">
<div class="preloader" id="preloader"><div class="preloader-inner"><div class="spinner"><div class="dot1"></div><div class="dot2"></div></div></div></div>
<div class="body-overlay" id="body-overlay"></div>
<div id="tai-header"></div>

<section style="background:#f0f4f8; padding:60px 0 0;">
  <div class="chat-page">

    <!-- 채팅 헤더 -->
    <div class="chat-header">
      <div class="avatar">T</div>
      <div class="info">
        <h5>TAI 전문가</h5>
        <p>산업안전 전문 업체 매칭 · 비회원 무료 체험</p>
      </div>
      <div class="badge-turn" id="turnBadge">0 / 3 턴</div>
    </div>

    <!-- 메시지 목록 -->
    <div class="chat-body" id="chatBody">
      <!-- 메시지는 JS로 추가 -->
    </div>

    <!-- 오류 -->
    <div class="chat-error" id="chatError"></div>

    <!-- 입력창 -->
    <div class="chat-input-bar" id="inputBar">
      <textarea id="msgInput" rows="1"
        placeholder="상황을 편하게 말씀해주세요 (예: 분전반에서 타는 냄새가 나요)"
        onInput="autoResize(this)" onkeydown="onEnterKey(event)"></textarea>
      <button class="btn-send" id="btnSend" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>

    <!-- 결과 카드 (3턴 후) -->
    <div class="result-section" id="resultSection">
      <div class="result-title">📋 대화 분석 결과</div>
      <div id="resultItems"></div>
      <div class="cta-card">
        <h5>💡 대화 내용이 저장되어 있습니다.</h5>
        <p>회원가입 후 바로 전문 업체 매칭이 시작됩니다.<br>블러 처리된 법령·과태료·업체 정보도 확인할 수 있습니다.</p>
        <a href="log-in.html" class="btn-cta">무료 회원가입 후 전체 결과 보기 →</a>
      </div>
    </div>

  </div>
</section>

<div id="tai-footer"></div>
<div class="back-to-top"><span class="back-top"><i class="fas fa-angle-double-up"></i></span></div>
<script src="assets/js/jquery.3.6.min.js"></script>
<script src="assets/js/bootstrap.min.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/header.js"></script>
<script src="assets/js/nav-auth.js"></script>
<script src="assets/js/footer.js"></script>
<script>
const API = 'https://api.taieng.co.kr';
const MAX_TURNS = 3;

let sessionId = null;
let turnCount  = 0;
let isEnded    = false;
let isSending  = false;

// ── 초기화 ──
window.addEventListener('DOMContentLoaded', () => {
  startChat();
});

async function startChat() {
  // 기존 세션 확인
  const savedSession = sessionStorage.getItem('fix_session_id');
  if (savedSession) {
    sessionId = savedSession;
    appendExpertMsg('안녕하세요! 이전 대화를 이어서 진행하겠습니다. 추가로 말씀하실 내용이 있으신가요?');
    return;
  }

  try {
    const res = await fetch(`${API}/fix/chat/start`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_type: 'GUEST' })
    });
    const json = await res.json();
    if (json.session_id) {
      sessionId = json.session_id;
      sessionStorage.setItem('fix_session_id', sessionId);
      appendExpertMsg(json.greeting_message || '안녕하세요! 저는 TAI 전문가입니다. 어떤 문제가 발생하셨나요? 편하게 말씀해주세요.');
    } else {
      throw new Error('session_id 없음');
    }
  } catch(e) {
    // API 미구현 — 기본 인사 메시지
    sessionId = 'guest_' + Date.now();
    sessionStorage.setItem('fix_session_id', sessionId);
    appendExpertMsg('안녕하세요! 저는 TAI 전문가입니다. 어떤 문제가 발생하셨나요? 편하게 말씀해주세요. 😊');
  }
  updateTurnBadge();
}

// ── 메시지 전송 ──
async function sendMessage() {
  if (isEnded || isSending) return;
  const input = document.getElementById('msgInput');
  const msg = input.value.trim();
  if (!msg) return;

  input.value = '';
  autoResize(input);
  appendUserMsg(msg);
  turnCount++;
  updateTurnBadge();

  // 3턴 도달
  if (turnCount >= MAX_TURNS) {
    isEnded = true;
    disableInput();
  }

  isSending = true;
  document.getElementById('btnSend').disabled = true;
  showTyping();

  try {
    const res = await fetch(`${API}/fix/chat/message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: msg })
    });
    const json = await res.json();
    hideTyping();

    const reply = json.reply || json.data?.reply;
    if (reply) {
      appendExpertMsg(reply);
    }

    // API가 is_last_turn 반환하거나 로컬 카운트 초과 시 결과 표시
    if (json.is_last_turn || json.data?.is_last_turn || isEnded) {
      setTimeout(showResult, 600);
    }
  } catch(e) {
    hideTyping();
    // API 미구현 — 더미 응답
    const dummies = [
      '말씀해주신 상황을 분석하고 있습니다. 조금 더 자세히 설명해 주실 수 있으신가요? 어느 위치에서 발생했나요?',
      '네, 파악했습니다. 마지막으로 언제부터 이 문제가 발생했는지 알려주시면 더 정확한 업체를 연결해드릴 수 있습니다.',
      '감사합니다. 입력하신 내용을 바탕으로 적합한 전문 업체를 분석하겠습니다.'
    ];
    const dummyReply = dummies[Math.min(turnCount - 1, dummies.length - 1)];
    appendExpertMsg(dummyReply);
    if (isEnded) {
      setTimeout(showResult, 600);
    }
  }

  isSending = false;
  if (!isEnded) {
    document.getElementById('btnSend').disabled = false;
    document.getElementById('msgInput').focus();
  }
}

// ── 결과 카드 표시 ──
function showResult() {
  const items = [
    { label: '접수 의도',  value: '전문 업체 수선·보수 요청', blurred: false },
    { label: '증상 요약',  value: '설비/시설 이상 증상 감지, 전문가 점검 필요', blurred: false },
    { label: '관련 법령',  value: '산업안전보건법 제36조 위험성평가 의무, 안전관리규정 준수', blurred: true },
    { label: '과태료 정보', value: '위반 시 500만원 이하 과태료 부과 가능', blurred: true },
    { label: '매칭 가능 업체', value: '해당 지역 전문업체 3곳 매칭 가능', blurred: true },
  ];
  const el = document.getElementById('resultItems');
  el.innerHTML = items.map(it => `
    <div class="result-item${it.blurred ? ' blurred' : ''}">
      <div class="ri-label">${it.label}</div>
      <div class="ri-value">${it.value}</div>
    </div>`).join('');
  document.getElementById('resultSection').classList.add('show');
  document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ── DOM 헬퍼 ──
function appendExpertMsg(text) {
  const body = document.getElementById('chatBody');
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.innerHTML = `
    <div class="msg-avatar">T</div>
    <div>
      <div class="bubble expert">${escHtml(text)}</div>
      <div class="msg-time">${nowTime()}</div>
    </div>`;
  body.appendChild(row);
  scrollBottom();
}

function appendUserMsg(text) {
  const body = document.getElementById('chatBody');
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `
    <div>
      <div class="bubble user">${escHtml(text)}</div>
      <div class="msg-time">${nowTime()}</div>
    </div>`;
  body.appendChild(row);
  scrollBottom();
}

let typingEl = null;
function showTyping() {
  const body = document.getElementById('chatBody');
  typingEl = document.createElement('div');
  typingEl.className = 'msg-row';
  typingEl.id = 'typingRow';
  typingEl.innerHTML = `
    <div class="msg-avatar">T</div>
    <div class="typing-indicator">
      TAI 전문가가 입력 중
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>`;
  body.appendChild(typingEl);
  scrollBottom();
}
function hideTyping() {
  const el = document.getElementById('typingRow');
  if (el) el.remove();
}

function disableInput() {
  const bar = document.getElementById('inputBar');
  const inp = document.getElementById('msgInput');
  const btn = document.getElementById('btnSend');
  inp.disabled = true;
  btn.disabled = true;
  inp.placeholder = '대화가 완료되었습니다. 회원가입 후 매칭을 진행하세요.';
}

function updateTurnBadge() {
  document.getElementById('turnBadge').textContent = `${turnCount} / ${MAX_TURNS} 턴`;
}

function scrollBottom() {
  const body = document.getElementById('chatBody');
  body.scrollTop = body.scrollHeight;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function onEnterKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function nowTime() {
  return new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
           .replace(/"/g,'&quot;').replace(/\n/g,'<br>');
}
</script>
</body>
</html>
