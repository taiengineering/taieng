<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TAI 엔지니어링 회원가입. 무료로 시작하고 법령진단·안전관리 자동화를 경험하세요.">
  <title>회원가입 | TAI 엔지니어링</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="TAI Safe | 엑셀 없는 스마트 산업안전관리 플랫폼">
  <meta property="og:description" content="과태료 리스크 3분 만에 진단하세요. 1인 집중에서 전원 참여로 바꾸는 법령 기반 안전관리 시스템.">
  <meta property="og:image" content="https://taieng.co.kr/assets/img/og-image.png">
  <link rel="icon" href="assets/img/fevicon.png">
  <!-- 회원가입은 log-in.html#register 패널에 통합되어 있습니다 -->
  <script>
  (function () {
    var tail = '#register';
    try {
      var ref = document.referrer;
      if (ref) {
        var u = new URL(ref);
        if (u.origin === location.origin && !/(^|\/)log-in\.html$/i.test(u.pathname) && !/(^|\/)sign-up\.html$/i.test(u.pathname)) {
          tail = '?redirect=' + encodeURIComponent(u.pathname + u.search + u.hash) + tail;
        }
      }
    } catch (e) {}
    location.replace('log-in.html' + tail);
  })();
  </script>
</head>
<body></body>
</html>
