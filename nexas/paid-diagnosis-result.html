<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TAI 유료 법령진단 결과 — 전체 의무와 점검 일정을 웹에서 확인하세요.">
  <title>유료진단 결과 | TAI Safe</title>
  <link rel="icon" href="assets/img/fevicon.png">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/fontawesome.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --blue:#1e68e5; --blue-soft:#eff6ff; --line:#dbeafe; --text:#0f172a; --muted:#64748b; }
    body { font-family:'Noto Sans KR',sans-serif; color:var(--text); background:#f8fbff; }
    .heading-font{ font-family:'Outfit','Noto Sans KR',sans-serif; }
    .hero { background:linear-gradient(135deg,#dbeafe,#eff6ff); border:1px solid var(--line); border-radius:18px; padding:28px; }
    .risk-badge { background:#fee2e2; color:#991b1b; border-radius:999px; font-weight:800; padding:6px 14px; font-size:.8rem; }
    .sum-card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; height:100%; }
    .sum-card .v { font-size:1.6rem; font-weight:900; color:var(--blue); }
    .blk { background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px; margin-top:18px; }
    .blk h3 { font-size:1.08rem; font-weight:900; margin-bottom:14px; }
    .pill { background:var(--blue-soft); color:var(--blue); border-radius:999px; padding:3px 10px; font-size:.75rem; font-weight:700; }
    .table-wrap { overflow:auto; }
    table th { font-size:.8rem; color:var(--muted); white-space:nowrap; }
    table td { font-size:.84rem; vertical-align:top; }
    .sched-group { background:#f8fbff; border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
    .bridge { position:sticky; bottom:0; z-index:40; background:#fff; border-top:2px solid var(--line); box-shadow:0 -8px 24px rgba(30,104,229,.08); }
    .bridge table td, .bridge table th { font-size:.78rem; padding:.35rem .5rem; }
    .bridge .cta { background:var(--blue); border:none; color:#fff; border-radius:10px; padding:10px 16px; font-weight:800; }
    .pager button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:4px 10px; font-size:.8rem; }
  </style>
</head>
<body class="sc5">
<div id="tai-header"></div>

<div class="container py-4">
  <section class="hero">
    <div class="d-flex justify-content-between align-items-start gap-2 flex-wrap">
      <div>
        <h1 class="heading-font mb-2" id="heroTitle">사업장 법령진단 결과</h1>
        <p class="mb-0 text-muted">결제 완료된 전체 진단 결과입니다.</p>
      </div>
      <span class="risk-badge" id="riskBadge">RISK</span>
    </div>
  </section>

  <section class="row g-3 mt-1" id="summaryCards"></section>

  <section class="blk">
    <h3>핵심 의무 <span class="text-muted" id="koCount"></span></h3>
    <div class="accordion" id="keyAccordion"></div>
  </section>

  <section class="blk">
    <h3>법령별 의무</h3>
    <div class="accordion" id="lawAccordion"></div>
  </section>

  <section class="blk">
    <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap mb-2">
      <h3 class="mb-0">전체 의무 테이블</h3>
      <div class="d-flex gap-2">
        <input id="q" class="form-control form-control-sm" placeholder="법령/의무 검색" style="min-width:180px;">
        <select id="typeFilter" class="form-select form-select-sm"><option value="">유형 전체</option></select>
      </div>
    </div>
    <div class="table-wrap">
      <table class="table table-sm table-hover">
        <thead><tr><th>법령명</th><th>조문</th><th>의무요약</th><th>유형</th><th>점검주기</th><th>수행주체</th><th>제출기관</th></tr></thead>
        <tbody id="rulesBody"></tbody>
      </table>
    </div>
    <div class="d-flex justify-content-between align-items-center pager">
      <span class="text-muted" id="pageMeta"></span>
      <div class="d-flex gap-2"><button id="prevBtn">이전</button><button id="nextBtn">다음</button></div>
    </div>
  </section>

  <section class="blk">
    <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap">
      <h3 class="mb-0">점검 일정 미리보기</h3>
      <a id="pdfLink" class="btn btn-primary btn-sm" target="_blank">PDF 다운로드</a>
    </div>
    <div class="mt-3" id="scheduleList"></div>
  </section>

  <section class="blk">
    <h3>세금계산서 발급 요청</h3>
    <p class="text-muted mb-2">세금계산서가 필요하신가요?</p>
    <div class="row g-2">
      <div class="col-md-4"><input id="invoiceBizNo" class="form-control" placeholder="사업자등록번호"></div>
      <div class="col-md-4"><input id="invoiceCompany" class="form-control" placeholder="상호"></div>
      <div class="col-md-4"><input id="invoiceEmail" class="form-control" placeholder="수신 이메일"></div>
    </div>
    <button id="invoiceBtn" class="btn btn-outline-primary btn-sm mt-3">세금계산서 요청</button>
    <div class="text-muted small mt-2">요청 정보는 결제 레코드에 저장됩니다.</div>
  </section>
</div>

<section class="bridge py-2">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap mb-2">
      <strong class="heading-font">TAI Safe 전환 비교</strong>
      <button class="cta" id="trialBtn">14일 무료 체험 시작하기</button>
    </div>
    <table class="table table-sm mb-0">
      <thead><tr><th></th><th>엑셀 직접 관리</th><th>TAI Safe</th></tr></thead>
      <tbody>
      <tr><td>점검 일정</td><td>수동</td><td id="cmpSchedule">자동 생성</td></tr>
      <tr><td>업무 배분</td><td>전화/카톡</td><td>앱으로 자동</td></tr>
      <tr><td>미이행 추적</td><td>모름</td><td>자동 알림</td></tr>
      <tr><td>서류 보관</td><td>USB/폴더</td><td>클라우드 자동</td></tr>
      <tr><td>월 비용</td><td>0원 + 과태료 리스크</td><td id="cmpPrice">-</td></tr>
      </tbody>
    </table>
  </div>
</section>

<div id="tai-footer"></div>
<script src="assets/js/jquery.3.6.min.js"></script>
<script src="assets/js/bootstrap.min.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/header.js"></script>
<script src="assets/js/nav-auth.js"></script>
<script src="assets/js/footer.js"></script>
<script>
const API = "https://api.taieng.co.kr";
const token = new URLSearchParams(location.search).get("token") || "";
let allRules = [], filtered = [], page = 1; const size = 15;

function esc(v){ return (v ?? "").toString().replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }
function chunk(arr, n){ const out=[]; for(let i=0;i<arr.length;i+=n) out.push(arr.slice(i,i+n)); return out; }

function renderSummary(d){
  const s = d.summary || {};
  const cards = [
    ["적용 의무", s.total || 0],
    ["점검", s.inspection || 0],
    ["적용 법령", s.law_count || 0],
    ["위험등급", d.risk_level || "-"],
  ];
  document.getElementById("summaryCards").innerHTML = cards.map(([k,v]) => `<div class="col-6 col-lg-3"><div class="sum-card"><div class="text-muted small">${k}</div><div class="v">${esc(v)}</div></div></div>`).join("");
  document.getElementById("cmpSchedule").textContent = `자동 생성 (${s.inspection || 0}건 즉시)`;
}

function renderKeyObs(items){
  document.getElementById("koCount").textContent = `(${items.length}건)`;
  document.getElementById("keyAccordion").innerHTML = items.map((it,i)=>`
    <div class="accordion-item">
      <h2 class="accordion-header"><button class="accordion-button ${i?'collapsed':''}" data-bs-toggle="collapse" data-bs-target="#ko${i}">${esc(it.obligation_summary || it.summary || "의무")}</button></h2>
      <div id="ko${i}" class="accordion-collapse collapse ${i===0?'show':''}" data-bs-parent="#keyAccordion"><div class="accordion-body">
        <div class="mb-2"><span class="pill">${esc(it.obligation_type || "TYPE")}</span></div>
        <div>${esc(it.remarks || it.ai_reasoning || "")}</div>
      </div></div>
    </div>`).join("");
}

function renderLawGroups(groups){
  document.getElementById("lawAccordion").innerHTML = groups.map((g,i)=>`
    <div class="accordion-item">
      <h2 class="accordion-header"><button class="accordion-button ${i?'collapsed':''}" data-bs-toggle="collapse" data-bs-target="#law${i}">${esc(g.law_name)} <span class="ms-2 text-muted">(${g.count}건)</span></button></h2>
      <div id="law${i}" class="accordion-collapse collapse ${i===0?'show':''}" data-bs-parent="#lawAccordion"><div class="accordion-body">
        <ul class="mb-0">${(g.rules||[]).slice(0,20).map(r=>`<li>${esc(r.obligation_summary||r.summary||"-")}</li>`).join("")}</ul>
      </div></div>
    </div>`).join("");
}

function applyFilter(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const t = document.getElementById("typeFilter").value;
  filtered = allRules.filter(r => {
    const blob = `${r.law_name||""} ${r.law_article||""} ${r.obligation_summary||""}`.toLowerCase();
    if(q && !blob.includes(q)) return false;
    if(t && (r.obligation_type||"") !== t) return false;
    return true;
  });
  page = 1; renderTable();
}

function renderTable(){
  const pages = chunk(filtered, size); const list = pages[page-1] || [];
  document.getElementById("rulesBody").innerHTML = list.map(r => `<tr>
    <td>${esc(r.law_name||"-")}</td><td>${esc(r.law_article||r.article_no||"-")}</td><td>${esc(r.obligation_summary||"-")}</td>
    <td><span class="pill">${esc(r.obligation_type||"-")}</span></td><td>${esc(r.inspection_cycle||r.inspection_cycle_value||"-")}</td>
    <td>${esc(r.executor||r.appointment_target||"-")}</td><td>${esc(r.submit_org||r.submit_org_code||"-")}</td></tr>`).join("");
  document.getElementById("pageMeta").textContent = `${filtered.length}건 중 ${pages.length?`${page}/${pages.length}페이지`:"0/0페이지"}`;
  document.getElementById("prevBtn").disabled = page <= 1;
  document.getElementById("nextBtn").disabled = page >= pages.length;
}

function renderSchedule(schedule){
  const groups = {};
  Object.values(schedule || {}).forEach(arr => (arr||[]).forEach(it => {
    const key = it.cycle_label || it.cycle || "기타";
    if(!groups[key]) groups[key] = [];
    groups[key].push(it);
  }));
  document.getElementById("scheduleList").innerHTML = Object.entries(groups).map(([k,arr])=>`
    <div class="sched-group"><strong>${esc(k)}</strong> <span class="text-muted">(${arr.length}건)</span>
      <ul class="mb-0 mt-1">${arr.slice(0,30).map(x=>`<li>${esc(x.title||x.obligation_summary||x.rule_id||"점검 항목")}</li>`).join("")}</ul>
    </div>`).join("") || '<div class="text-muted">점검 일정 데이터가 없습니다.</div>';
}

async function load(){
  if(!token){ alert("token 파라미터가 없습니다."); return; }
  const res = await fetch(`${API}/diagnosis/paid-result/${encodeURIComponent(token)}`);
  if(!res.ok){ document.body.innerHTML = `<div class="container py-5"><h2>결과 조회 실패 (${res.status})</h2></div>`; return; }
  const j = await res.json(); const d = j.data || {};
  document.getElementById("heroTitle").textContent = `${d.company_name || "사업장"} 법령진단 결과`;
  document.getElementById("riskBadge").textContent = d.risk_level || "MEDIUM";
  document.getElementById("pdfLink").href = `${API}/diagnosis/report-pdf/${token}`;
  document.getElementById("invoiceBizNo").value = (d.input_data||{}).business_no || "";
  document.getElementById("cmpPrice").textContent = (d.recommended_plan||{}).price || "도입 상담";
  renderSummary(d);
  renderKeyObs(d.key_obligations || []);
  renderLawGroups(d.law_groups || []);
  allRules = d.rules_table || []; filtered = [...allRules];
  const types = [...new Set(allRules.map(x => x.obligation_type).filter(Boolean))];
  document.getElementById("typeFilter").innerHTML += types.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join("");
  renderTable();
  renderSchedule(d.inspection_schedule || {});
}

document.getElementById("q").addEventListener("input", applyFilter);
document.getElementById("typeFilter").addEventListener("change", applyFilter);
document.getElementById("prevBtn").addEventListener("click", ()=>{ page--; renderTable(); });
document.getElementById("nextBtn").addEventListener("click", ()=>{ page++; renderTable(); });
document.getElementById("trialBtn").addEventListener("click", ()=> location.href = "/service/saas.html");
document.getElementById("invoiceBtn").addEventListener("click", ()=> alert("세금계산서 요청이 접수되었습니다. (백엔드 연동 준비됨)"));

load();
</script>
</body>
</html>
