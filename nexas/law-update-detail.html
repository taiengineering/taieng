<script>
(function () {
  var SB_URL = 'https://vwlahtguyggrhvslabax.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3bGFodGd1eWdncmh2c2xhYmF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyOTE1OTYsImV4cCI6MjA5Mjg2NzU5Nn0.Yp6P7ahaCuna_gwYC8_S2KD081Ov9Fs65e9o_AenP48';
  var H = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function load() {
    var id = new URLSearchParams(location.search).get('id');
    var errEl = document.getElementById('tai-detail-error');
    var titleEl = document.getElementById('tai-detail-title');
    var metaEl = document.getElementById('tai-detail-meta');
    var bodyEl = document.getElementById('tai-detail-body');
    var grids = document.getElementById('tai-detail-grids');
    if (!id) {
      if (errEl) errEl.textContent = '잘못된 링크입니다.';
      return;
    }
    try {
      var res = await fetch(
        SB_URL + '/rest/v1/law_revision_board?id=eq.' + encodeURIComponent(id) + '&is_public=eq.true&select=*',
        { headers: H }
      );
      var rows = await res.json();
      if (!res.ok || !rows || !rows.length) throw new Error('법령 정보를 찾을 수 없습니다.');
      var r = rows[0];
      var title = r.law_name || '개정 법령';
      var sum = r.summary || (r.body ? String(r.body).slice(0, 500) : '') || title;
      if (typeof TAIDetailMeta !== 'undefined') TAIDetailMeta.setDetailMeta(title, sum);
      if (titleEl) titleEl.textContent = title;
      if (metaEl) metaEl.textContent = [r.law_type, r.revision_type, r.enforcement_date].filter(Boolean).join(' · ');
      var g = '';
      g += '<div class="row g-2 mb-3">';
      [['공포일', r.revision_date], ['시행일', r.enforcement_date], ['유형', r.law_type]].forEach(function (x) {
        g += '<div class="col-md-4"><div class="lu-box"><div class="lu-k">' + esc(x[0]) + '</div><div class="fw-bold">' + esc(x[1] || '-') + '</div></div></div>';
      });
      g += '</div>';
      if (grids) grids.innerHTML = g;
      var inner = '';
      if (r.body && String(r.body).trim()) inner += '<div class="lu-box tai-detail-body">' + esc(r.body) + '</div>';
      else if (r.summary && String(r.summary).trim()) inner += '<div class="lu-box tai-detail-body">' + esc(r.summary) + '</div>';
      if (r.source_url) inner += '<p><a class="btn btn-base btn-sm" href="' + esc(r.source_url) + '" target="_blank" rel="noopener">조문·출처 보기 →</a></p>';
      if (bodyEl) bodyEl.innerHTML = inner || '<p class="text-muted">본문이 없습니다.</p>';
    } catch (e) {
      if (errEl) errEl.textContent = e.message || '오류가 발생했습니다.';
      if (bodyEl) bodyEl.innerHTML = '';
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', load);
  else load();
})();
</script>
</body>
</html>
