<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | TAI 엔지니어링</title>
  <link rel="icon" href="assets/img/fevicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tai-main.css">
  <style>
  .auth-layout { min-height:calc(100vh - 64px); display:grid; grid-template-columns:1fr 1fr; }
  @media(max-width:768px){ .auth-layout { grid-template-columns:1fr; } .auth-bg { display:none; } }
  .auth-bg {
    background:linear-gradient(135deg,#0d1b2a,#1a3a5c);
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    padding:60px 48px; text-align:center;
  }
  .auth-bg h2 { font-size:2rem; font-weight:900; color:#fff; margin-bottom:12px; }
  .auth-bg p { color:rgba(255,255,255,.6); font-size:.9rem; line-height:1.7; }
  .auth-form-wrap { display:flex; flex-direction:column; justify-content:center; padding:60px 48px; background:#fff; }
  @media(max-width:768px){ .auth-form-wrap { padding:40px 24px; } }
  .auth-form-wrap h3 { font-size:1.5rem; font-weight:900; color:var(--navy); margin-bottom:6px; }
  .auth-form-wrap p { font-size:.88rem; color:var(--sub); margin-bottom:32px; }
  .form-label-tai { font-size:.83rem; font-weight:700; color:var(--navy); margin-bottom:6px; display:block; }
  .form-input-tai { width:100%; border:1.5px solid var(--border); border-radius:8px; padding:12px 14px; font-size:.9rem; color:var(--text); outline:none; transition:border-color .15s; background:#fff; font-family:inherit; margin-bottom:16px; }
  .form-input-tai:focus { border-color:var(--red); }
  .submit-btn { background:var(--red); color:#fff; font-weight:700; font-size:1rem; padding:13px; border-radius:8px; border:none; cursor:pointer; width:100%; margin-top:4px; transition:background .2s; }
  .submit-btn:hover { background:#c1121f; }
  .divider { display:flex; align-items:center; gap:12px; margin:20px 0; color:var(--sub); font-size:.8rem; }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }
  .social-btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:11px; border-radius:8px; border:1.5px solid var(--border); background:#fff; font-size:.88rem; font-weight:600; color:var(--text); cursor:pointer; margin-bottom:10px; transition:background .15s; }
  .social-btn:hover { background:var(--gray-bg); }
  .auth-links { display:flex; justify-content:space-between; margin-top:20px; font-size:.82rem; }
  .auth-links a { color:var(--sub); }
  .auth-links a:hover { color:var(--red); }
  </style>
</head>
<body>
<nav class="tai-nav">
  <div class="inner">
    <a href="index.html" class="logo"><img src="assets/img/tai-logo.png" alt="TAI"></a>
    <div class="nav-links">
      <a href="index-1.html">TAI SAFE</a><a href="index-2.html">TAI MANAGER</a><a href="index-3.html">TAI FIX</a><a href="index-4.html">TAI CARE</a><a href="index-5.html">안전정보</a>
      <span class="nav-sep">|</span>
      <a href="sign-up.html">회원가입</a>
      <a href="free-diagnosis.html" class="nav-cta">무료 진단</a>
    </div>
  </div>
</nav>

<div class="auth-layout">
  <div class="auth-bg">
    <img src="assets/img/tai-logo.png" alt="TAI" style="height:40px;margin-bottom:32px;">
    <h2>이걸 왜<br>몰랐지?</h2>
    <p>로그인하면 법령 진단 결과 이력, 점검 일정, 완료 기록을 모두 확인할 수 있습니다.</p>
    <div style="margin-top:40px; padding:20px; background:rgba(255,255,255,.07); border-radius:12px; border:1px solid rgba(255,255,255,.12);">
      <p style="color:rgba(255,255,255,.5); font-size:.75rem; margin-bottom:8px;">아직 계정이 없으신가요?</p>
      <a href="sign-up.html" style="color:#fff; font-weight:700; font-size:.9rem;">무료로 시작하기 →</a>
    </div>
  </div>
  <div class="auth-form-wrap">
    <h3>로그인</h3>
    <p>TAI 엔지니어링 계정으로 로그인하세요</p>
    <label class="form-label-tai">이메일</label>
    <input type="email" class="form-input-tai" placeholder="example@company.com">
    <label class="form-label-tai">비밀번호</label>
    <input type="password" class="form-input-tai" placeholder="비밀번호를 입력하세요">
    <button class="submit-btn">로그인</button>
    <div class="auth-links">
      <a href="#">비밀번호 찾기</a>
      <a href="sign-up.html">계정 만들기</a>
    </div>
    <div class="divider">또는</div>
    <div class="social-btn"><img src="https://www.google.com/favicon.ico" style="width:16px;height:16px;"> Google로 로그인</div>
    <div class="social-btn" style="background:#fee500;border-color:#fee500;"><img src="https://www.kakaocorp.com/favicon.ico" style="width:16px;height:16px;"> 카카오로 로그인</div>
  </div>
</div>
<script src="assets/js/nav-auth.js"></script>
</body></html>
