  <style>
  body { font-family: 'Noto Sans KR', sans-serif; }

  /* ── 로그인 페이지 전용: 헤더 항상 네이비 고정 ── */
  .navbar-area, .navbar-area.navbar-area-fixed {
    background: rgba(15, 43, 74, 0.97) !important;
    backdrop-filter: blur(8px);
    box-shadow: 0 2px 16px rgba(0,0,0,.15) !important;
  }
  .navbar-area .tai-logo-text, .navbar-area.navbar-area-fixed .tai-logo-text {
    color: #fff !important; text-shadow: 0 1px 4px rgba(0,0,0,.2) !important;
  }
  .navbar-area .navbar-nav > li > a, .navbar-area.navbar-area-fixed .navbar-nav > li > a {
    color: rgba(255,255,255,.85) !important;
  }
  .navbar-area .navbar-nav > li > a:hover, .navbar-area.navbar-area-fixed .navbar-nav > li > a:hover {
    color: #fff !important;
  }

  .auth-wrap { padding-top: 90px; min-height: 100vh; display: flex; flex-direction: column; }
  .auth-layout { flex: 1; display: grid; grid-template-columns: 1fr 1fr; }
  @media(max-width:768px) {
    .auth-wrap { padding-top: 70px; }
    .auth-layout { grid-template-columns: 1fr; }
    .auth-bg { display: none; }
  }

  /* ── 좌측 브랜드 패널 (로그인 전용 hero GIF + 메인 카피) ── */
  .auth-bg {
    background: linear-gradient(135deg, #0f2b4a, #1565c0);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 60px 48px; text-align: center;
  }
  .auth-logo {
    width: clamp(200px, 28vw, 320px);
    height: auto;
    margin-bottom: 40px;
    filter: drop-shadow(0 2px 12px rgba(0,0,0,.25));
  }
  .auth-bg h2 {
    font-size: clamp(1.6rem, 2.6vw, 2.2rem);
    font-weight: 900; color: #fff;
    line-height: 1.35; margin-bottom: 18px;
  }
  .auth-bg p {
    color: rgba(255,255,255,.78);
    font-size: 1rem; line-height: 1.7;
    max-width: 420px; margin: 0;
  }

  /* ── 우측 폼 패널 ── */
  .auth-form-wrap {
    display: flex; flex-direction: column; justify-content: center;
    padding: 60px 52px; background: #fff;
  }
  @media(max-width:768px){ .auth-form-wrap { padding: 40px 24px; } }

  .auth-title    { font-size: 1.6rem; font-weight: 900; color: #0f2b4a; margin-bottom: 6px; }
  .auth-subtitle { font-size: .88rem; color: #64748b; margin-bottom: 28px; }

  .form-label-tai { font-size: .83rem; font-weight: 700; color: #0f2b4a; margin-bottom: 5px; display: block; }
  .form-input-tai {
    width: 100%; border: 1.5px solid #e2e8f0; border-radius: 8px;
    padding: 11px 14px; font-size: .9rem; color: #0f172a;
    outline: none; transition: border-color .15s;
    background: #fff; font-family: inherit; margin-bottom: 14px;
  }
  .form-input-tai:focus { border-color: #1565c0; }
  .form-input-tai.is-error { border-color: #ef4444; margin-bottom: 4px; }

  .pw-wrap { position: relative; margin-bottom: 14px; }
  .pw-wrap .form-input-tai { margin-bottom: 0; padding-right: 44px; }
  .pw-toggle {
    position: absolute; top: 50%; right: 13px;
    transform: translateY(-50%); background: none; border: none; padding: 0;
    cursor: pointer; color: #64748b;
    display: flex; align-items: center; transition: color .15s;
  }
  .pw-toggle:hover { color: #0f2b4a; }
  .pw-toggle svg { width: 18px; height: 18px; }

  .submit-btn {
    background: #1565c0; color: #fff; font-weight: 700;
    font-size: 1rem; padding: 13px; border-radius: 8px;
    border: none; cursor: pointer; width: 100%;
    transition: background .2s; margin-top: 4px;
  }
  .submit-btn:hover    { background: #0f2b4a; }
  .submit-btn:disabled { background: #ccc; cursor: not-allowed; }

  .msg-box { border-radius: 8px; padding: 11px 14px; font-size: .84rem; margin-bottom: 14px; display: none; }
  .msg-box.error   { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
  .msg-box.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
  .msg-box.show    { display: block; }

  .form-hint     { font-size: .78rem; color: #64748b; margin-top: -10px; margin-bottom: 12px; }
  .required-star { color: #dc2626; }

  .auth-switch {
    text-align: center; font-size: .85rem; color: #64748b;
    margin-top: 20px; padding-top: 20px;
    border-top: 1px solid #e2e8f0;
  }
  .auth-switch a { color: #1565c0; font-weight: 700; }

  .field-error { font-size: .76rem; color: #ef4444; margin-top: 5px; margin-bottom: 8px; padding-left: 2px; display: none; }
  .field-error.show { display: block; }

  /* ── 간편 로그인 (네이버/카카오/구글) ── */
  .social-divider {
    display: flex; align-items: center; gap: 12px;
    margin: 22px 0 18px;
    color: #94a3b8; font-size: .78rem; font-weight: 500;
  }
  .social-divider::before, .social-divider::after {
    content: ''; flex: 1; height: 1px; background: #e2e8f0;
  }
  .social-buttons {
    display: flex; justify-content: center; gap: 16px;
  }
  .social-btn {
    width: 50px; height: 50px; border-radius: 50%;
    border: none; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, box-shadow .15s;
  }
  .social-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.12); }
  .social-btn svg { width: 22px; height: 22px; }
  .social-btn.naver  { background: #03C75A; }
  .social-btn.kakao  { background: #FEE500; }
  .social-btn.google { background: #fff; border: 1.5px solid #e2e8f0; }
  .social-btn.google:hover { border-color: #cbd5e1; }
  </style>
</head>

<script>
const API = 'https://taieng.co.kr/_api';

function taiIsAuthPagePath(pathname) {
  if (!pathname) return false;
  var p = String(pathname).toLowerCase();
  return /(^|\/)log-in\.html$/.test(p) || /(^|\/)sign-up\.html$/.test(p);
}
function taiSafeRedirectTarget(raw) {
  if (raw == null || typeof raw !== 'string') return null;
  var t = raw.trim();
  if (!t) return null;
  if (/^javascript:/i.test(t)) return null;
  if (/^\/\//.test(t)) return null;
  try {
    if (/^https?:\/\//i.test(t)) {
      var u = new URL(t);
      if (u.origin !== location.origin) return null;
      t = u.pathname + u.search + u.hash;
    }
  } catch (e) { return null; }
  var pathOnly = t.split('#')[0].split('?')[0];
  if (taiIsAuthPagePath(pathOnly)) return null;
  return t;
}
function taiRedirectFromReferrer() {
  try {
    var ref = document.referrer;
    if (!ref) return null;
    var u = new URL(ref);
    if (u.origin !== location.origin) return null;
    if (taiIsAuthPagePath(u.pathname)) return null;
    return u.pathname + u.search + u.hash;
  } catch (e2) { return null; }
}
function taiPostLoginTarget() {
  var params = new URLSearchParams(location.search);
  var fromQuery = taiSafeRedirectTarget(params.get('redirect'));
  if (fromQuery) return fromQuery;
  var fromStorage = null;
  try {
    fromStorage = taiSafeRedirectTarget(localStorage.getItem('postLoginRedirect'));
    if (fromStorage) localStorage.removeItem('postLoginRedirect');
  } catch (e) {}
  if (fromStorage) return fromStorage;
  return taiRedirectFromReferrer() || 'mypage/';
}
window.taiPostLoginTarget = taiPostLoginTarget;

function switchPanel(panel) {
  const isLogin = panel === 'login';
  document.getElementById('panel-login').style.display    = isLogin ? '' : 'none';
  document.getElementById('panel-register').style.display = isLogin ? 'none' : '';
  clearMsg();
  history.replaceState(null, '', '#' + panel);
  document.title = (isLogin ? '로그인' : '회원가입') + ' | TAI 엔지니어링';
}
(function(){
  if (location.hash.replace('#','') === 'register') switchPanel('register');
})();

function togglePw(inputId, btn) {
  const input = document.getElementById(inputId);
  const icons = btn.querySelectorAll('svg');
  const isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';
  icons[0].style.display = isHidden ? 'none' : '';
  icons[1].style.display = isHidden ? '' : 'none';
}

function showMsg(text, type) {
  const box = document.getElementById('msg-box');
  box.textContent = text;
  box.className = 'msg-box ' + type + ' show';
}
function clearMsg() {
  const box = document.getElementById('msg-box');
  box.className = 'msg-box';
  box.textContent = '';
}

function validateEmail() {
  const val = document.getElementById('reg-email').value.trim();
  if (!val) { setEmailError('이메일을 입력해 주세요.'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) {
    setEmailError('올바른 이메일 형식이 아닙니다. (예: example@company.com)');
  } else { clearEmailError(); }
}
function setEmailError(msg) {
  document.getElementById('reg-email').classList.add('is-error');
  const e = document.getElementById('email-error');
  e.textContent = '⚠ ' + msg; e.classList.add('show');
}
function clearEmailError() {
  document.getElementById('reg-email').classList.remove('is-error');
  const e = document.getElementById('email-error');
  e.classList.remove('show'); e.textContent = '';
}

function saveSession(data) {
  if (data.access_token)  localStorage.setItem('access_token',  data.access_token);
  if (data.refresh_token) localStorage.setItem('refresh_token', data.refresh_token);
  if (data.user) {
    const u = data.user;
    if (u.id)           localStorage.setItem('user_id',       u.id);
    if (u.name)         localStorage.setItem('user_name',     u.name);
    if (u.email)        localStorage.setItem('user_email',    u.email);
    if (u.role_code)    localStorage.setItem('role_code',     u.role_code);
    if (u.company_id)   localStorage.setItem('company_id',   u.company_id);
    if (u.company_name) localStorage.setItem('company_name', u.company_name);
  }
  localStorage.setItem('tai_session', '1');
}

async function doLogin() {
  const loginId = document.getElementById('login-id').value.trim();
  const pw      = document.getElementById('login-pw').value;
  clearMsg();
  if (!loginId || !pw) { showMsg('이메일(또는 휴대폰 번호)과 비밀번호를 입력해 주세요.', 'error'); return; }

  const isPhone = /^[0-9]{10,11}$/.test(loginId.replace(/-/g, ''));
  const body = isPhone
    ? { phone: loginId.replace(/-/g, ''), password: pw }
    : { email: loginId, password: pw };

  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = '로그인 중...';
  try {
    const res = await fetch(API + '/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await res.json();
    if (!res.ok) { showMsg(d.detail || '입력 정보가 올바르지 않습니다.', 'error'); return; }
    saveSession(d.data || d);
    location.href = taiPostLoginTarget();
  } catch(e) {
    showMsg('서버 연결에 실패했습니다. 잠시 후 다시 시도해 주세요.', 'error');
  } finally {
    btn.disabled = false; btn.textContent = '로그인';
  }
}

async function doRegister() {
  const name  = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const phone = document.getElementById('reg-phone').value.replace(/[^0-9]/g, '');
  const pw    = document.getElementById('reg-pw').value;
  const pw2   = document.getElementById('reg-pw2').value;
  const agree = document.getElementById('reg-agree').checked;
  clearMsg();

  if (!name)  { showMsg('이름을 입력해 주세요.', 'error'); return; }
  if (!email) { setEmailError('이메일을 입력해 주세요.'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setEmailError('올바른 이메일 형식이 아닙니다.'); return; }
  if (!phone || phone.length < 10) { showMsg('올바른 휴대폰 번호를 입력해 주세요.', 'error'); return; }
  if (pw.length < 8)  { showMsg('비밀번호는 8자 이상이어야 합니다.', 'error'); return; }
  if (pw !== pw2)     { showMsg('비밀번호가 일치하지 않습니다.', 'error'); return; }
  if (!agree)         { showMsg('이용약관 및 개인정보처리방침에 동의해 주세요.', 'error'); return; }

  const btn = document.getElementById('btn-reg');
  btn.disabled = true; btn.textContent = '가입 중...';
  try {
    const res = await fetch(API + '/auth/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, phone, password: pw })
    });
    const d = await res.json();
    if (!res.ok) {
      const detail = d.detail;
      if (typeof detail === 'string') showMsg(detail, 'error');
      else if (Array.isArray(detail)) showMsg(detail.map(e=>e.msg).join(', '), 'error');
      else showMsg('회원가입에 실패했습니다. 입력 정보를 확인해 주세요.', 'error');
      return;
    }
    saveSession(d.data || d);
    showMsg('🎉 가입이 완료되었습니다! 이동합니다...', 'success');
    setTimeout(() => { location.href = taiPostLoginTarget(); }, 1200);
  } catch(e) {
    showMsg('서버 연결에 실패했습니다. 잠시 후 다시 시도해 주세요.', 'error');
  } finally {
    btn.disabled = false; btn.textContent = '회원가입';
  }
}

function showForgot(e) {
  e.preventDefault();
  showMsg('비밀번호 재설정 메일을 발송합니다.', 'success');
}

// ── OAuth 콜백 처리 (카카오 로그인 후 리다이렉트 시) ──
(async function handleOAuthCallback() {
  if (!_sb) return;
  if (!location.hash || !location.hash.includes('access_token')) return;
  try {
    const { data: { session }, error } = await _sb.auth.getSession();
    if (error || !session) return;
    // Supabase 세션을 기존 localStorage 키에 저장
    localStorage.setItem('access_token', session.access_token);
    if (session.refresh_token) localStorage.setItem('refresh_token', session.refresh_token);
    if (session.user) {
      const u = session.user;
      if (u.id) localStorage.setItem('user_id', u.id);
      const meta = u.user_metadata || {};
      if (meta.name || meta.full_name) localStorage.setItem('user_name', meta.name || meta.full_name);
      if (u.email) localStorage.setItem('user_email', u.email);
    }
    localStorage.setItem('tai_session', '1');
    location.href = taiPostLoginTarget();
  } catch(e) { console.error('OAuth callback error:', e); }
})();
</script>
