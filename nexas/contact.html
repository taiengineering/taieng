<meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/summernote/0.8.20/summernote-lite.min.css">
  <style>
  body { font-family: 'Noto Sans KR', sans-serif; }
  .contact-hero { background:var(--navy); padding:100px 0 50px; }
  .contact-hero h1 { font-size:clamp(1.8rem,3.5vw,2.6rem); font-weight:900; color:#fff; margin-bottom:10px; }
  .contact-hero p { color:rgba(255,255,255,.7); font-size:.95rem; margin-bottom:0; }
  .form-label-tai { font-size:.83rem; font-weight:700; color:var(--navy); margin-bottom:6px; display:block; }
  .form-label-opt { font-size:.76rem; color:var(--sub); font-weight:500; margin-left:4px; }
  .form-input-tai { width:100%; border:1.5px solid var(--border); border-radius:8px; padding:11px 14px; font-size:.9rem; color:var(--text); outline:none; transition:border-color .15s; background:#fff; font-family:inherit; }
  .form-input-tai:focus { border-color:var(--red); }
  .form-row { margin-bottom:18px; }

  /* 문의 분야 버튼 그리드 */
  .contact-type-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:4px; }
  @media(max-width:720px){ .contact-type-grid { grid-template-columns:repeat(3,1fr); } }
  @media(max-width:480px){ .contact-type-grid { grid-template-columns:1fr 1fr; } }
  .ctype-btn { border:1.5px solid var(--border); border-radius:10px; padding:14px 8px; text-align:center; cursor:pointer; transition:all .15s; font-size:.78rem; font-weight:600; color:var(--sub); background:#fff; user-select:none; line-height:1.35; }
  .ctype-btn-icon { font-size:1.5rem; display:block; margin-bottom:6px; line-height:1; }
  .ctype-btn:hover { border-color:var(--red); background:#fff9f9; }
  .ctype-btn.selected { border-color:var(--red); color:var(--red); background:#fff9f9; box-shadow:0 2px 8px rgba(192,57,43,.12); }

  /* 첨부파일 영역 */
  .file-input-wrap { border:1.5px dashed var(--border); border-radius:8px; padding:18px 14px; text-align:center; cursor:pointer; transition:all .15s; background:#fafafa; display:block; margin-bottom:0; }
  .file-input-wrap:hover { border-color:var(--red); background:#fff9f9; }
  .file-input-wrap input[type=file] { display:none; }
  .file-input-label { font-size:.85rem; color:var(--sub); font-weight:600; }
  .file-input-label i { margin-right:8px; color:var(--red); }
  .attach-file-list { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
  .attach-file-chip { display:inline-flex; align-items:center; gap:6px; background:#eef2ff; color:#3730a3; border-radius:6px; padding:5px 12px; font-size:.78rem; font-weight:500; }

  /* Summernote 통합 */
  .note-editor.note-frame { border:1.5px solid var(--border); border-radius:8px; }
  .note-editor.note-frame:focus-within { border-color:var(--red); }
  .note-editor .note-toolbar { background:var(--gray-bg); border-bottom:1px solid var(--border); }
  .note-editor .note-editing-area .note-editable { font-family:'Noto Sans KR',sans-serif; font-size:.92rem; color:var(--text); padding:14px; }
  .note-editor .note-placeholder { color:#94a3b8; font-size:.92rem; padding:14px; }
  .note-editor .note-statusbar { background:var(--gray-bg); }

  .submit-btn { background:var(--red); color:#fff; font-weight:700; font-size:1rem; padding:14px; border-radius:8px; border:none; cursor:pointer; width:100%; transition:background .2s; }
  .submit-btn:hover { background:#c1121f; }

  /* 연락처 정보 카드 (로고 비침 효과 — 카드 내부 우측 하단 200px, 잘리지 않게) */
  .contact-info-card { background:var(--navy); border-radius:14px; padding:28px; color:#fff; margin-bottom:16px; position:relative; overflow:hidden; min-height:380px; }
  .contact-info-card::before {
    content:''; position:absolute; right:20px; bottom:20px; width:200px; height:200px;
    background-image:url('/logo-512.png');
    background-size:contain; background-repeat:no-repeat; background-position:center;
    opacity:0.10; pointer-events:none; z-index:0;
  }
  .contact-info-card > * { position:relative; z-index:1; }
  .ci-item { display:flex; gap:14px; align-items:flex-start; margin-bottom:20px; }
  .ci-item:last-child { margin-bottom:0; }
  .ci-icon { width:36px; height:36px; border-radius:8px; background:rgba(255,255,255,.1); color:#fff; display:flex; align-items:center; justify-content:center; font-size:.9rem; flex-shrink:0; }
  .ci-item strong { font-size:.85rem; font-weight:700; display:block; margin-bottom:4px; }
  .ci-item span { font-size:.82rem; color:rgba(255,255,255,.7); line-height:1.55; }

  /* 빠른 링크 */
  .quick-links { background:var(--gray-bg); border-radius:14px; padding:24px; }
  .quick-links h5 { font-size:.9rem; font-weight:800; color:var(--navy); margin-bottom:14px; }
  .ql-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); font-size:.85rem; }
  .ql-item:last-child { border-bottom:none; }
  .ql-item a { color:var(--sub); transition:color .15s; }
  .ql-item a:hover { color:var(--red); }
  </style>
</head>
<body class="sc5">
<div class="preloader" id="preloader"><div class="preloader-inner"><div class="spinner"><div class="dot1"></div><div class="dot2"></div></div></div></div>
<div class="body-overlay" id="body-overlay"></div>

<div id="tai-header"></div>

<div class="contact-hero">
  <div class="sec-inner">
    <h1>어떤 도움이 필요하세요?</h1>
    <p>빠른 답변 드리겠습니다.</p>
  </div>
</div>

<section class="sec" style="background:var(--gray-bg);">
  <div class="sec-inner">
    <div class="row g-5">
      <div class="col-lg-7">
        <form id="contactMarketingForm" style="background:#fff;border-radius:16px;padding:36px;box-shadow:0 2px 14px rgba(0,0,0,.06);">
          <h3 style="font-size:1.2rem;font-weight:900;color:var(--navy);margin-bottom:22px;">문의 작성</h3>

          <div class="form-row">
            <label class="form-label-tai">문의 분야 <span style="color:var(--red);">*</span></label>
            <input type="hidden" id="contactCategory" name="contactCategory">
            <div class="contact-type-grid">
              <div class="ctype-btn" data-value="introduction"><span class="ctype-btn-icon">🛡️</span>TAI Safe<br>도입</div>
              <div class="ctype-btn" data-value="diagnosis"><span class="ctype-btn-icon">📋</span>법령진단<br>문의</div>
              <div class="ctype-btn" data-value="tech"><span class="ctype-btn-icon">🔧</span>기술<br>지원</div>
              <div class="ctype-btn" data-value="partner"><span class="ctype-btn-icon">🤝</span>제휴<br>파트너</div>
              <div class="ctype-btn" data-value="etc"><span class="ctype-btn-icon">💬</span>기타<br>문의</div>
            </div>
          </div>

          <div class="form-row">
            <label class="form-label-tai">성함 <span style="color:var(--red);">*</span></label>
            <input type="text" id="contactName" class="form-input-tai" placeholder="홍길동" required>
          </div>

          <div class="row g-3">
            <div class="col-md-6 form-row">
              <label class="form-label-tai">이메일 <span style="color:var(--red);">*</span></label>
              <input type="email" id="contactEmail" class="form-input-tai" placeholder="example@company.com" required>
            </div>
            <div class="col-md-6 form-row">
              <label class="form-label-tai">연락처 <span style="color:var(--red);">*</span></label>
              <input type="tel" id="contactPhone" class="form-input-tai" placeholder="010-0000-0000" required>
            </div>
          </div>

          <div class="form-row">
            <label class="form-label-tai">회사명<span class="form-label-opt">(선택)</span></label>
            <input type="text" id="contactCompany" class="form-input-tai" placeholder="(주)TAI엔지니어링">
          </div>

          <div class="form-row">
            <label class="form-label-tai">제목<span class="form-label-opt">(선택)</span></label>
            <input type="text" id="contactTitle" class="form-input-tai" maxlength="500" placeholder="제목이 없으면 비워 두셔도 됩니다">
          </div>

          <div class="form-row">
            <label class="form-label-tai">문의 내용 <span style="color:var(--red);">*</span></label>
            <textarea id="contactContent" name="contactContent"></textarea>
          </div>

          <div class="form-row">
            <label class="form-label-tai">첨부파일<span class="form-label-opt">(선택 · 최대 5개 · 각 10MB 이하)</span></label>
            <label class="file-input-wrap" for="contactAttachments">
              <input type="file" id="contactAttachments" name="attachments" multiple accept=".pdf,.jpg,.jpeg,.png,.gif,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.txt,.hwp">
              <span class="file-input-label"><i class="fas fa-paperclip"></i>파일 선택 (PDF · 이미지 · 문서 · 압축 등)</span>
            </label>
            <div class="attach-file-list" id="attachFileList"></div>
          </div>

          <label style="display:flex;gap:8px;align-items:flex-start;font-size:.8rem;color:var(--sub);margin-bottom:20px;cursor:pointer;">
            <input type="checkbox" id="contactAgree" style="margin-top:2px;" required>
            <span>개인정보 수집 및 이용에 동의합니다. <a href="privacy.html" style="color:var(--red);">개인정보처리방침</a></span>
          </label>
          <button type="submit" class="submit-btn" id="contactSubmitBtn">문의 접수하기</button>
        </form>
      </div>
      <div class="col-lg-5">
        <div class="contact-info-card">
          <h4 style="font-weight:800;color:#fff;margin-bottom:20px;">연락처 정보</h4>
          <div class="ci-item"><div class="ci-icon"><i class="fas fa-phone"></i></div><div><strong>전화</strong><span>070-8080-1858<br>평일 09:00 ~ 18:00</span></div></div>
          <div class="ci-item"><div class="ci-icon"><i class="fas fa-fax"></i></div><div><strong>팩스</strong><span>0504-845-8888</span></div></div>
          <div class="ci-item"><div class="ci-icon"><i class="fas fa-envelope"></i></div><div><strong>이메일</strong><span>tai@taieng.co.kr<br>영업일 1일 이내 회신</span></div></div>
          <div class="ci-item"><div class="ci-icon"><i class="fas fa-map-marker-alt"></i></div><div><strong>주소</strong><span>서울특별시 강남구<br>테헤란로79길 6 JS타워 3층 브이1314</span></div></div>
        </div>
        <div class="quick-links">
          <h5>빠른 링크</h5>
          <div class="ql-item"><span>무료 법령 진단</span><a href="free-diagnosis.html">진단 시작 →</a></div>
          <div class="ql-item"><span>자주하는 질문</span><a href="faq.html">FAQ 보기 →</a></div>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="tai-footer"></div>
<div class="back-to-top"><span class="back-top"><i class="fas fa-angle-double-up"></i></span></div>
<script src="assets/js/jquery.3.6.min.js"></script>
<script src="assets/js/bootstrap.min.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/header.js"></script>
<script src="assets/js/nav-auth.js"></script>
<script src="assets/js/footer.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/summernote/0.8.20/summernote-lite.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/summernote/0.8.20/lang/summernote-ko-KR.min.js"></script>
<script>
$(document).ready(function() {
  $('#contactContent').summernote({
    lang: 'ko-KR',
    height: 240,
    placeholder: '편하게 작성해주세요. 무엇이든 말씀해 주시면 도와드립니다.',
    toolbar: [
      ['style', ['bold', 'italic', 'underline', 'clear']],
      ['para', ['ul', 'ol', 'paragraph']],
      ['insert', ['link']],
      ['view', ['codeview']]
    ],
    callbacks: {
      onImageUpload: function() {
        alert('이미지는 아래 첨부파일 영역에서 업로드해 주세요.');
      },
      onChange: function(contents) {
        $('#contactContent').val(contents);
      }
    }
  });

  document.querySelectorAll('.ctype-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.ctype-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      const hidden = document.getElementById('contactCategory');
      if (hidden) hidden.value = btn.dataset.value;
    });
    btn.setAttribute('tabindex', '0');
    btn.setAttribute('role', 'button');
    btn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); btn.click(); }
    });
  });

  const MAX_FILES = 5;
  const MAX_SIZE = 10 * 1024 * 1024;
  const fileInput = document.getElementById('contactAttachments');
  const fileList = document.getElementById('attachFileList');
  if (fileInput) {
    fileInput.addEventListener('change', function(e) {
      const files = Array.from(e.target.files || []);
      if (files.length > MAX_FILES) {
        alert(`첨부파일은 최대 ${MAX_FILES}개까지 가능합니다.`);
        e.target.value = ''; if (fileList) fileList.innerHTML = ''; return;
      }
      for (const f of files) {
        if (f.size > MAX_SIZE) {
          alert(`"${f.name}" 파일이 10MB를 초과합니다.`);
          e.target.value = ''; if (fileList) fileList.innerHTML = ''; return;
        }
      }
      if (fileList) {
        fileList.innerHTML = files.map(f =>
          `<span class="attach-file-chip"><i class="fas fa-paperclip"></i>${f.name} <span style="opacity:.7;">(${(f.size/1024/1024).toFixed(2)}MB)</span></span>`
        ).join('');
      }
    });
  }

  const form = document.getElementById('contactMarketingForm');
  if (form) {
    form.addEventListener('submit', function(e) {
      const cat = document.getElementById('contactCategory');
      if (cat && !cat.value) {
        e.preventDefault(); e.stopImmediatePropagation();
        alert('문의 분야를 선택해 주세요.');
        document.querySelector('.contact-type-grid')?.scrollIntoView({behavior:'smooth', block:'center'});
        return false;
      }
      const html = $('#contactContent').summernote('code') || '';
      const stripped = html.replace(/<[^>]*>/g, '').replace(/&nbsp;/g, '').trim();
      if (!stripped) {
        e.preventDefault(); e.stopImmediatePropagation();
        alert('문의 내용을 입력해 주세요.');
        $('#contactContent').summernote('focus');
        return false;
      }
      document.getElementById('contactContent').value = html;
    }, true);
  }
});
</script>
</body></html>
