<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>법령 조문 — TAI</title>
  <link rel="icon" href="assets/img/fevicon.png">
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/tai-brand.css">
  <link rel="stylesheet" href="assets/css/tai-main.css">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #fff;
      --line: #e2e8f0;
      --text: #0f172a;
      --sub: #64748b;
      --primary: #2b2d42;
      --accent: #7367f0;
      --radius: 16px;
      --shadow: 0 4px 24px rgba(15,23,42,.07);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);}
    .wrap{max-width:860px;margin:0 auto;padding:40px 20px 80px;}

    /* 헤더 */
    .law-header{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px 32px;margin-bottom:24px;box-shadow:var(--shadow);}
    .law-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);text-decoration:none;margin-bottom:16px;}
    .law-back:hover{color:var(--accent);}
    .law-badge{display:inline-block;background:#ede9fe;color:#5b21b6;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;margin-bottom:10px;}
    .law-name{font-size:26px;font-weight:800;line-height:1.3;margin-bottom:12px;}
    .law-meta{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--sub);}
    .law-meta span{display:flex;align-items:center;gap:4px;}
    .law-meta strong{color:var(--text);font-weight:600;}

    /* 검색 */
    .search-bar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:10px;}
    .search-bar input{border:none;outline:none;width:100%;font-size:14px;background:transparent;color:var(--text);}
    .search-bar svg{flex-shrink:0;color:var(--sub);}

    /* 조문 목록 */
    .article-list{display:flex;flex-direction:column;gap:12px;}
    .article-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
    .article-head{padding:16px 20px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;}
    .article-head:hover{background:#f8fafc;}
    .article-no{flex-shrink:0;background:var(--primary);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;margin-top:2px;}
    .article-title-text{font-size:15px;font-weight:700;line-height:1.5;flex:1;}
    .article-toggle{flex-shrink:0;color:var(--sub);transition:transform .2s;font-size:18px;margin-top:1px;}
    .article-body{padding:0 20px 20px;display:none;}
    .article-body.open{display:block;}
    .article-text{font-size:14px;line-height:1.8;color:#334155;white-space:pre-wrap;background:#f8fafc;border-radius:10px;padding:14px 16px;margin-top:4px;}
    .paragraph-list{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
    .paragraph-item{font-size:14px;line-height:1.7;color:#475569;padding:8px 12px;border-left:3px solid #e2e8f0;border-radius:0 6px 6px 0;}
    .paragraph-no{font-weight:700;color:var(--primary);margin-right:4px;}

    /* 상태 */
    .state-box{text-align:center;padding:60px 20px;color:var(--sub);}
    .state-box h3{font-size:18px;margin-bottom:8px;color:var(--text);}
    .spinner{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px;}
    @keyframes spin{to{transform:rotate(360deg);}

    .highlight{background:#fef08a;border-radius:3px;padding:1px 0;}

    @media(max-width:600px){
      .law-name{font-size:20px;}
      .law-header{padding:20px;}
      .wrap{padding:20px 14px 60px;}
    }
  </style>
</head>
<body>
<div class="wrap">
  <!-- 헤더 영역 -->
  <div class="law-header" id="lawHeader">
    <a href="law-updates.html" class="law-back">
      &#8592; 개정법령 목록으로
    </a>
    <div id="lawBadge" class="law-badge">법령</div>
    <div class="law-name" id="lawName">법령 조문을 불러오는 중...</div>
    <div class="law-meta" id="lawMeta"></div>
  </div>

  <!-- 검색 -->
  <div class="search-bar">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="searchInput" type="text" placeholder="조문 번호나 내용으로 검색..." oninput="filterArticles()" />
  </div>

  <!-- 조문 목록 -->
  <div id="articleList" class="article-list">
    <div class="state-box">
      <div class="spinner"></div>
      <h3>조문 불러오는 중</h3>
      <p>잠시만 기다려 주세요.</p>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://vwlahtguyggrhvslabax.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhudGRrcmpoZ2NzY21xY3RkenlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNzM5NjksImV4cCI6MjA4ODY0OTk2OX0.VUe805Y1s4il1RgY1KV94xUw6F3YD7_to46yUIaQrBE';
const HDR  = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };

const params   = new URLSearchParams(location.search);
const lawId    = params.get('id');   // law_master.id (uuid)
const lawMstNo = params.get('mst');  // law_master.law_mst_no

let allArticles = [];
let allParagraphs = {}; // article_id → []

async function sbGet(path) {
  const r = await fetch(SB_URL + '/rest/v1/' + path, { headers: HDR });
  return r.json();
}

async function loadLaw() {
  // 1. law_master 조회
  let masterQuery = 'law_master?select=id,law_name,law_type_code,law_mst_no,law_number,enforcement_date,announcement_date,ministry_name&is_active=eq.true';
  if (lawId)    masterQuery += '&id=eq.' + encodeURIComponent(lawId);
  if (lawMstNo) masterQuery += '&law_mst_no=eq.' + encodeURIComponent(lawMstNo);
  masterQuery += '&limit=1';

  const masters = await sbGet(masterQuery);
  if (!masters || !masters.length) {
    document.getElementById('articleList').innerHTML = '<div class="state-box"><h3>법령을 찾을 수 없습니다.</h3><p>올바른 법령 ID를 확인해 주세요.</p></div>';
    return;
  }
  const m = masters[0];
  document.title = m.law_name + ' 조문 — TAI';

  // 헤더 렌더
  const typeLabel = { LAW:'법률', ENFORCEMENT_DECREE:'시행령', ENFORCEMENT_RULE:'시행규칙', ADMINISTRATIVE_RULE:'행정규칙' };
  document.getElementById('lawBadge').textContent = typeLabel[m.law_type_code] || m.law_type_code;
  document.getElementById('lawName').textContent  = m.law_name;
  document.getElementById('lawMeta').innerHTML = [
    m.law_number ? `<span>법령번호 <strong>${m.law_number}</strong></span>` : '',
    m.ministry_name ? `<span>소관 <strong>${m.ministry_name}</strong></span>` : '',
    m.enforcement_date ? `<span>시행일 <strong>${m.enforcement_date}</strong></span>` : '',
  ].filter(Boolean).join('');

  // 2. 현재 버전 조회
  const versions = await sbGet('law_version?law_id=eq.' + m.id + '&is_current=eq.true&select=id&limit=1');
  if (!versions || !versions.length) {
    document.getElementById('articleList').innerHTML = '<div class="state-box"><h3>조문 데이터 없음</h3><p>해당 법령의 조문이 아직 수집되지 않았습니다.</p></div>';
    return;
  }
  const versionId = versions[0].id;

  // 3. 조문 목록 조회
  const articles = await sbGet('law_article?law_version_id=eq.' + versionId + '&select=id,article_no,article_sub_no,article_no_sort,article_type,article_title,article_text&order=article_no_sort&limit=1000');
  allArticles = Array.isArray(articles) ? articles : [];

  if (!allArticles.length) {
    document.getElementById('articleList').innerHTML = '<div class="state-box"><h3>등록된 조문이 없습니다.</h3></div>';
    return;
  }

  // 4. 항(paragraph) 조회 — 배치로
  const articleIds = allArticles.map(a => a.id);
  const paras = await sbGet('law_paragraph?article_id=in.(' + articleIds.join(',') + ')&select=id,article_id,paragraph_no,paragraph_text&order=paragraph_no_sort&limit=5000');
  (paras || []).forEach(p => {
    if (!allParagraphs[p.article_id]) allParagraphs[p.article_id] = [];
    allParagraphs[p.article_id].push(p);
  });

  renderArticles(allArticles);
}

function renderArticles(articles) {
  if (!articles.length) {
    document.getElementById('articleList').innerHTML = '<div class="state-box"><h3>검색 결과 없음</h3></div>';
    return;
  }
  document.getElementById('articleList').innerHTML = articles.map(a => {
    const paras = allParagraphs[a.id] || [];
    const paraHtml = paras.length
      ? '<div class="paragraph-list">' + paras.map(p =>
          `<div class="paragraph-item"><span class="paragraph-no">${p.paragraph_no || ''}</span>${escape(p.paragraph_text || '')}</div>`
        ).join('') + '</div>'
      : '';
    const bodyContent = (a.article_text
      ? `<div class="article-text">${escape(a.article_text)}</div>`
      : '') + paraHtml;
    const noLabel = a.article_no ? '제' + a.article_no + '조' + (a.article_sub_no ? '의' + a.article_sub_no : '') : '';
    return `<div class="article-card" data-search="${(noLabel + ' ' + (a.article_title||'') + ' ' + (a.article_text||'')).toLowerCase()}">
      <div class="article-head" onclick="toggleArticle(this)">
        <span class="article-no">${noLabel}</span>
        <span class="article-title-text">${escape(a.article_title || '(제목 없음)')}</span>
        <span class="article-toggle">+</span>
      </div>
      <div class="article-body">${bodyContent || '<p style="color:#94a3b8;font-size:13px">조문 내용 없음</p>'}</div>
    </div>`;
  }).join('');
}

function escape(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleArticle(head) {
  const body   = head.nextElementSibling;
  const toggle = head.querySelector('.article-toggle');
  const isOpen = body.classList.toggle('open');
  toggle.textContent = isOpen ? '−' : '+';
}

function filterArticles() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!q) { renderArticles(allArticles); return; }
  const filtered = allArticles.filter(a => {
    const text = ('제' + (a.article_no||'') + '조 ' + (a.article_title||'') + ' ' + (a.article_text||'')).toLowerCase();
    return text.includes(q);
  });
  renderArticles(filtered);
  // 검색 결과 자동 펼침
  if (q) {
    document.querySelectorAll('.article-card').forEach(card => {
      const body = card.querySelector('.article-body');
      const toggle = card.querySelector('.article-toggle');
      body.classList.add('open');
      toggle.textContent = '−';
    });
  }
}

if (!lawId && !lawMstNo) {
  document.getElementById('articleList').innerHTML = '<div class="state-box"><h3>법령 ID가 없습니다.</h3><p>URL에 ?id= 파라미터가 필요합니다.</p></div>';
} else {
  loadLaw();
}
</script>
</body>
</html>
