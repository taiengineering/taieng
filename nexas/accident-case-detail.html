    body { font-family: 'Noto Sans KR', sans-serif; }

<body class="sc5">
<div class="preloader" id="preloader"><div class="preloader-inner"><div class="spinner"><div class="dot1"></div><div class="dot2"></div></div></div></div>
<div class="body-overlay" id="body-overlay"></div>
<div id="tai-header"></div>

<section class="service-area default-pd-top pd-bottom-100">
  <div class="container">
    <nav aria-label="breadcrumb" class="mb-4">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a href="index.html">홈</a></li>
        <li class="breadcrumb-item"><a href="accident-cases.html">재해사례</a></li>
        <li class="breadcrumb-item active" aria-current="page">상세</li>
      </ol>
    </nav>
    <div class="tai-detail-article">
      <p class="text-danger small mb-3" id="tai-detail-error"></p>
      <h1 class="title mb-3" id="tai-detail-title">불러오는 중…</h1>
      <p class="text-muted small mb-4" id="tai-detail-meta"></p>
      <div class="tai-detail-body" id="tai-detail-body"></div>
      <div class="tai-detail-cta mt-5 p-4" style="background:linear-gradient(135deg,#450a0a,#991b1b);color:#fff;">
        <h3 class="h5 mb-2 fw-bold">3분 무료 법령진단</h3>
        <p class="small mb-3" style="opacity:.85;">비로그인으로 우리 사업장 의무를 빠르게 확인해 보세요.</p>
        <a href="free-diagnosis.html" class="btn btn-light btn-sm fw-bold">무료 법령진단 시작 →</a>

<div id="tai-footer"></div>
<div class="back-to-top"><span class="back-top"><i class="fas fa-angle-double-up"></i></span></div>

<script src="assets/js/jquery.3.6.min.js"></script>
<script src="assets/js/bootstrap.min.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/header.js"></script>
<script src="assets/js/nav-auth.js"></script>
<script src="assets/js/footer.js"></script>
<script src="assets/js/tai-detail-meta.js"></script>
<script>
(function () {
  var SB = 'https://vwlahtguyggrhvslabax.supabase.co/rest/v1';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3bGFodGd1eWdncmh2c2xhYmF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyOTE1OTYsImV4cCI6MjA5Mjg2NzU5Nn0.Yp6P7ahaCuna_gwYC8_S2KD081Ov9Fs65e9o_AenP48';
  var H = { apikey: KEY, Authorization: 'Bearer ' + KEY };

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function load() {
    var params = new URLSearchParams(location.search);
    var id = params.get('id');
    var tab = params.get('tab') === 'construction' ? 'construction' : 'domestic';
    var errEl = document.getElementById('tai-detail-error');
    var titleEl = document.getElementById('tai-detail-title');
    var metaEl = document.getElementById('tai-detail-meta');
    var bodyEl = document.getElementById('tai-detail-body');
    if (!id) {
      if (errEl) errEl.textContent = '잘못된 링크입니다.';
      return;
    }
    try {
      if (tab === 'domestic') {
        var res = await fetch(SB + '/kosha_accident_cases?id=eq.' + encodeURIComponent(id) + '&select=*', { headers: H });
        var rows = await res.json();
        if (!res.ok || !rows || !rows.length) throw new Error('사례를 찾을 수 없습니다.');
        var d = rows[0];
        var title = d.title || '재해사례';
        var metaSum = title;
        if (typeof TAIDetailMeta !== 'undefined') TAIDetailMeta.setDetailMeta(title, metaSum);
        if (metaEl) {
          metaEl.innerHTML = [d.reg_dt, d.board_no ? 'No.' + esc(d.board_no) : ''].filter(Boolean).join(' · ');
        }
        if (titleEl) titleEl.textContent = title;
        var body = '<p class="text-muted small mb-3">본 데이터는 한국산업안전보건공단 공개 자료를 기반으로 합니다.</p>';
        body += '<p><a class="btn btn-base btn-sm" href="https://portal.kosha.or.kr/" target="_blank" rel="noopener">KOSHA 포털에서 원문 확인 →</a></p>';
        if (bodyEl) bodyEl.innerHTML = body;
      } else {
        var res2 = await fetch(SB + '/kosha_construction_accidents?id=eq.' + encodeURIComponent(id) + '&select=*', { headers: H });
        var rows2 = await res2.json();
        if (!res2.ok || !rows2 || !rows2.length) throw new Error('사례를 찾을 수 없습니다.');
        var c = rows2[0];
        var title2 = c.work_type || c.accident_type || '건설 중대재해 사례';
        var rawSum = c.accident_summary ? String(c.accident_summary).replace(/<[^>]+>/g, '') : title2;
        if (typeof TAIDetailMeta !== 'undefined') TAIDetailMeta.setDetailMeta(title2, rawSum);
        if (titleEl) titleEl.textContent = title2;
        if (metaEl) {
          metaEl.textContent = [c.accident_type, c.occurrence_date].filter(Boolean).join(' · ');
        }
        var html = '';
        if (c.accident_summary) html += '<div class="mb-4">' + c.accident_summary + '</div>';
        if (bodyEl) bodyEl.innerHTML = html || '<p class="text-muted">상세 요약이 없습니다.</p>';
      }
    } catch (e) {
      if (errEl) errEl.textContent = e.message || '오류가 발생했습니다.';
      if (bodyEl) bodyEl.innerHTML = '';
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', load);
  else load();
})();
</script>
</body>
</html>
